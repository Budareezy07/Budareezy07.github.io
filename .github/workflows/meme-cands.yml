name: Meme picture candidates
on:
  push:
    branches: [meme-cands]
    paths: ['.github/meme_queries.txt', '.github/meme_cands.py']
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/meme_cands.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meme_cands && git commit -m "Meme picture candidates" && git push
