  { id:'p-comma', name:'Commas', out:'I can use commas in lists, after introductory words and around extra information.', lvl:['Commas in lists','Yes, no and names','Extra information'],
    learn:{rule:"Use commas to separate items in a <b>list</b>, after words like <i>Yes, No, Well</i> at the start, before the <b>name</b> of someone you speak to, after an opening phrase, and around <b>extra information</b>.",
      tip:"A comma is a tiny pause 🫧 Read the sentence aloud and take a little breath where the comma goes.", ex:["I like apples<b>,</b> pears and grapes.","Yes<b>,</b> I would love to.","My dog<b>,</b> a poodle<b>,</b> loves walks."]},
    gen:lv=> (o=>mc('Which sentence uses commas correctly?', o[0], o.slice(1), `<b>${escH(o[0])}</b>`))(rnd([COMMA1,COMMA2,COMMA3][lv-1])) },
  { id:'p-colon', name:'Colons, brackets & hyphens', out:'I can use colons before lists, brackets for extra information and hyphens in compound words.', lvl:['Colons','Brackets','Hyphens'],
    learn:{rule:"A <b>colon (:)</b> introduces a list or an explanation. <b>Brackets ( )</b> hold extra information that the sentence still makes sense without. A <b>hyphen (-)</b> joins words that work together: <i>twenty-one, well-known</i>.",
      tip:"A colon is a drumroll 🥁 'And the list is...' Brackets are a whisper 🤫 the sentence works without them.", ex:["You will need<b>:</b> a pen, a ruler and glue.","My cousin <b>(</b>who lives in Durban<b>)</b> is visiting.","twenty<b>-</b>one, ice<b>-</b>cold"]},
    gen:lv=> lv===3 ? M(rnd(HYPH3),'Hyphens join words that work together as one.') : (o=>mc(lv===1?'Which sentence uses the colon correctly?':'Which sentence uses brackets correctly?', o[0], o.slice(1), `<b>${escH(o[0])}</b>`))(rnd(lv===1?COLON1:BRACK2)) },
  { id:'p-contr', name:'Contractions', out:'I can write contractions with apostrophes and tell its/it\'s and their/they\'re apart.', lvl:['n\'t words','\'m, \'re, \'s, \'ve, \'ll','its, it\'s, their, they\'re'],
    learn:{rule:"A <b>contraction</b> joins two words and leaves out some letters. The <b>apostrophe</b> shows where the letters are missing.<br><b>it's</b> = it is. <b>its</b> = belonging to it.",
      tip:"The apostrophe is a little plaster 🩹 stuck on where letters fell out: do n<s>o</s>t → don't. Test it's: can you say 'it is'?", ex:["I am → I<b>'</b>m","do not → don<b>'</b>t","will not → won<b>'</b>t (a strange one!)"]},
    gen:lv=> lv===3 ? F(rnd(CONTR3),'Choose the correct word:','Remember: it\'s = it is, they\'re = they are, who\'s = who is.')
      : (([f,c])=>typeQ(`Write the contraction of "${f}"`, c, `${f} → <b>${c}</b>`))(rnd(lv===1?CONTR1:CONTR2)) },
  { id:'p-poss', name:'Apostrophes of ownership', out:'I can use apostrophes to show ownership for one or many owners.', lvl:['One owner','Many owners','Tricky plurals'],
    learn:{rule:"To show that something <b>belongs</b> to someone, add an apostrophe. One owner: <b>'s</b> (the dog's bone). Many owners ending in s: <b>s'</b> (the dogs' bones). Plurals without s: <b>'s</b> (the children's toys).",
      tip:"Find the owner first 🧍 then stick the apostrophe straight after the owner's name.", ex:["the <b>girl's</b> bag (one girl)","the <b>girls'</b> bags (many girls)","the <b>children's</b> toys"]},
    gen:lv=> (s=>{ const [q,a,...w]=s.split('|'); return mc('Fill in the gap:', a, w, `<b>${escH(fill(q.replace(/ \(.*\)/,''),a))}</b> ${['One owner: add \'s.','Many owners ending in s: put the apostrophe after the s.','Plurals without s just add \'s.'][lv-1]}`, {clue:q}); })(rnd([POSS1,POSS2,POSS3][lv-1])) },
  { id:'p-speech', name:'Direct & reported speech', out:'I can punctuate direct speech and change it into reported speech.', lvl:['Speech marks','Questions and split speech','Reported speech'],
    learn:{rule:"<b>Direct speech</b> uses the exact words, inside inverted commas: <i>\"I'm hungry,\" said Sipho.</i><br><b>Reported speech</b> tells what was said, with no inverted commas: <i>Sipho said that he was hungry.</i>",
      tip:"Inverted commas are a speech bubble 💬 Only the words that come out of the mouth go inside, and so does their punctuation!", ex:["\"<b>Watch out!</b>\" shouted Ben.","\"If you hurry,\" said Gran, \"you'll catch it.\"","Mia said <b>that she liked</b> pizza."]},
    gen:lv=> lv===3 ? (([d,a,o])=>mc('Which is the correct reported speech?', a, o, 'In reported speech: drop the inverted commas, add "that", change I/we to he/she/they, and move the verb back in time (am → was).', {clue:d}))(rnd(SPEECH))
      : (o=>mc('Which sentence is punctuated correctly?', o[0], o.slice(1), 'Only the spoken words go inside the inverted commas, and the punctuation of the speech goes inside too.'))(rnd(lv===1?DIRECT1:DIRECT2)) }
]},
{ id:'spelling', name:'Spelling Swamp', icon:'🐸', color:'#5a8f00',
  boss:{name:'Mozzie Misspell', e:'🦟', taunt:"Bzzzz! I'll mix up all your letterzzz!"},
  skills:[
  { id:'sp-bee', name:'Spelling bee', out:'I can spell the year\'s spelling words from dictation.', lvl:['Term 1 words','Term 2 words','Term 3 words'],
    learn:{rule:"Listen to the word, say it slowly in syllables, then write it one chunk at a time. Check it letter by letter.",
      tip:"Clap the syllables 👏 Feb-ru-a-ry. Im-me-di-ate-ly. Spell the chunks, not the whole thing at once!", ex:["be-<b>cause</b>","ne-<b>ces</b>-sa-ry (one collar, two sleeves: 1 c, 2 s)","sep-<b>a</b>-rate (there's <b>a rat</b> in separate!)"]},
    gen:lv=>{ const [w,s]=rnd(SPELL_TIER(lv)); return typeQ('Listen, then spell the word', w, `<b>${escH(w)}</b>: ${escH(s)}`, {speak:w, clue:blankWord(s,w)}); } },
  { id:'sp-spot', name:'Spot the mistake', out:'I can spot and correct spelling mistakes.', lvl:['Pick the right spelling (2)','Pick the right spelling (4)','Find the mistake in a sentence'],
    learn:{rule:"Good spellers check their work. Look carefully at every word: does it look right?",
      tip:"Look 👀 Say 🗣️ Cover ✋ Write ✍️ Check ✅ The best way to learn tricky words!", ex:["<s>recieve</s> → <b>receive</b>","<s>freind</s> → <b>friend</b>"]},
    gen:lv=>{ const [w,s]=rnd(SPELL_TIER(lv)), m=mutate(w.toLowerCase()).map(v=>w[0]===w[0].toUpperCase()?cap1(v):v);
      if (lv<3) return mc('Which word is spelt correctly?', w, sample(m, lv===1?1:3), `<b>${escH(w)}</b>: ${escH(s)}`, {clue:blankWord(s,w)});
      const bad=rnd(m), tokens=s.split(' ').map(t=>{ const x=t.match(/^([A-Za-z'-]+)(\W*)$/); return (x && x[1].toLowerCase()===w.toLowerCase()) ? {pre:'',w:bad,p:x[2],ok:true} : {pre:'',w:t,p:'',ok:false}; });
      return {type:'tap', prompt:'Tap the word that is spelt wrongly', tokens, answer:bad, explain:`It should be <b>${escH(w)}</b>.`}; } },
  { id:'sp-rules', name:'Spelling rules', out:'I can use spelling rules for ie/ei, doubling, dropping e and changing y to i.', lvl:['i before e','Double it or drop the e','Change y to i'],
    learn:{rule:"<b>i before e except after c</b> (when it says 'ee'): believe, receive.<br><b>Short vowel? Double it:</b> hop → hopping. <b>Magic e? Drop it:</b> hope → hoping.<br><b>Consonant + y:</b> change y to i: cry → cried.",
      tip:"A bunny 🐇 goes ho<b>pp</b>ing: two p's for two little hops! But you only hope once: ho<b>p</b>ing.", ex:["bel<b>ie</b>ve, rec<b>ei</b>ve","swi<b>mm</b>ing, wri<b>t</b>ing","cr<b>ied</b>, happ<b>iest</b>"]},
    gen:lv=> lv===1 ? (([w,wr])=>mc('Which is spelt correctly?', w, [wr], `<b>${w}</b>: i before e, except after c.`))(rnd(IEQ))
      : (s=>{ const [q,a,...w]=s.split('|'); return mc('Choose the correct spelling:', a, w, `<b>${escH(fill(q.replace(/ \(.*\)/,''),a))}</b>`, {clue:q}); })(rnd(lv===2?RULE2:RULE3)) },
  { id:'sp-silent', name:'Silent letters', out:'I can spell words with silent letters.', lvl:['Silent k and w','Silent b, h and g','Silent t, s, n and l'],
    learn:{rule:"Some words have letters we write but don't say: <b>k</b>nife, <b>w</b>rite, thum<b>b</b>, <b>h</b>our, <b>g</b>nome, cas<b>t</b>le, autum<b>n</b>, ha<b>l</b>f.",
      tip:"Silent letters are ninjas 🥷 They're there, but you never hear them!", ex:["<b>k</b>nee, <b>w</b>rong","lam<b>b</b>, <b>h</b>onest","lis<b>t</b>en, ca<b>l</b>m"]},
    gen:lv=>{ const [w,l]=rnd([SIL1,SIL2,SIL3][lv-1]), i=w.indexOf(l), shown=w.slice(0,i)+'_'+w.slice(i+1);
      return mc('Which silent letter is missing?', l, sample(['k','w','b','h','g','t','s','l','n'].filter(x=>x!==l),3), `<b>${w.slice(0,i)}<u>${l}</u>${w.slice(i+1)}</b>`, {clue:shown, speak:w}); } },
  { id:'sp-abc', name:'Dictionary skills', out:'I can put words in alphabetical order to the second and third letter.', lvl:['First letters','Second letters','Third letters and beyond'],
    learn:{rule:"Dictionaries list words in <b>alphabetical order</b>. If the first letters are the same, look at the second letter. Still the same? Look at the third!",
      tip:"Be a word detective 🔍 Same letter? Take one step to the right and compare again.", ex:["c<b>a</b>t, c<b>l</b>oud (a comes before l)","bre<b>a</b>d, bri<b>d</b>ge","sta<b>c</b>k, sta<b>m</b>p, sta<b>r</b>"]},
    gen:lv=>{ let words;
      if (lv===1){ const ls=sample(uniq(ABC.map(w=>w[0])),4); words=ls.map(l=>rnd(ABC.filter(w=>w[0]===l))); }
      else if (lv===2){ const L=rnd('abcdefgh'.split('')); words=[...sample(ABC.filter(w=>w[0]===L),3), rnd(ABC.filter(w=>w[0]!==L))]; }
      else words=sample(rnd(ABC3),4);
      words=uniq(words).sort((a,b)=>a.localeCompare(b));
      return pct(.7) ? orderQ('Put these words in alphabetical order.', words, words.map(w=>`<b>${w}</b>`).join(', '))
        : mc('Which word comes FIRST in the dictionary?', words[0], words.slice(1), `Alphabetical order: ${words.join(', ')}`); } },
  { id:'sp-abbr', name:'Abbreviations & acronyms', out:'I can read and use common abbreviations and acronyms.', lvl:['Titles and measurements','e.g., etc., a.m., p.m.','Acronyms'],
    learn:{rule:"An <b>abbreviation</b> is a short way of writing a word: <i>Dr</i> for Doctor. An <b>acronym</b> is made from first letters: <i>RSVP</i>, <i>ATM</i>.",
      tip:"Abbreviations are words on a diet 🥗 Same meaning, fewer letters!", ex:["<b>km</b> = kilometre","<b>e.g.</b> = for example","<b>RSVP</b> = please reply"]},
    gen:lv=>{ const pool=[ABBR1,ABBR2,ABBR3][lv-1]; if (pct(.3)) return matchQ('Match each short form to its meaning.', sample(pool,4));
      const [a,m]=rnd(pool); return mc(`What does "${a}" stand for?`, m, sample(pool.filter(x=>x[1]!==m).map(x=>x[1]),3), `<b>${a}</b> = ${m}`); } }
]},
{ id:'wordplay', name:'Wordplay Waterfall', icon:'🌊', color:'#d6336c',
  boss:{name:'The Riddle Dragon', e:'🐉', taunt:"Rrroar! Only a true word wizard can solve my riddles!"},
  skills:[
  { id:'w-syn', name:'Synonyms & antonyms', out:'I can use synonyms and antonyms, and choose the strongest word.', lvl:['Synonyms','Antonyms','Shades of meaning'],
    learn:{rule:"<b>Synonyms</b> are words with the same (or nearly the same) meaning: <i>big / enormous</i>. <b>Antonyms</b> are words with opposite meanings: <i>arrive / depart</i>. Some synonyms are stronger than others: <i>warm → hot → scorching</i>.",
      tip:"<b>S</b>ynonym = <b>S</b>ame 🟰  <b>A</b>ntonym = <b>A</b>gainst ↔️", ex:["happy = <b>joyful</b>","shallow ↔ <b>deep</b>","annoyed → angry → <b>furious</b>"]},
    gen:lv=>{ if (lv===1){ if (pct(.25)) return matchQ('Match each word to its SYNONYM.', sample(SYN,4)); const [w,s]=rnd(SYN); return mc(`Which word means the SAME as "${w}"?`, s, sample(SYN.filter(x=>x[0]!==w).map(x=>x[1]),3), `<b>${w}</b> and <b>${s}</b> are synonyms.`); }
      if (lv===2){ const [w,a]=rnd(ANT); return mc(`Which word means the OPPOSITE of "${w}"?`, a, sample(ANT.filter(x=>x[0]!==w).map(x=>x[1]),3), `<b>${w}</b> and <b>${a}</b> are antonyms.`); }
      return F(rnd(SYN3),'Choose the STRONGEST word for the meaning in brackets:'); } },
  { id:'w-homo', name:'Homophones & homonyms', out:'I can use homophones correctly and explain homonyms.', lvl:['Sound-alike words','there, their, they\'re...','Homonyms'],
    learn:{rule:"<b>Homophones</b> sound the same but are spelt differently: <i>see / sea</i>.<br><b>Homonyms</b> are spelt the same but mean different things: a <i>bat</i> 🦇 and a cricket <i>bat</i> 🏏.",
      tip:"<b>their</b> = belongs to them (it hides 'heir' 👑). <b>there</b> = a place (it hides 'here' 📍). <b>they're</b> = they are.", ex:["I can <b>see</b> the <b>sea</b>.","<b>Their</b> dog is over <b>there</b>.","<b>They're</b> late!"]},
    gen:lv=> lv===1 ? (([s,a,o])=>mc('Choose the correct homophone:', a, o, `<b>${escH(fill(s,a))}</b>`, {clue:s}))(rnd(HOMO1))
      : lv===2 ? F(rnd(HOMO2),'Choose the correct word:')
      : (([w,a,b])=>mc(`Which ONE word can mean both "${a}" and "${b}"?`, w, sample(HOMONYM.filter(x=>x[0]!==w).map(x=>x[0]),3), `<b>${w}</b> is a homonym: same spelling, different meanings.`))(rnd(HOMONYM)) },
  { id:'w-affix', name:'Prefixes & suffixes', out:'I can use prefixes and suffixes to change the meaning of words.', lvl:['un- and dis-','Suffixes','im-, il-, ir-, re-, pre-, mis-'],
    learn:{rule:"A <b>prefix</b> goes at the START of a word and changes its meaning: <i>un-, dis-, im-, re-, pre-, mis-</i>. A <b>suffix</b> goes at the END: <i>-ful, -less, -ness, -ly, -er, -able</i>.",
      tip:"<b>Pre</b> means 'before', so the <b>pre</b>fix comes before the word 🚂 The suffix is the caboose at the back!", ex:["<b>un</b>happy, <b>dis</b>agree, <b>re</b>write","hope<b>ful</b>, hope<b>less</b>, kind<b>ness</b>"]},
    gen:lv=>{ if (lv===2){ const [q,a,o]=rnd(SUFFIX); return mc(q, a, o, `<b>${a}</b>`); }
      if (lv===3 && pct(.4)){ const [w,m]=rnd(PRE_MEAN); return mc(`What does "${w}" mean?`, m, sample(PRE_MEAN.filter(x=>x[0]!==w).map(x=>x[1]),3), `<b>${w}</b> means ${m}.`); }
      const pool=PREFIX.filter(x=>lv===1?['un','dis'].includes(x[1]):!['un','dis'].includes(x[1])), [w,p]=rnd(pool);
      return mc(`Which prefix makes the opposite of "${w}"?`, p+w, sample(PREFIXES.filter(x=>x!==p),3).map(x=>x+w), `<b>${p}-</b> + ${w} = <b>${p+w}</b>`); } },
  { id:'w-dim', name:'Compound words & diminutives', out:'I can build compound words and use diminutives.', lvl:['Build compound words','Spot compound words','Diminutives'],
    learn:{rule:"A <b>compound word</b> is made by joining two words: <i>sun + flower = sunflower</i>.<br>A <b>diminutive</b> is a word for a small or young version of something: <i>duck → duckling, book → booklet</i>.",
      tip:"Diminutive endings shrink things! 🔍 <b>-ling, -let, -ette, -ock</b>: duck<b>ling</b>, pig<b>let</b>, kitchen<b>ette</b>.", ex:["tooth + brush = <b>toothbrush</b>","pig → <b>piglet</b>","goose → <b>gosling</b>"]},
    gen:lv=> lv===1 ? matchQ('Match the halves to make compound words.', sample(COMPOUND,4))
      : lv===2 ? (([a,b])=>mc('Which word is a COMPOUND word?', a+b, sample(NONCOMP,3), `<b>${a+b}</b> = ${a} + ${b}`))(rnd(COMPOUND))
      : (([b,d])=>mc(`What is the diminutive (small form) of "${b}"?`, d, sample(DIM.filter(x=>x[1]!==d).map(x=>x[1]),3), `${b} → <b>${d}</b>`))(rnd(DIM)) },
  { id:'w-fig', name:'Figurative language', out:'I can identify and explain similes, metaphors, personification, alliteration and onomatopoeia.', lvl:['Simile or metaphor?','All five figures','What does it mean?'],
    learn:{rule:"<b>Simile:</b> compares using <i>like</i> or <i>as</i>.<br><b>Metaphor:</b> says something IS something else.<br><b>Personification:</b> gives human actions to things.<br><b>Alliteration:</b> words start with the same sound.<br><b>Onomatopoeia:</b> words that sound like the noise.",
      tip:"A <b>sim</b>ile is <b>sim</b>ilar, it uses like or as 🪞 A metaphor is bolder: it says it IS!", ex:["as brave as a lion <i>(simile)</i>","The classroom was a zoo. <i>(metaphor)</i>","The wind whispered. <i>(personification)</i>"]},
    gen:lv=>{ if (lv===3) return M(rnd(FIGM3),'Figurative language paints a picture; it doesn\'t mean exactly what it says.');
      const pool = lv===1 ? FIG.filter(f=>f[1]==='simile'||f[1]==='metaphor') : FIG;
      if (lv===2 && pct(.25)) return matchQ('Match each sentence to its figure of speech.', sample(FIG_TYPES,4).map(t=>[rnd(FIG.filter(f=>f[1]===t))[0], t]));
      const [s,t,e]=rnd(pool); return mc('What kind of figurative language is this?', t, lv===1?['simile','metaphor']:sample(FIG_TYPES.filter(x=>x!==t),3), e, {clue:s}); } },
  { id:'w-idiom', name:'Idioms & proverbs', out:'I can explain the meaning of common idioms and proverbs.', lvl:['Everyday idioms','More idioms','Proverbs'],
    learn:{rule:"An <b>idiom</b> is a saying that means something different from its actual words. A <b>proverb</b> is a short, wise saying that gives advice.",
      tip:"Idioms don't mean what they say! If it's raining cats and dogs, no pets are falling from the sky 🐈🐕☔", ex:["a piece of cake = <b>very easy</b>","Many hands make light work = <b>work is easier when we all help</b>"]},
    gen:lv=>{ if (lv===3){ const [p,m]=rnd(PROVERBS); return mc('What does this proverb mean?', m, sample(PROVERBS.filter(x=>x[0]!==p).map(x=>x[1]),3), 'A proverb is a short saying that gives advice.', {clue:p}); }
      const h=Math.ceil(IDIOMS.length/2), pool = lv===1 ? IDIOMS.slice(0,h) : IDIOMS.slice(h), [i,m]=rnd(pool);
      return mc('What does this idiom mean?', m, sample(IDIOMS.filter(x=>x[0]!==i).map(x=>x[1]),3), 'An idiom means something different from its actual words.', {clue:i}); } }
]},
{ id:'reading', name:'Reading Reeds', icon:'📖', color:'#c0392b',
  boss:{name:'The Page Ghost', e:'👻', taunt:"Boooo! I've made the words vanish. Prove you can read!"},
  skills:[
  { id:'r-comp', name:'Comprehension', out:'I can read a text and answer literal, inferential and vocabulary questions about it.', lvl:['Term 1 texts','Term 2 texts','Term 3 texts'],
    learn:{rule:"Read the whole text once to get the big picture. Then read each question, find the part of the text that answers it, and check your answer makes sense.",
      tip:"Be a detective 🕵️ The clues are IN the text. Point to the sentence that proves your answer!", ex:["Right there: the answer is in one sentence.","Think and search: you put clues together.","Read between the lines: what does the writer suggest?"]},
    round:lv=> sample(ALL_PASSAGES.filter(p=>p.lv===lv && !p.poster),2).flatMap(p=>p.qs.map(([q,a,o,e])=>mc(q,a,o,e,{passage:p}))),
    gen:lv=>{ const p=rnd(ALL_PASSAGES.filter(p=>p.lv===lv && !p.poster)), [q,a,o,e]=rnd(p.qs); return mc(q,a,o,e,{passage:p}); } },
  { id:'r-infer', name:'Reading between the lines', out:'I can use clues in a text to work out feelings, settings and what will happen next.', lvl:['How do they feel?','Where and when?','Why? What next?'],
    learn:{rule:"Writers don't always tell you everything. <b>Inferring</b> means using clues in the text plus what you already know to work out what is happening.",
      tip:"Clues + what I know = my inference 🧩 <i>She slammed the door</i> + <i>people slam doors when they're angry</i> = she is angry!", ex:["'His hands shook' → he is <b>nervous</b>","'The streetlights came on' → it is <b>evening</b>"]},
    gen:lv=>{ const [clue,q,spec,e]=rnd([INFER1,INFER2,INFER3][lv-1]); return C(clue,q,spec,e); } },
  { id:'r-skim', name:'Skimming & scanning', out:'I can scan notices, timetables, contents pages and indexes to find information quickly.', lvl:['Notices and posters','Timetables','Contents pages and indexes'],
    learn:{rule:"<b>Skimming</b> means reading quickly to get the main idea. <b>Scanning</b> means looking quickly for one detail, like a time, a price or a name, without reading every word.",
      tip:"Scanning is like a radar 📡 Decide what you're looking for (a number? a name?) and let your eyes zoom down the page until you spot it.", ex:["Looking for a time? Scan for numbers with a colon: 8:00","Looking for a page? Use the contents page or index."]},
    round:lv=> SCAN.filter(p=>p.lv===lv).flatMap(p=>p.qs.map(([q,a,o,e])=>mc(q,a,o,e,{passage:p}))),
    gen:lv=>{ const p=rnd(SCAN.filter(p=>p.lv===lv)), [q,a,o,e]=rnd(p.qs); return mc(q,a,o,e,{passage:p}); } },
  { id:'r-visual', name:'Adverts & posters', out:'I can read visual texts and explain their purpose, audience and persuasive techniques.', lvl:['What is it about?','How does it persuade?','Message and audience'],
    learn:{rule:"<b>Visual texts</b> like adverts and posters use words, pictures and layout together. Adverts try to <b>persuade</b> you, using catchy <b>slogans</b>, exciting adjectives, special offers and opinions that sound like facts.",
      tip:"Ask the three Ws ❓ <b>Who</b> is it for? <b>What</b> does it want me to do? <b>Which</b> words are trying to convince me?", ex:["'The crunchiest breakfast in the universe!' → opinion","'Packed with whole grains' → fact"]},
    round:lv=> ALL_VISUAL.filter(p=>p.lv===lv).flatMap(p=>p.qs.map(([q,a,o,e])=>mc(q,a,o,e,{passage:p}))),
    gen:lv=>{ const p=rnd(ALL_VISUAL.filter(p=>p.lv===lv)), [q,a,o,e]=rnd(p.qs); return mc(q,a,o,e,{passage:p}); } },
  { id:'r-summary', name:'Main idea & summaries', out:'I can identify the main idea of a paragraph and choose a good title and summary.', lvl:['Find the main idea','Choose the best title','Choose the best summary'],
    learn:{rule:"The <b>main idea</b> is what the whole paragraph is mostly about. A good <b>title</b> fits the main idea. A good <b>summary</b> is short and includes only the most important points, in your own words.",
      tip:"Imagine a tweet 📱 If you could only use one sentence to tell a friend what the paragraph is about, what would you say?", ex:["Not a small detail, but the big idea.","A summary is much shorter than the text."]},
    gen:lv=>{ const s=rnd(SUMM), spec=[s.idea,s.title,s.sum][lv-1]; return C(s.p, ['What is the MAIN IDEA of this paragraph?','Which is the BEST title for this paragraph?','Which is the BEST summary of this paragraph?'][lv-1], spec, 'The best answer covers the whole paragraph, not just one detail.'); } },
  { id:'r-fact', name:'Fact or opinion', out:'I can tell facts and opinions apart and spot opinion words.', lvl:['Sort facts and opinions','Fact or opinion?','Spot the opinion word'],
    learn:{rule:"A <b>fact</b> is true and can be proven. An <b>opinion</b> is what someone thinks or feels; other people may disagree.",
      tip:"Can you prove it? ✅ Fact! Is it someone's feeling? 💭 Opinion! Watch for words like <i>best, worst, beautiful, boring, should</i>.", ex:["Lions are mammals. <i>(fact)</i>","Lions are the most beautiful animals. <i>(opinion)</i>"]},
    gen:lv=> lv===1 ? sortQ('Sort the sentences. Tap one, then tap its group.', ['Fact','Opinion'], [FACTS, OPINIONS], 2)
      : lv===2 ? (pct(.5) ? (s=>mc('Is this a fact or an opinion?', 'fact', ['fact','opinion'], 'This can be proven, so it is a <b>fact</b>.', {clue:s}))(rnd(FACTS)) : (s=>mc('Is this a fact or an opinion?', 'opinion', ['fact','opinion'], 'This is what someone thinks, so it is an <b>opinion</b>.', {clue:s}))(rnd(OPINIONS)))
      : tq(rnd(OPIN_TAP),'Tap the word that makes this an OPINION','Words like best, boring and beautiful show what someone thinks.') },
  { id:'r-seq', name:'Sequencing', out:'I can put events, instructions and life cycles in the correct order.', lvl:['Four events','Five events','Six events'],
    learn:{rule:"<b>Sequence</b> means the order in which things happen. Stories, instructions and life cycles all follow a sequence.",
      tip:"Look for time words ⏱ <i>first, then, next, after that, finally</i>. And ask: what HAS to happen before this?", ex:["First the egg, then the caterpillar, then the chrysalis, finally the butterfly 🦋"]},
    gen:lv=> (s=>orderQ('Put the events in the right order. Tap them from first to last.', s, s.map((x,i)=>`${i+1}. ${escH(x)}`).join('<br>'), {long:true}))(rnd([STORIES,SEQ5,SEQ6][lv-1])) },
  { id:'r-types', name:'Text types & purpose', out:'I can identify text types, their features and their purpose.', lvl:['Name the text type','Text features','Why was it written?'],
    learn:{rule:"Different texts have different jobs. <b>Narratives</b> entertain. <b>Instructions</b> tell you how. <b>Information reports</b> inform. <b>Letters</b> send messages. <b>Adverts</b> persuade. <b>Poems</b> play with sound and rhythm.",
      tip:"Ask: what is this text trying to DO? 🎯 Entertain, inform, instruct or persuade?", ex:["A recipe → instructions","'Buy now! Only R99!' → advertisement"]},
    gen:lv=> lv===1 ? (([c,t])=>mc('What type of text is this?', t, sample(TTYPES.filter(x=>x[1]!==t).map(x=>x[1]),3), `This is a <b>${t}</b>.`, {clue:c}))(rnd(TTYPES))
      : lv===2 ? (([q,a,o])=>mc(q,a,o,`The answer is <b>${a}</b>.`))(rnd(TFEAT)) : M(rnd(PURPOSE)) },
  { id:'r-poem', name:'Poetry', out:'I can identify rhyme, rhythm, stanzas and figurative language in poems.', lvl:['Rhyming words','Poetry words','Read a poem'],
    learn:{rule:"Poems are written in <b>lines</b>. A group of lines is a <b>stanza</b>. Words that end with the same sound <b>rhyme</b> (night / kite). <b>Rhythm</b> is the beat of the poem. A rhyme pattern like AABB shows which lines rhyme.",
      tip:"Clap the beat 👏 and listen for the rhyme at the end of each line 🎵", ex:["The cat sat on a <b>mat</b> (A)","And wore a funny <b>hat</b> (A)"]},

const CH_RATE = 0.65;
Object.entries(CH).forEach(([id, list]) => {
  const k = SK(id); if (!k) return;
  const base = k.gen;
  k.gen = lv => (lv===3 && Math.random()<CH_RATE) ? Object.assign(rnd(list)(), {ch:true}) : base(lv);
  if (!/challenge/i.test(k.lvl[2])) k.lvl[2] = k.lvl[2] + ' + challenge';
  k.challenge = true;
});

function heronSVG(look, cls='', crop=false){

   ${C.body==='RAINBOW'?`<defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".25" stop-color="#f5b700"/><stop offset=".5" stop-color="#4cd964"/><stop offset=".75" stop-color="#2f80ed"/><stop offset="1" stop-color="#8e44ad"/></linearGradient></defs>`:''}

function writingChecks(text){
  const t = text.trim(), words = t.split(/\s+/).filter(w=>/[a-z]/i.test(w)), low = ' '+t.toLowerCase()+' ';
  const ly = (t.toLowerCase().match(/\b[a-z]{3,}ly\b/g)||[]).filter(w=>!NOT_ADV.includes(w));
  return [
   {k:'cap', n:'Starts with a capital letter', ok:/^["']?[A-Z]/.test(t)},
   {k:'end', n:'Ends with . ! or ?', ok:/[.!?]["']?$/.test(t)},
   {k:'len', n:'At least 8 words', ok:words.length>=8},
   {k:'adv', n:'An adverb (an -ly word)', ok:ly.length>0},
   {k:'sim', n:'A simile (like a... / as ... as)', ok:/\blike (a|an|the|my|his|her|some|two|three)\b|\bas [a-z]+ as\b/i.test(t)},
   {k:'conj', n:'A joining word (and, but, because...)', ok:/\b(and|but|because|so|although|when|while|until|after|before|since|if)\b/i.test(t)},
   {k:'wow', n:'A WOW word (try a word of the day!)', ok:WOW.some(w=>new RegExp('\\b'+w+'\\b','i').test(low))},
   {k:'comma', n:'A comma', ok:/,/.test(t)}
  ];
}

const wSent = t => (t.match(/[^.!?]+[.!?]+/g)||[]).length;

const wLines = t => t.split('\n').map(x=>x.trim()).filter(Boolean);
const wHas = (t, re) => re.test(t);
const wCount = (t, re) => (t.match(re)||[]).length;

const SENSES = /\b(see|saw|look|looks|looked|hear|heard|sound|sounds|smell|smells|smelled|taste|tastes|tasted|feel|feels|felt|touch)\b/gi;
const SIMILE = /\blike (a|an|the|my|his|her)\b|\bas [a-z]+ as\b/i;

PSG('lunchbox','The Wrong Lunchbox','narrative',1,`
On her first morning at Kingfisher Primary, Zanele made three promises to herself. She would not get lost. She would not cry. And she would not, under any circumstances, let anyone see how nervous she was.

By break time she had already broken the first promise twice. The school was enormous compared with her old one in Mthatha, a maze of identical corridors that all seemed to lead back to the same noticeboard. When the bell finally rang, she found a quiet bench beneath a jacaranda tree, sat down with relief and opened her lunchbox.

Inside, instead of the cheese sandwich her mother had packed, lay two samoosas, a carefully peeled naartjie and a folded note in purple ink: "Good luck in the maths test, Priya! Love, Mum."

Zanele stared at the note. Somewhere in the school, a girl called Priya was probably staring at a cheese sandwich and wondering the same thing.

Her first instinct was to close the lid and pretend nothing had happened. Talking to strangers was exactly what her stomach had been dreading all morning. But the note bothered her. Priya had a maths test, and Priya's mother had wished her luck, and now Priya would never see the message.

So Zanele did something that surprised even herself. She walked into the busiest part of the playground, took a deep breath and called out, "Is anybody here called Priya?"

A dozen heads turned. Her cheeks burned. Then a girl with a long plait pushed through the crowd, holding up a blue lunchbox exactly like Zanele's. "I think," the girl said, trying not to laugh, "you have my samoosas."

They swapped lunchboxes, and Zanele handed over the note. Priya read it and smiled. "Mum always does this. She thinks I'll forget how to do fractions without her."

"Will you?" asked Zanele.

"Probably," Priya admitted. "Are you any good at fractions?"

As it happened, fractions were the one thing Zanele had always been good at. They spent the rest of break on the jacaranda bench, sharing samoosas and drawing pizza diagrams in the dust with a stick.

That afternoon, Zanele realised she had broken her third promise as well. Everyone had seen how nervous she was. Strangely, it no longer seemed to matter.`,

PSG('heron','The Patient Hunter','information',1,`
If you walk along the edge of a vlei early in the morning, you may notice what looks like a grey statue standing in the shallow water. It does not move for minutes at a time. Then, faster than your eye can follow, it strikes. When it straightens up again, a wriggling fish is clamped in its beak. You have just watched a grey heron at work.

The grey heron is one of the most widespread wading birds in Africa, Europe and Asia, and it is common throughout South Africa wherever there is fresh water. An adult stands almost a metre tall, with long legs, a long neck and a dagger-shaped yellow bill. Its wingspan can be wider than an adult person's outstretched arms.

Herons are ambush hunters. Rather than chasing their prey, they rely on patience and precision. A heron will stand perfectly still, or wade forward with slow, deliberate steps, until a fish, frog or crab comes within reach. Its neck is folded into an S-shape, ready to shoot forward like a spring. Herons are not fussy eaters: as well as fish, they will swallow mice, insects, lizards and even small birds whole.

In flight, a heron is easy to identify. Unlike storks and cranes, which fly with their necks stretched out in front, a heron tucks its neck back into its shoulders and flaps slowly with deep, powerful wingbeats, its long legs trailing behind.

Herons usually breed in groups called heronries. They build large, untidy nests of sticks high in trees or deep in reed beds, often returning to the same site year after year. Both parents take turns to sit on the eggs and to feed the chicks, which are noisy, hungry and remarkably unattractive for their first few weeks.

South Africa is also home to the Goliath heron, the largest heron in the world, which can stand about one and a half metres tall. Like its grey cousin, it depends on healthy rivers and wetlands. When wetlands are drained for building or polluted with litter and chemicals, herons lose both their food and their nesting sites. Protecting our vleis therefore protects these patient hunters too.`,

PSG('baobab','The Upside-Down Tree','information',1,`
Driving through northern Limpopo in winter, you might think that someone had pulled a giant tree out of the ground and planted it back upside down. Its enormous trunk is swollen like a bottle, and its bare, twisted branches spread out like roots against the sky. This is the baobab, one of the most remarkable trees on Earth.

A San legend explains its strange shape. When the gods were creating the world, each animal was given a tree to plant. The hyena, who arrived last and was in a bad mood, was given the baobab. Out of spite, he planted it upside down, and it has grown that way ever since.

The scientific explanation is less dramatic but just as interesting. Baobabs grow in hot, dry areas where rain may not fall for months. To survive, the tree stores huge amounts of water in its soft, spongy trunk, which swells in the rainy season and shrinks again in the dry season. For most of the year it has no leaves at all, which reduces the amount of water it loses. That is why it looks so bare.

Baobabs can live for an astonishingly long time. Scientists have used carbon dating to show that some African baobabs are well over 1 000 years old. Because their trunks often become hollow with age, people have used them as shelters, storerooms and even, in one famous case in Limpopo, as a small pub.

The tree is valuable to people and animals alike. Its large, velvety fruit, sometimes called "monkey bread", contains a dry, chalky pulp that is rich in vitamin C. The leaves can be cooked like spinach, and the bark can be pounded into fibres for making rope. Elephants strip the bark and chew the moist wood when water is scarce. The baobab's white flowers open at night and are pollinated mainly by fruit bats.

Sadly, some of the oldest baobabs in southern Africa have died in recent years. Scientists are still investigating why, but many believe that rising temperatures and longer droughts may be partly responsible. Protecting these ancient giants means protecting the environment in which they grew.`,

For the whole of the first half, Kayla sat on the bench with her bib folded in her lap and watched. She had been chosen for the Under-11 netball team only a week earlier, and Coach Mokoena had made it clear that substitutes needed to be patient.

Patience was not Kayla's strongest skill.

From the bench, she could see everything: Ruby's lightning passes, Thato's perfect shooting arc, and the way the opposing team's tall goal defence kept intercepting the ball whenever it went down the left side of the court. By half-time, Kingfisher were losing 9 to 14, and the girls trooped off with their heads down.

"Their defence is reading every pass," Coach Mokoena said, frowning at her clipboard. "We need a new plan."

Kayla hesitated. Substitutes were supposed to listen, not talk. But she had spent twenty minutes watching, and she had noticed something. "Coach," she said quietly, "their goal defence always moves left. Every single time. If we fake left and pass right, she'll be out of position."

Several of the older girls exchanged looks. Coach Mokoena studied Kayla for a long moment. Then she wrote something on her clipboard. "Kayla, bib on. You're wing attack for the last quarter. Show us."

Kayla's heart thumped so hard she was sure the whole hall could hear it.

The first time she received the ball, she was so nervous that her pass went straight out of court. Someone in the crowd groaned. Kayla felt her face turn hot, but she remembered what her grandfather always said after a bad shot in the backyard: "One mistake is just information."

The next time, she faked to the left, watched the tall defender lunge the wrong way, and fired the ball right to Thato, who scored without even looking at the post. Then it happened again, and again. With two minutes left, the score was 17 all.

The final goal came from Thato too, from a pass by Ruby. Kayla did not score a single goal that afternoon, and her name was not mentioned in the newsletter the following week.

But on Monday, when Coach Mokoena pinned up the team for the next match, Kayla's name was not on the bench. It was in the starting seven.`,

Mountain View Camp
Magaliesberg
14 March

Dear Mom, Dad and Sizwe,

I'm writing this by torchlight because it's after lights out and Mrs Adams thinks we're asleep. Please don't tell her. Camp is the best thing that has ever happened to me, and also the most terrifying, sometimes in the same hour.

On Monday we hiked to the top of the ridge. It took nearly three hours, and Liam complained for every single minute of them. When we finally reached the top, though, even Liam went quiet. You could see for kilometres: the dam glittering like a mirror, the hills turning purple in the late sun, and a black eagle circling so close that we could hear the wind in its feathers.

Tuesday was abseiling day. I'll be honest: when I looked down that cliff, my legs turned to jelly. The instructor, a woman called Zinhle who has climbed mountains in Lesotho, told me to trust the rope and not to look down. I looked down anyway. Then I took one step backwards, then another, and suddenly I was halfway down and laughing. I'm going to do it again on Thursday, and this time I want to go first.

Now for the bad news. On Tuesday night a troop of baboons raided our dormitory while we were at supper. They opened three suitcases, ate a whole packet of Ayanda's rusks and stole one of my socks. Zinhle says baboons are very clever and that we should never have left the windows open. I suppose that's fair, but I still want my sock back.

The food here is surprisingly good, except for the porridge, which has the texture of wet cement. I'm eating everything else, so please don't worry, Mom.

Tonight we're doing a night walk to look for scorpions with UV torches. Apparently they glow an eerie blue-green in the dark. Sizwe, I know you think scorpions are cool, so I'll try to take a photo for you, as long as one doesn't climb up my leg.

I miss you all, but I don't want to come home yet. Can I come back next year?

Lots of love,
Nomvula

P.S. Please could you buy me new socks?`,

PSG('birdfeeder','How to Make a Pine Cone Bird Feeder','instructions',1,`
A pine cone bird feeder is cheap, quick to make and an excellent way to attract garden birds such as weavers, white-eyes and bulbuls. Follow these instructions carefully, and you could have visitors within a day.

You will need:
• one large, open pine cone (the drier, the better)
• about 60 cm of strong garden string
• two tablespoons of smooth peanut butter or soft lard
• half a cup of wild-bird seed
• a blunt knife or spatula
• a tray or sheet of newspaper

Method
1. Tie the string tightly around the top of the pine cone, between the scales, so that it cannot slip off. Leave a long tail of string for hanging.
2. Spread the newspaper on a flat surface. This will save you a great deal of cleaning up later.
3. Using the blunt knife, push peanut butter deep into the gaps between the scales. Do not simply coat the outside, as the birds will finish this too quickly and the seed will fall off.
4. Pour the seed onto the tray. Roll the sticky pine cone in the seed, pressing gently so that the seeds stick firmly.
5. Place the feeder in the fridge for about thirty minutes. This helps the peanut butter set, so that the seed stays in place.
6. Hang the feeder from a branch at least one and a half metres above the ground and away from dense bushes.

Tips for success
• Choose a spot that you can see from a window, but not too close to it, so that birds do not fly into the glass.
• Hanging the feeder away from bushes makes it harder for cats to hide and pounce.
• Do not use salted or crunchy peanut butter. Salt is harmful to birds, and large pieces of nut can choke young chicks.
• Refill the feeder every few days, and clean it if it becomes mouldy.

Once your feeder is up, keep a notebook nearby. Record which birds visit, at what time of day and how many come at once. After a few weeks, you may be surprised by how many different species live in your neighbourhood.`,

PSG('tortoise','Tortoise and the Great Race','folktale',1,`
Long ago, when the rains failed for three years in a row, every waterhole on the plain dried up except one. It was a small pool in the shade of a fig tree, and there was barely enough water in it for all the animals to drink.

Hare, who was the fastest creature on the plain and never let anyone forget it, stood on a rock and made an announcement. "There is not enough water for everybody," he declared. "So it should belong to the fastest animal. Tomorrow I will race anyone who dares, from the baobab to the fig tree. Whoever wins will own the waterhole."

The animals muttered unhappily. Nobody could outrun Hare. Then a slow, creaking voice came from the grass. "I will race you," said Tortoise.

Hare laughed so hard that he fell off his rock. "You? It takes you all morning to cross a footpath!"

"Nevertheless," said Tortoise calmly, "I accept."

That night, while Hare slept soundly, Tortoise visited his many brothers and cousins. Tortoises, as everyone knows, look exactly alike. He placed one cousin behind each of the anthills along the path, and his oldest brother in the long grass beside the fig tree. "When you hear Hare coming," he told them, "step out ahead of him and call out."

The next morning, the whole plain gathered to watch. Hare sprinted away from the baobab in a cloud of dust. When he reached the first anthill, he glanced back to laugh at Tortoise, but a voice called from the path ahead of him: "Hurry up, Hare! You're falling behind!"

Hare could not believe his eyes. He ran faster. At the second anthill, the same thing happened, and at the third, and the fourth. By the time Hare staggered towards the fig tree, gasping and dizzy, Tortoise's oldest brother was already resting in the shade, pretending to yawn.

Hare collapsed in shame and slunk away into the bush. That evening, Tortoise climbed onto the same rock and called the animals together. "The water does not belong to the fastest," he said, "nor to the cleverest. It belongs to all of us. Let us share it."

And so they did, a little each day, until the rains finally returned.

Some say Tortoise was a cheat. Others say he simply used his head to defeat a bully. The storytellers have been arguing about it ever since.`,

LEARNERS HAUL TONNE OF RUBBISH FROM JUKSKEI
By Thabo Nkosi, Staff Reporter

FOURWAYS – More than 200 learners from Kingfisher Primary School removed over a tonne of rubbish from a stretch of the Jukskei River on Saturday morning, in what organisers have called the biggest community clean-up the area has seen this year.

Armed with gloves, grabbers and refuse bags, the Grade 4 to 7 learners worked alongside parents, teachers and volunteers from a local conservation group for four hours. Between them, they filled 340 bags with plastic bottles, chip packets, polystyrene containers and, in one case, an entire shopping trolley.

The idea came from Grade 6 learner Lerato Dlamini, 12, who noticed the pollution while walking her dog along the riverbank. "There was so much plastic caught in the reeds that you could hardly see the water," she said. "I kept thinking: if we don't do something, who will?"

Lerato presented her idea to the school's eco-club, which then contacted the conservation group, Friends of the Jukskei. Within three weeks, the plan had grown from a small club outing into a whole-school event.

Mr Sipho Radebe, the group's chairperson, said the Jukskei is one of the most polluted rivers in Gauteng. "Most of this rubbish doesn't start here," he explained. "It is dropped in streets kilometres away, washed into storm-water drains by the rain, and carried straight into the river. Every bottle we pick up today is one that won't end up in the sea."

The volunteers also recorded the types of litter they collected. Plastic bottles made up the largest share, followed by sweet wrappers and polystyrene. The results will be sent to the local council to support the group's call for more bins and regular street sweeping in nearby neighbourhoods.

Not everyone was convinced that the event would make a lasting difference. "It's a wonderful effort," said one resident, who asked not to be named, "but the river will be full again after the next big storm unless people change their habits."

The principal, Mrs Naidoo, agreed that the clean-up was only a beginning. "Today was about more than rubbish," she said. "Our learners have seen with their own eyes where litter ends up. I hope they will never look at a chip packet in the same way again."

The school plans to hold a clean-up every term.`,

At dawn, when mist lies thick and low
and water gleams like polished glass,
a grey ghost wades where reed beds grow
and waits, and waits, and lets time pass.

He does not hurry, does not fret;
he does not chatter like the weaver.
The minnows have not seen him yet:
a statue, still, a patient deceiver.

The sun climbs up. The breezes stir.
A silver flicker. Now! He strikes!
The water bursts in one swift blur,
then smooths itself, the way it likes.

He swallows, stretches, shakes his head,
then lifts on wings as wide as sails,
his long legs trailing out like thread,
and rows away above the vales.

O heron, teach me how to stay
as calm as you, as still, as wise;
to wait for what will come my way
and catch it when the moment flies.`,

Monday 3 March
Dear Diary,
Mr Petersen announced the athletics heats today, and I have been put in the 800 metres. The 800 metres! That is two whole laps of the field. I asked if I could swap to the long jump, but he said every learner has to try at least one event that scares them. Easy for him to say. He does not have legs like cooked spaghetti.

Wednesday 5 March
Dear Diary,
Disaster. I practised after school with my cousin Andile, who is in high school and runs cross-country. I sprinted the first lap like a cheetah and then spent the second lap walking and wheezing like an old bicycle pump. Andile laughed so much that he had to sit down. Then he gave me some advice: "The 800 isn't a sprint, Jabu. It's a conversation with yourself. Start slowly. Save something for the end." I have no idea what that means, but I wrote it down anyway.

Thursday 6 March
Dear Diary,
We practised again. This time I ran the first lap at what felt like a ridiculously slow pace. Andile kept shouting, "Slower! Slower!" which seemed completely backwards. But on the second lap, I still had energy left, and I overtook him on the final bend (he says he let me, but I am not so sure). Maybe I understand the conversation thing a little bit now.

Friday 7 March: SPORTS DAY
Dear Diary,
I can hardly hold my pen. When the gun went off, everyone else shot ahead like they had been fired from a catapult, and I was dead last. My whole House was groaning in the stands. I could hear Liam shouting, "Run, Jabu, RUN!" Every part of me wanted to sprint, but I kept hearing Andile's voice: Save something for the end.

By the start of the second lap, the boys in front were slowing down, their faces bright red. I passed one, then two, then four. On the final straight I had only one runner ahead of me, and I could hear the crowd going wild. I did not catch him. I came second, by about the length of a ruler.

Second! In the race I did not even want to run!

The best part was not the ribbon. It was Mr Petersen patting me on the back and saying, "Told you." I hate it when teachers are right.

Jabu`,

PSG('penguins','The Penguins of Boulders Beach','information',1,`
Just outside Simon's Town, on the edge of False Bay, lies one of the strangest sights in South Africa: a sandy beach where, instead of sunbathers, hundreds of penguins waddle between the granite boulders. This is Boulders Beach, home to a colony of African penguins.

African penguins are found only along the coasts of South Africa and Namibia. Scientists call this kind of species endemic, which means it lives naturally in one region and nowhere else on Earth. They stand about 60 centimetres tall and weigh around three kilograms. Each penguin has a unique pattern of black spots on its white chest, as individual as a human fingerprint, and a patch of pink skin above each eye. These patches are not decoration: on hot days, extra blood flows to them, helping the bird to release heat.

They were once nicknamed "jackass penguins" because of their loud braying call, which sounds remarkably like a donkey. Today, the name African penguin is preferred.

On land, penguins look clumsy, but in the water they are superb swimmers. Using their flipper-like wings to "fly" underwater, they can reach speeds of up to 20 kilometres an hour and dive to catch sardines and anchovies. Their black backs and white fronts provide excellent camouflage: from above, they blend into the dark water, and from below, they blend into the bright surface.

The Boulders colony began in 1982, when just two breeding pairs settled on the beach. Protected from many predators and disturbance, it grew to several thousand birds. However, the overall picture for the species is alarming. A century ago there were well over a million African penguins. Today there are only a tiny fraction of that number, and in 2024 the species was listed as critically endangered, the highest category before extinction in the wild.

The main threats are a shortage of food, caused partly by overfishing and changes in ocean temperature, as well as oil spills and the loss of nesting sites. Conservation groups now build artificial nest boxes, rescue and clean oiled birds, and campaign for fishing to be limited near breeding colonies.

Visitors can watch the penguins from wooden walkways. Seeing them up close is unforgettable, but it is also a reminder that, without urgent action, this remarkable bird could vanish from our coast within our lifetime.`,

Look up on a clear night far from city lights, and the sky seems to be crowded with stars. Yet almost every point of light you see is unimaginably far away. Our own neighbourhood in space, the solar system, is tiny by comparison, though it is still enormous by human standards.

At the centre of the solar system is the Sun, an ordinary star made of extremely hot gas. It contains more than 99 percent of all the mass in the solar system, and its gravity holds everything else in orbit around it. Sunlight travels at about 300 000 kilometres per second, yet it still takes roughly eight minutes to reach Earth.

Eight planets orbit the Sun. The four closest, Mercury, Venus, Earth and Mars, are known as the inner or rocky planets because they have solid surfaces. The four outer planets, Jupiter, Saturn, Uranus and Neptune, are much larger and are made mostly of gas and ice. Between Mars and Jupiter lies the asteroid belt, a ring of millions of rocky fragments left over from when the solar system formed.

Each planet has its own surprises. Mercury is closest to the Sun, but Venus is the hottest planet, because its thick atmosphere traps heat like a blanket, making it hot enough to melt lead. Mars looks red because its soil contains iron oxide, which is the same substance as rust. Jupiter is so large that more than a thousand Earths could fit inside it, and it has a storm called the Great Red Spot that is wider than our entire planet. Saturn's famous rings are made of countless pieces of ice and rock, some as small as grains of sand and others as large as houses.

For many years, Pluto was counted as the ninth planet. In 2006, however, astronomers agreed on a new definition of a planet and reclassified Pluto as a dwarf planet, because it has not cleared its orbit of other objects.

South Africa plays an important role in exploring space. Near the small Karoo town of Sutherland stands SALT, the Southern African Large Telescope, the largest single optical telescope in the southern hemisphere. The Karoo was chosen because its skies are dry, clear and very dark. On a good night there, astronomers can study galaxies so distant that their light began its journey before the Earth itself existed.`,

The new girl arrived in the middle of the second term, which, as everyone in 5B knew, was the worst possible time to arrive anywhere. Friendships had already been settled. Seats had been claimed. Even the spaces at the lunch tables had become invisible territories.

Her name was Inês, and she had moved from Maputo. Mrs Pillay explained that Inês spoke Portuguese at home and was still learning English, so everyone should be patient and kind. Several learners nodded seriously. Then, at break, almost all of them forgot.

Themba did not forget, exactly. He just did not know what to do. He watched Inês sitting alone on the steps of the library, drawing in a small black sketchbook, and he felt something uncomfortable twist in his chest. He knew that feeling. Two years earlier, he had been the new boy, and he still remembered every lonely break of those first weeks.

On Wednesday, he finally made himself walk over. "Hi," he said. Inês looked up warily. Themba realised, too late, that he had not planned anything else to say.

There was a long, awkward pause. Then Themba noticed the sketchbook. It was full of extraordinary drawings: a fishing boat with patched sails, a street market crowded with people, a grandmother with a face full of laughter lines. Everything looked so real that he almost expected the people to move.

"You drew these?" he asked. She nodded. He pointed at the boat and raised his eyebrows. "Meu avô," she said, then searched for the English. "My… grandfather. His boat."

Themba did not speak Portuguese, and Inês knew only a little English, but over the next few weeks they discovered that drawing was a language of its own. Themba drew his dog, Biscuit, sitting on a rugby ball. Inês laughed and drew Biscuit wearing a Springbok jersey. She taught him "obrigado", which means thank you. He taught her "sharp", which, he explained with a great deal of pointing, could mean "cool" as well as "pointy".

By the end of the term, Inês's English had improved remarkably. The art teacher had chosen three of her drawings for the school exhibition, and a small crowd of learners now gathered on the library steps at break, asking her to draw them.

On the last day of term, Inês tore a page from her sketchbook and handed it to Themba. It was a drawing of two figures on the library steps, one bending over to say hello. Underneath, in careful English, she had written: "The first one who saw me."`,

Last Saturday, the Kingfisher Primary marimba band performed at the regional eisteddfod in the Johannesburg City Hall. It was the first time in the school's history that the band had been invited to play there, and it was a day none of us will forget.

We arrived at the hall at seven o'clock in the morning, half an hour before our call time, because Mr Khumalo, our music teacher, believes that being early is the same as being on time and being on time is the same as being late. The first problem appeared almost immediately. While unloading the bus, Sipho tripped on the step and dropped one of the bass marimba's wooden keys, which cracked down the middle.

For a few terrible minutes, nobody spoke. A bass marimba with a missing note is like a sentence with a missing word: everything still makes sense, but it sounds wrong. Then Mr Khumalo calmly produced a roll of duct tape from his bag. Nobody knows why he carries duct tape everywhere, but that morning nobody was complaining. The repair was not beautiful, but the key still played, if slightly flat.

Next, we had to wait. There were fourteen schools ahead of us, and we spent nearly four hours in a stuffy dressing room listening to the muffled sound of other bands through the wall. Some of them were very good. By eleven o'clock, Lindiwe was convinced we had no chance, and Thabo had eaten his lunch, his snack and half of mine.

At last, at twenty past eleven, our name was called. We carried the marimbas onto the enormous stage, and the lights were so bright that we could hardly see the audience. Mr Khumalo raised his hands, counted us in, and we began "Shosholoza", the piece we had practised every Tuesday and Thursday since February.

Something happened during that performance that is hard to describe. The hall seemed to fill up with sound until the rhythm was not coming from our sticks any more, but from somewhere in the floor. When we finished, there was a second of silence, and then the audience began clapping in time and would not stop.

We did not win first place. That went to a school from Soweto whose band was, honestly, brilliant. We were awarded a gold diploma and a special mention for "outstanding rhythm and ensemble playing". On the bus home, everyone sang the whole way.

Sipho has offered to buy Mr Khumalo a new roll of duct tape.`,

Seventeen learners started the Kingfisher Spelling Bee. By the time the clock above the stage said quarter past eleven, only two were left: Aditi Naidoo, who had won it the year before, and Sam Abrahams, who had never made it past the second round.

Sam could hardly believe he was still standing. For weeks he had practised with a strange method he had invented himself. Instead of chanting words, he turned each one into a picture. "Necessary" became a shirt with one collar and two sleeves, because it has one c and two s's. "Rhythm" became a dancer with no vowels to slow her down. His older sister thought it was the silliest thing she had ever heard. It had got him to the final.

The judge, Mrs Botha, leaned towards the microphone. "Sam, your word is accommodate."

Sam closed his eyes. He pictured a house with two front doors and two garages: two c's, two m's. He opened his eyes and spelled it slowly. The bell rang. Correct.

"Aditi, your word is conscientious."

Aditi frowned and asked for the definition. "Taking great care to do things well and thoroughly," said Mrs Botha. Aditi spelled it perfectly, without a moment's hesitation.

The rounds went on and on. Sam spelled "mischievous" and "occasionally". Aditi spelled "bureaucracy" and "silhouette". The hall was so quiet that you could hear the hum of the projector.

Then Mrs Botha said, "Sam, your word is embarrass."

Sam knew this one. He pictured two red cheeks and two ruby lips, two r's and two s's. But the hall was hot, and his heart was racing, and somewhere between the picture and his mouth, something slipped. "E-M-B-A-R-A-S-S," he said, and the moment the last letter left his lips, he heard the mistake.

The buzzer sounded. A sympathetic groan rippled through the audience.

Aditi now had to spell one word correctly to win. "Your word," said Mrs Botha, "is perseverance."

Aditi spelled it perfectly.

Sam clapped as hard as anyone. When the trophy had been presented, Aditi walked across the stage and found him in the wings. "Two r's and two s's," she said. "Red cheeks and ruby lips?"

Sam stared. "How do you know my method?"

"I don't," said Aditi, grinning. "But I'm going to steal it. Same time next year?"

Sam found, to his surprise, that he was already looking forward to it.`,

On 18 July 1918, in the small village of Mvezo in the Eastern Cape, a baby boy was born and given the name Rolihlahla. In isiXhosa, the name is often translated as "pulling the branch of a tree", or, more playfully, "troublemaker". On his first day at school, a teacher gave him the English name by which the world would come to know him: Nelson.

Mandela's father died when he was about nine, and the boy was raised by a regent, a powerful chief, at the Great Place in Mqhekezweni. There he listened to the elders settling disputes, and he noticed that a good leader listened to everyone before speaking. This lesson stayed with him all his life.

He went on to study at the University of Fort Hare, but he left after joining a student protest. In 1941 he moved to Johannesburg, where he studied law. In 1952, he and his friend Oliver Tambo opened Mandela and Tambo, the first black-owned law firm in South Africa. Many of their clients were people who had been treated unfairly under apartheid, the system of laws that kept South Africans apart and denied black South Africans basic rights.

Mandela joined the African National Congress (ANC) and became one of its leaders in the struggle against apartheid. In 1964, at the end of the Rivonia Trial, he was sentenced to life imprisonment. He spent eighteen of his prison years on Robben Island, breaking stones in a lime quarry and sleeping in a tiny cell. Even there, he studied, debated with other prisoners and refused to give up hope.

After 27 years in prison, Mandela was released on 11 February 1990. Instead of seeking revenge, he worked with President F.W. de Klerk to negotiate a peaceful end to apartheid. In 1993, the two men were jointly awarded the Nobel Peace Prize. On 27 April 1994, millions of South Africans of all races queued for hours to vote together for the first time, and on 10 May 1994 Mandela was inaugurated as the country's first democratically elected president.

PSG('adverts','The Tricks of Advertising','information',2,`
Every day, you see hundreds of advertisements: on billboards and buses, on cereal boxes, in the middle of your favourite videos and even on the backs of toilet doors. Each one has the same goal: to persuade you to want something. Advertisers spend enormous amounts of money working out exactly how to do that. Once you know their tricks, you can become a much smarter shopper.

The first trick is the slogan, a short, catchy phrase that sticks in your memory. A good slogan often uses rhyme, alliteration or rhythm, so that you find yourself repeating it without meaning to. "Crunchy, munchy, marvellous!" may mean very little, but you will remember it the next time you walk down the cereal aisle.

The second trick is emotive language: words chosen to make you feel something. Advertisers love words like amazing, irresistible, ultimate and incredible. They rarely tell you that a product is "fairly good" or "about the same as the cheaper one".

Thirdly, many adverts use famous people or experts. When a popular sports star smiles while holding a fizzy drink, the advert hopes that you will connect the drink with success and fitness, even though the athlete probably trains on water. Some adverts show actors in white coats to suggest that "scientists" or "doctors" approve.

Another common trick is the bandwagon effect: the idea that everyone else already has the product and you are missing out. Phrases such as "South Africa's favourite" or "Join millions of happy customers" make you feel left out if you do not buy it.

Advertisers also create a sense of urgency. "Limited stock!", "Today only!" and "Offer ends Friday!" are designed to make you buy quickly, before you have time to think carefully or compare prices.

Finally, look out for the small print: the tiny writing at the bottom of an advert. "Free gift" might only apply if you spend R500. "Up to 70% off" might mean that only one item is reduced by that much.

Advertising is not all bad. It tells us about new products, special prices and events. But a smart consumer asks questions. What is this advert really telling me? What is it leaving out? And do I actually need this, or does the advert simply want me to believe that I do?`,

PSG('bean','How to Grow a Bean in a Jar','instructions',2,`
Have you ever wondered what happens underground when a seed starts to grow? Usually it is hidden in the soil, but with this simple experiment you can watch every stage through the side of a glass jar. It takes about two weeks, so you will need a little patience.

You will need:
• a clean glass jar (a large jam jar works well)
• two or three sheets of paper towel
• a handful of cotton wool
• three dried bean seeds (sugar beans or butter beans are ideal)
• water
• a notebook and pencil for your observations

Method
1. Soak the beans in a cup of water overnight. This softens the hard outer coat and helps the seed to wake up.
2. Fold the paper towel and line the inside of the jar with it, so that it presses against the glass.
3. Fill the middle of the jar with cotton wool. This holds the paper towel firmly in place.
4. Carefully slide the beans between the paper towel and the glass, about a third of the way down. Space them out so that you can see each one clearly.
5. Pour in enough water to soak the cotton wool and paper towel, but not so much that the beans are sitting in a pool of water.
6. Place the jar in a warm, bright spot, but out of direct sunlight, which could dry it out too quickly.
7. Check your jar every day. Add a little water whenever the paper towel starts to feel dry.
8. Record what you see in your notebook. Draw a labelled diagram every second day.

What will happen?
After two or three days, the bean coat will split and a small white root will push downwards. Soon afterwards, a shoot will appear and begin to grow upwards, towards the light. Even if you turn the jar upside down, the root will still bend down and the shoot will still turn up. Plants can sense gravity and light, and they respond to both.

After about a week, the first leaves will unfold. Once your seedling has two or three leaves, it is ready to be planted in soil, where it can find the nutrients it needs to keep growing.

Tip: Try a fair test. Set up two jars exactly the same way, but put one in a dark cupboard. Which bean grows faster, and what do the leaves look like?`,

PSG('lights','The Night the Lights Went Out','narrative',2,`
It was the coldest night of the winter, and the load-shedding schedule said the power would go off at six o'clock. At exactly 5:59, my little brother Lwazi was still arguing that it was not fair, because his game was "just about to get to the best part".

At six, the house went dark. The fridge stopped humming. The television went silent. Somewhere down the road, a dog barked as if it had been personally insulted.

"Right," said Mom, in the voice she uses when she has decided to make the best of something. "Candles, blankets and everyone in the lounge."

Five minutes later, we were huddled together under Gran's enormous crocheted blanket, which is heavier than a sleeping bag and smells faintly of lavender. The candle on the coffee table made our shadows stretch across the ceiling like giants. Dad tried to make shadow animals with his hands, but his rabbit looked more like a confused crocodile, and even Lwazi laughed.

Then Grandpa cleared his throat. "When I was your age," he began, "we didn't have electricity at all."

Lwazi groaned. We had heard this story before, or at least we thought we had.

But this time Grandpa told it differently. He described the farm near Komga where he grew up, and the paraffin lamp that his mother lit every evening. He told us about the night a storm blew the door open and the lamp went out, and how he and his sisters sat in total darkness, listening to the thunder. "My grandmother told us stories until the storm passed," he said. "I remember every single one. I couldn't tell you what I had for supper last Tuesday, but I remember those stories."

He told us one of them: a tale about a clever hare who tricked a lion into guarding his vegetables. It was funnier than any programme on television, and much stranger.

By the time the lights flickered back on at half past eight, Lwazi was asleep with his head on Grandpa's knee. The television came back to life, loud and bright and suddenly very ordinary.

Mom reached for the remote. Then she stopped, looked at us all, and switched the television off again.

"Grandpa," she said, "do you know any more?"

He did. He knew dozens.`,

PSG('watercycle','The Never-Ending Journey of Water','information',2,`
The water in your glass today may once have fallen as rain on a dinosaur, frozen into an Antarctic glacier or flowed down the Nile. That is because the Earth does not make new water. The same water has been moving around our planet for billions of years in a continuous loop called the water cycle.

The water cycle has no real beginning or end, but it is easiest to start with the sun. When the sun heats the oceans, lakes and rivers, some of the water turns into an invisible gas called water vapour. This process is called evaporation. Plants add to it too. They draw water up from the soil through their roots and release it through tiny holes in their leaves, a process known as transpiration.

Warm, moist air rises. As it climbs higher into the sky, it cools down. Cooler air cannot hold as much water vapour, so the vapour turns back into tiny droplets of liquid water. This is condensation, and you can see it happen on the outside of a cold glass on a hot day. In the sky, billions of these droplets gather together to form clouds.

Inside a cloud, the droplets bump into each other and join together, growing bigger and heavier. When they become too heavy to float, they fall to the ground as precipitation, which may be rain, hail, sleet or snow, depending on the temperature.

Some of the water soaks into the ground and becomes groundwater, which may be stored underground for thousands of years. Some runs off the land into streams and rivers, which carry it back to the sea. This stage is called collection. Then the sun heats the water again, and the cycle continues.

Although about 71% of the Earth's surface is covered in water, around 97% of that water is salty sea water. Most of the fresh water is frozen in ice caps and glaciers, so less than one percent of all the water on Earth is fresh water that people can easily use.

South Africa is a water-scarce country. In 2018, after years of drought, Cape Town came close to "Day Zero", the day when the city's taps would have been turned off. Residents cut their water use dramatically, and the disaster was avoided. It was a powerful reminder that, although the water cycle never ends, the water we can use is precious and limited.`,

CHARACTERS: SAM (a learner), MRS DLAMINI (the teacher), ZODWA (Sam's friend), PRINCIPAL NAIDOO

SCENE 1: A Grade 5 classroom. Morning. Learners are taking out their books.

MRS DLAMINI: Good morning, everyone. Please hand in your projects on the solar system.
(Everyone except SAM walks to the front. SAM searches desperately through his bag.)
ZODWA: (whispering) Sam! Where's yours?
SAM: (whispering back) I had it this morning. I know I did!
MRS DLAMINI: Sam? Is there a problem?
SAM: (standing up slowly) Mrs Dlamini, you won't believe this, but my project was… eaten.
MRS DLAMINI: (folding her arms) By the dog, I suppose?
SAM: No, Ma'am. By a goat.
(The class bursts out laughing.)
MRS DLAMINI: A goat. In Johannesburg.
SAM: It belongs to Mr Botha next door. It escaped this morning and ate my model of Saturn. The rings were made of paper plates. I think it liked them.
MRS DLAMINI: (sighing) Sam, that is the most creative excuse I have heard in twenty years of teaching. Unfortunately, creativity does not earn marks for science.

SCENE 2: The same classroom, ten minutes later. There is a loud knock at the door.

PRINCIPAL NAIDOO: (entering, looking flustered) Sorry to interrupt, Mrs Dlamini. There is a goat in the car park.
(Everyone turns to stare at SAM.)
PRINCIPAL NAIDOO: It appears to be chewing on something. (She holds up a soggy, half-eaten paper plate covered in yellow paint.) Does this belong to anyone?
SAM: (jumping up) That's Saturn! Well, half of Saturn.
ZODWA: (grinning) You see, Ma'am? He was telling the truth!
MRS DLAMINI: (examining the plate, trying not to smile) I can see that you painted the rings very neatly.
SAM: It took me three hours.
MRS DLAMINI: Very well. You may have until Friday to rebuild your project. And Sam?
SAM: Yes, Ma'am?
MRS DLAMINI: This time, perhaps make the rings out of something less delicious.

(The class laughs. Outside, the goat bleats loudly. Lights fade.)

THE END`,

Dear Mayor

REQUEST FOR A PEDESTRIAN CROSSING OUTSIDE KINGFISHER PRIMARY SCHOOL

I am writing on behalf of the Grade 5 learners of Kingfisher Primary School to request that a pedestrian crossing and a speed hump be installed on Heron Road, directly outside our school gate.

Every morning, more than 300 learners walk to school along Heron Road. To reach the gate, many of us have to cross the road, which is wide and busy. Cars often travel far faster than the speed limit of 40 km/h, especially when drivers are rushing to work. There are no road markings, no traffic lights and no scholar patrol.

As part of a class project, we carried out a traffic survey. Over five mornings, between 07:00 and 07:45, we counted the cars that passed the school and estimated their speed with the help of our teacher and a parent who is a traffic engineer. We found that, on average, 410 cars passed the school each morning, and that roughly one in four was travelling faster than the speed limit.

Last month, a Grade 2 learner was almost knocked down while crossing the road with her older brother. Fortunately, she was not injured, but the incident frightened many families. Some parents now drive their children the short distance to school instead of letting them walk, which adds even more traffic to the road.

We have attached a copy of our survey results and a petition signed by 286 learners, parents and teachers.

Thank you for taking the time to read our letter. We would be very grateful if you, or a member of your team, could visit our school to see the problem for yourself. We look forward to hearing from you.

Yours faithfully

Lerato Mokoena

All afternoon the heat lay still,
a heavy blanket on the hill.
The grass hung limp, the birds had fled,
the air was thick as honey spread.

Then from the west, a bruise of grey
came marching in to end the day.
The clouds piled up like castle towers,
and swallowed up the sun in hours.

A hush. A breath. The world held tight.
The jacaranda bowed in fright.
Then, crack! The sky split clean in two:
a jagged knife of white and blue.

The thunder grumbled, rolled and roared
like furniture across a floor,
and down the rain came, fat and fast,
a drumming army thundering past.

It hammered roofs and lashed the trees,
and brought the tall grass to its knees.
The gutters gurgled, gulped and spilled;
the dry brown veld was drenched and filled.

And then, as quickly as it came,
it softened to a gentle rain.
The clouds moved on, the sun crept through,
and washed the evening clean and new.

The air smelt sweet of earth and stone;
the frogs began their evening drone.
And on the hill, the grass stood tall:
the storm had come to water all.`,

PSG('jackal','Jackal and the Lion\'s Dinner','folktale',2,`
In the days when animals still spoke the same language as people, Lion ruled the bushveld, and nobody dared to argue with him. He was strong, he was proud and, above all, he was greedy.

One dry season, Lion and Jackal went hunting together. Jackal was small, but he had sharp eyes and an even sharper mind. It was Jackal who spotted the herd of eland, Jackal who chased them towards the riverbed, and Jackal who barked until the largest eland stumbled. Lion simply strolled out from behind a bush and pounced.

"An excellent hunt," purred Lion, settling down beside the eland. "Now, let us divide the meat fairly."

Jackal's mouth watered. He had not eaten in three days.

"This leg is mine," said Lion, "because I am the king. This leg is mine because I am the strongest. This leg is mine because I made the final pounce. And this leg," he said, licking his whiskers, "is mine, because I would like to see you try to take it from me."

Jackal bowed politely. "Of course, Your Majesty. A king deserves the best." But inside, his stomach growled with anger, and his clever brain began to work.

The next morning, Jackal came running to Lion's den, panting and wide-eyed. "Your Majesty! Terrible news! There is another lion living at the waterhole. He says that he is the true king of the bushveld, and that you are nothing but an overgrown house cat."

Lion leapt to his feet, his mane bristling. "Show me this impostor!"

Jackal led him to the old well at the edge of the village, where the water lay deep and dark. "He lives down there, Your Majesty. Look for yourself."

Lion leaned over the edge and saw a furious lion glaring back up at him. He roared. The lion in the well roared back. He bared his teeth. The other lion bared its teeth too.

"How dare you!" thundered Lion, and he leapt into the well to fight his rival.

The splash echoed for a long time. By the time Lion had dragged himself, dripping and humiliated, out of the cold water, Jackal and his family had enjoyed a magnificent feast on what remained of the eland.

PSG('bigfive','Meet the Big Five','information',2,`
The term "Big Five" was first used by big-game hunters to describe the five African animals they considered the most difficult and dangerous to hunt on foot: the lion, the leopard, the elephant, the rhinoceros and the buffalo. Today, thankfully, most people "shoot" them only with cameras, and spotting all five is the dream of almost every visitor to a game reserve. The Kruger National Park is one of the places where all five can be found.

THE LION
Lions are the only cats that live in large family groups, called prides. The females do most of the hunting, often working together to bring down large prey such as zebra and wildebeest. A male lion's roar can be heard up to eight kilometres away.

THE LEOPARD
The leopard is the most secretive of the Big Five and the hardest to spot. It usually hunts alone at night and is extraordinarily strong: it can drag a carcass heavier than itself high into a tree, where lions and hyenas cannot reach it. Its spots, called rosettes, help it to blend into the dappled shade.

THE ELEPHANT
The African elephant is the largest land animal on Earth. An adult can eat well over 100 kilograms of plants a day. Elephants live in herds led by the oldest female, called the matriarch, who remembers where to find water during droughts. They communicate with low rumbles, some of which are too deep for humans to hear.

THE RHINOCEROS
South Africa is home to most of the world's remaining rhinos. There are two species: the white rhino, which grazes on grass with its wide, square lip, and the smaller, more aggressive black rhino, which uses its pointed, hooked lip to browse on bushes. Rhino horn is made of keratin, the same material as your fingernails, yet poachers have killed thousands of rhinos for it. Rangers and sniffer dogs now work day and night to protect them.

THE BUFFALO
The Cape buffalo may look like a large cow, but it is considered one of the most dangerous animals in Africa. Buffalo live in herds that can number in the hundreds and will defend one another fiercely, even chasing lions away. A wounded buffalo is famous for circling back to ambush its hunter.

The Big Five are more than a tourist checklist. They are a symbol of Africa's wild heritage, and protecting them protects the whole ecosystem they share.`,
