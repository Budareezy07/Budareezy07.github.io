<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heron Word Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f2756;--sky:#2f80ed;--gold:#f5b700;--cream:#fff8ec;--ink:#1d2433;--muted:#5b6478;--good:#1fa65a;--bad:#e5484d;
  --head:'Baloo 2','Nunito',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#dff0ff 0%,#eef7ff 40%,var(--cream) 100%);min-height:100vh}
h1,h2,h3{font-family:var(--head);margin:0}
button,select,input{font-family:inherit}
button{cursor:pointer;border:none}
#app{max-width:760px;margin:0 auto;padding:14px 14px 48px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(20,40,75,.08),0 10px 30px rgba(20,40,75,.08)}
.mt{margin-top:14px}.mt8{margin-top:8px}.mb8{margin-bottom:8px}.w100{width:100%}.b{font-weight:800}.i{font-style:italic}.up{text-transform:uppercase;letter-spacing:.06em}
.f17{font-size:17px}.f18{font-size:18px}.f19{font-size:19px}.f20{font-size:20px}.f60{font-size:60px}.f70{font-size:70px}.small{font-size:13px}.w22{width:22px}
.muted{color:var(--muted)}.center{text-align:center}.left{text-align:left}.dim{color:#d5dde9}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.hero{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:24px;padding:14px 16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero svg{width:64px;height:76px;flex:none}
.hero h1{font-size:26px;line-height:1}
.hero .sub{opacity:.8;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero .sub2{color:var(--gold);font-weight:800;font-size:14px;margin-top:2px}
.btn{background:var(--sky);color:#fff;font-weight:800;font-size:17px;padding:13px 18px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.navy{background:var(--navy)}
.btn.ghost{background:#eef2f8;color:var(--navy);box-shadow:0 3px 0 #d3dbe8}
.btn.small{font-size:15px;padding:9px 13px;border-radius:12px}
.btn.danger{background:#fdecec;color:var(--bad)}
.btn:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 3px 0 rgba(20,40,75,.07)}
.stat b{display:block;font-family:var(--head);font-size:21px;line-height:1.1}.stat span{font-size:12px;color:var(--muted);font-weight:700}
.player{display:flex;align-items:center;gap:12px;margin-top:12px}
.ava{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:32px;box-shadow:0 3px 0 rgba(20,40,75,.1);flex:none}
.xpbar{height:12px;background:#dfe6f1;border-radius:99px;overflow:hidden;margin-top:5px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd65a);border-radius:99px}
.focus{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border-left:8px solid var(--c);border-radius:16px;padding:12px 14px;font-size:15px;box-shadow:0 3px 0 rgba(20,40,75,.08)}
.wotd{background:#fffdf3;border:2px dashed #f1d77a;border-radius:18px;padding:12px 14px}
.wotd .wword{font-family:var(--head);font-size:28px;color:var(--navy);line-height:1}
.wotd small{color:#b98900}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta{display:flex;align-items:center;gap:10px;text-align:left;color:#fff;border-radius:20px;padding:14px 12px;font-size:13px;font-weight:700}
.cta .ic{font-size:32px}.cta b{font-family:var(--head);font-size:18px;display:block;line-height:1.05}
.cta.race{background:linear-gradient(135deg,#ff7a3d,#f5b700);box-shadow:0 5px 0 #c96a16}
.cta.daily{background:linear-gradient(135deg,#2f80ed,#1f2756);box-shadow:0 5px 0 #0c1a33}
.cta.done{opacity:.6}
.goal{font-weight:800;font-size:14px;color:var(--navy);display:flex;gap:8px;align-items:center}
.dots{display:flex;gap:4px}.dots i{width:16px;height:16px;border-radius:50%;background:#dfe6f1;display:block}.dots i.on{background:var(--good)}
.maph{margin:20px 0 6px;color:var(--navy);font-size:22px}
.map{position:relative;padding:6px 0}
.map:before{content:"";position:absolute;left:50%;top:30px;bottom:30px;border-left:5px dashed #b9cbe4;transform:translateX(-50%)}
.node{position:relative;display:flex;align-items:center;gap:10px;background:none;width:62%;padding:6px 0;text-align:left}
.node.l{margin-right:auto}.node.r{margin-left:auto;flex-direction:row-reverse;text-align:right}
.disc{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:36px;border:5px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.15);position:relative}
.crown{position:absolute;top:-14px;right:-6px;font-size:24px}
.nlabel{background:#fff;border-radius:14px;padding:7px 10px;box-shadow:0 3px 0 rgba(20,40,75,.08);flex:1;min-width:0}
.nlabel b{font-family:var(--head);font-size:16px;line-height:1.05;display:block;color:var(--navy)}
.nlabel small{font-weight:700;color:var(--muted);font-size:12px}
.mini{display:block;height:7px;background:#e6ebf3;border-radius:9px;overflow:hidden;margin-top:4px}.mini i{display:block;height:100%;border-radius:9px}
.mini.white{background:rgba(255,255,255,.35)}.mini.white i{background:#fff}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.nav button{background:#fff;border-radius:16px;padding:10px 4px;font-weight:800;color:var(--navy);font-size:13px;box-shadow:0 3px 0 rgba(20,40,75,.08)}
.nav button span{display:block;font-size:24px}
.title{display:flex;align-items:center;gap:10px;margin-bottom:12px}.title h2{font-size:24px;color:var(--navy);line-height:1.1}
.x{width:42px;height:42px;flex:none;border-radius:14px;background:#fff;font-size:20px;color:var(--navy);box-shadow:0 3px 0 rgba(20,40,75,.1)}
.whead{display:flex;align-items:center;gap:12px;color:#fff;border-radius:20px;padding:14px 16px}
.whead small{display:block;margin-top:6px;opacity:.95;font-weight:700}.wbig{font-size:48px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 3px 0 rgba(20,40,75,.07);width:100%;text-align:left;color:var(--ink);font-size:15px}
.item .em{font-size:30px;width:42px;text-align:center}
.item.locked{opacity:.45;filter:grayscale(1)}.item.meitem{outline:3px solid var(--gold)}
.num{width:32px;height:32px;flex:none;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800}
.stars{color:var(--gold);letter-spacing:1px}
.bosscard{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2a1840,#1f2756);color:#fff;border-radius:20px;padding:14px 16px}
.bossemo{font-size:48px;display:inline-block;animation:bob 2s ease-in-out infinite}
.bossemo.xl{font-size:90px}
.bossemo.hit{animation:shake .45s}.bossemo.ko{transform:rotate(90deg);filter:grayscale(1);animation:none}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-8deg)}40%{transform:translateX(10px) rotate(8deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.bossintro{border-top:8px solid var(--c)}
.bosspanel{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2a1840,var(--c));color:#fff;border-radius:18px;padding:10px 14px;margin-bottom:12px}
.bosspanel .bossemo{font-size:52px}
.hp{height:14px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin:4px 0 2px}.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5f5f,#ffb347);transition:width .5s}
.hearts{font-size:20px;white-space:nowrap}
/* Learn */
.learn{display:flex;gap:10px;align-items:flex-start}
.plume{width:70px;flex:none}.plume svg{width:70px;height:84px}
.plume-sm{width:80px;margin:0 auto}.plume-sm svg{width:80px;height:96px}
.bubble{background:#fff;border-radius:20px;padding:12px 16px;position:relative;box-shadow:0 4px 0 rgba(20,40,75,.08);flex:1}
.bubble:before{content:"";position:absolute;left:-10px;top:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble p{font-size:17px;line-height:1.5;margin:6px 0 0}
.tipbox{background:#fff4c7;border:3px solid var(--gold);border-radius:18px;padding:12px 16px}
.tipbox p{font-size:18px;margin:6px 0 0;line-height:1.45}
.ex{margin:8px 0 0;padding-left:20px;font-size:17px;line-height:1.7}
/* Questions */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:14px;background:#dfe6f1;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--good);transition:width .3s}
.pts{font-family:var(--head);font-weight:800;font-size:20px;color:var(--navy);min-width:60px;text-align:right}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;color:#fff;margin-bottom:8px}
.prompt{font-family:var(--head);font-size:23px;line-height:1.2;margin:4px 0 12px}
.clue{background:#f3f6fb;border-radius:14px;padding:12px 14px;font-size:19px;margin-bottom:12px;font-weight:700}
.opts{display:grid;gap:10px}.opts.grid2{grid-template-columns:1fr 1fr}
.opt{background:#fff;border:3px solid #dbe3ef;border-radius:16px;padding:14px;font-size:18px;font-weight:700;text-align:left;color:var(--ink)}
.opt.right,.chip.right,.mchip.right,.tok.right,.typein.right{border-color:var(--good)!important;background:#e6f7ed!important}
.opt.wrong,.chip.wrong,.mchip.wrong,.tok.wrong,.typein.wrong{border-color:var(--bad)!important;background:#fdecec!important}
.opt:disabled{color:var(--ink);opacity:1}
.sentence{font-size:21px;line-height:2.2;margin-bottom:6px}
.tok{background:#f3f6fb;border:2px solid #dbe3ef;border-radius:10px;padding:2px 8px;margin:2px 1px;font-size:20px;font-weight:700;color:var(--ink)}
.tok.show{background:#e6f7ed;border-color:var(--good);border-style:dashed}
.typein{width:100%;font-size:24px;font-weight:800;padding:14px;border-radius:16px;border:3px solid #dbe3ef;text-align:center;letter-spacing:.04em}
.typein:focus{outline:none;border-color:var(--sky)}
.speak{background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px;font-size:18px;font-weight:800;margin-bottom:12px}
.buckets{display:grid;gap:8px;margin-bottom:10px}.buckets.b2{grid-template-columns:1fr 1fr}.buckets.b3{grid-template-columns:1fr 1fr 1fr}
.bucket{background:#f3f6fb;border:3px dashed #c5d2e6;border-radius:16px;min-height:120px;padding:8px;cursor:pointer}
.bh{font-weight:800;color:var(--navy);text-align:center;font-size:14px;margin-bottom:6px}
.bin{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:20px;padding:6px 0}
.pool.long,.line.long{flex-direction:column;align-items:stretch}
.chip{background:#fff;border:3px solid #dbe3ef;border-radius:12px;padding:8px 12px;font-size:17px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 #dbe3ef}
.chip.sel{border-color:var(--sky);background:#e8f1ff;transform:translateY(-2px)}
.line{min-height:58px;background:#fffdf3;border:3px dashed #f1d77a;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.line .ph{color:#b9a35a;font-weight:700;padding:0 6px}
.long .chip{text-align:left}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match>div{display:grid;gap:8px;align-content:start}
.mchip{background:#fff;border:3px solid #dbe3ef;border-radius:14px;padding:12px 8px;font-size:16px;font-weight:700;color:var(--ink);min-height:52px}
.mchip.sel{border-color:var(--sky);background:#e8f1ff}.mchip:disabled{opacity:1}
.fb{margin-top:14px;border-radius:16px;padding:14px;animation:pop .25s ease}
.fb.good{background:#e6f7ed;border:2px solid #a9e2bf}.fb.bad{background:#fff3e6;border:2px solid #f6cf9f}.fb.slim{padding:8px 12px}
.fb h3{font-size:21px}.fb p{margin:6px 0 12px;font-size:16px;line-height:1.5}
.plus{color:var(--good)}.minus{color:var(--bad)}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.passage{background:#fffdf5;border:2px solid #f1e3b8;border-radius:16px;padding:10px 14px;margin-bottom:14px}
.passage summary{font-family:var(--head);font-weight:800;font-size:18px;cursor:pointer;color:var(--navy)}
.passage p{font-size:17px;line-height:1.55;margin:8px 0}
.bigstars{font-size:54px;letter-spacing:6px;margin:6px 0;color:var(--gold)}
.reward{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap}.reward div{background:#f3f6fb;border-radius:14px;padding:10px 14px;font-weight:800}
.lanes{display:grid;gap:6px;margin-bottom:12px}
.lane{background:#fff;border-radius:14px;padding:5px 10px;box-shadow:0 2px 0 rgba(20,40,75,.08)}.lane.me{outline:3px solid var(--gold)}
.lane .nm{font-size:12px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between}
.track{position:relative;height:28px;background:repeating-linear-gradient(90deg,#eef2f8 0 18px,#e3e9f3 18px 36px);border-radius:10px;margin-top:2px}
.track .runner{position:absolute;top:0;font-size:22px;transition:left .4s;transform:translateX(-50%)}.track .flag{position:absolute;right:4px;top:3px;font-size:17px}
.timer{font-family:var(--head);font-size:28px;font-weight:800;color:var(--navy)}.timer.urgent{color:var(--bad);animation:bob .5s infinite}
.flash{position:fixed;inset:0;pointer-events:none;animation:fl .4s ease forwards}@keyframes fl{from{opacity:.3}to{opacity:0}}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shopitem{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 3px 0 rgba(20,40,75,.07);border:3px solid transparent}
.shopitem.sel{border-color:var(--gold)}.shopitem .em{font-size:40px}.shopitem small{display:block;font-weight:800;color:var(--muted);margin:4px 0}
.avapick{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.avapick button{font-size:34px;width:62px;height:62px;border-radius:18px;background:#f3f6fb;border:3px solid transparent}.avapick button.sel{border-color:var(--gold);background:#fff7d6}
.name{width:100%;font-size:18px;padding:12px 14px;border-radius:14px;border:3px solid #dbe3ef;font-weight:700;background:#fff}
.lbl{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 4px}
.scrollx{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 5px;border-bottom:1px solid #e6ebf3;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-weight:800;font-size:12px}
.link{background:none;color:var(--sky);font-weight:800;font-size:14px;padding:0;text-align:left}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:50;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:60;animation:pop .25s;max-width:90vw;text-align:center}
@media(max-width:380px){.opts.grid2{grid-template-columns:1fr}.node{width:72%}.duo{grid-template-columns:1fr}}
/* ===== v3 additions ===== */
.heron{display:block;width:auto;flex:none}
.h30{height:30px}.h40{height:40px}.h48{height:48px}.h56{height:56px}.h64{height:64px}.h70{height:70px}.h84{height:84px}.h90{height:90px}.h110{height:110px}.h120{height:120px}.h170{height:170px}
.hero .heron{height:78px;width:auto}
.bounce{animation:hop 1.2s ease-in-out infinite}.card.center>.heron,.proj.center>.heron{margin:0 auto}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hbtns{display:flex;flex-direction:column;gap:6px;z-index:1}
.ava{position:relative;width:70px;height:70px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(20,40,75,.1);flex:none;padding:0;overflow:visible}
.ava .heron{height:66px}.pen{position:absolute;right:-6px;bottom:-6px;background:var(--gold);border-radius:50%;width:24px;height:24px;font-size:12px;display:grid;place-items:center}
.link.small{font-size:12px}
.featherbar{width:100%;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 rgba(20,40,75,.08);text-align:center;color:var(--navy)}
.frow{display:flex;justify-content:center;gap:4px;margin-bottom:4px}.feather{width:30px;height:30px}.feather.on{filter:drop-shadow(0 0 4px rgba(245,183,0,.7));animation:shine 2.5s ease-in-out infinite}
@keyframes shine{50%{transform:rotate(-8deg) scale(1.08)}}
.suggest,.mender{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border-radius:18px;padding:10px 14px;box-shadow:0 3px 0 rgba(20,40,75,.08);color:var(--ink);font-size:14px}
.suggest{background:linear-gradient(135deg,#eaf4ff,#fff);border:2px solid #cfe2fb}.suggest b,.mender b{display:block;font-family:var(--head);font-size:19px;color:var(--navy);line-height:1.1}
.suggest small,.mender small{display:block;color:var(--muted);font-weight:700}
.mender{background:#fff4e8;border:2px solid #ffd2a6}.mender .mic{font-size:28px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta.rain{background:linear-gradient(135deg,#00a3a3,#2f80ed);box-shadow:0 5px 0 #1b5fa8}
.cta.write{background:linear-gradient(135deg,#d6336c,#8e44ad);box-shadow:0 5px 0 #5e2a75}
.dots.c{justify-content:center;margin:10px 0}
.node.finale{margin:6px auto 0;width:70%;justify-content:center}.node.finale .nlabel{background:#2a1840;color:#fff}.node.finale .nlabel b,.node.finale .nlabel small{color:#fff}
.node.locked .disc{filter:grayscale(.6)}.crown .feather{width:26px;height:26px}
.wstory{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px 14px;border-left:6px solid #2a1840;box-shadow:0 3px 0 rgba(20,40,75,.07)}
.wstory span{font-size:34px}.wstory p{margin:0;font-weight:700;font-style:italic;color:var(--navy)}
.story{padding:26px 20px}.storyart{min-height:130px;display:grid;place-items:center}.storyart span{font-size:90px;line-height:1}.storyart .heron{margin:0 auto}
.storytxt{font-size:20px;line-height:1.55;margin:14px 0 4px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.pcard{background:#f3f6fb;border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.pcard b{font-size:16px}.pcard small{color:var(--muted);font-weight:700;font-size:11px}
.namegrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.namebtn{background:#f3f6fb;border:3px solid transparent;border-radius:14px;padding:10px 14px;font-weight:800;font-size:16px;color:var(--navy)}.namebtn.sel{border-color:var(--gold);background:#fff7d6}
.avapick button{width:auto;height:auto;padding:6px 10px}
.fbrow{display:flex;align-items:center;gap:8px}.fbrow .heron{height:48px}
.heron.happy{animation:hop .6s ease 2}.heron.think{transform:rotate(-6deg)}
.bosspanel{gap:8px}.bosspanel .vs{display:flex;flex-direction:column;align-items:center}.vs .heron{height:56px}.vs .hearts{font-size:15px}
.vsx{font-family:var(--head);font-size:22px;color:var(--gold)}.tright{text-align:right}
.bosspanel.ouch{animation:shake .45s}
.featherwin{margin:6px auto}.featherwin .feather{width:90px;height:90px;animation:spin 1.2s ease}.featherwin.big{font-size:80px}

.reviewcard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:18px;background:linear-gradient(135deg,#efe9ff,#e3f0ff);border:2px solid #d9cdfb;color:var(--ink)}
.reviewcard small{display:block;color:var(--muted)}.reviewcard .mic{font-size:28px}
.mmap{border-collapse:separate;border-spacing:3px;font-size:13px}
.mmap th{font-size:11px;color:var(--muted);vertical-align:bottom;padding:2px}
.mmap .vh{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);max-height:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmap td{text-align:center;padding:5px 4px;border-radius:7px;min-width:30px}
.mmap .mcell{font-weight:800}.mmap sup{font-size:8px}
.mmap .sticky{position:sticky;left:0;background:#fff;text-align:left;z-index:1;min-width:90px}
.mmap .avgrow td{border-top:2px solid #eef2f8}

/* writing coach */
.coach{margin-top:10px}
.cstars div{background:#fff8e1;border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.cwish{background:#eef4ff;border-radius:12px;padding:8px 10px;font-size:14px}
.cstats{margin-top:6px}
.hlkeys{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.hlkey{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
.hltext{background:#fbfcfe;border:2px solid #e6ebf3;border-radius:14px;padding:12px;line-height:1.75;font-size:16px;white-space:normal;word-wrap:break-word}
.hltext.big{font-size:17px}
mark.hl{background:none;border-radius:4px;padding:0 1px;cursor:pointer;color:inherit}
.hl-spell{border-bottom:3px solid #e5484d;background:#fdecec!important}.hlkey.hl-spell{background:#fdecec;color:#c2343a}
.hl-caps,.hl-punct,.hl-grammar,.hl-edit{border-bottom:3px solid #e88a1a;background:#fff2e2!important}.hlkey.hl-caps,.hlkey.hl-punct,.hlkey.hl-grammar,.hlkey.hl-edit{background:#fff2e2;color:#b5650c}
.hl-long{background:#eef4ff!important;border-bottom:2px dashed #2f80ed}.hlkey.hl-long{background:#eef4ff;color:#1f5fbf}
.hl-word,.hl-repeat,.hl-opener,.hl-style{border-bottom:3px solid #8e44ad;background:#f6edfb!important}.hlkey.hl-word,.hlkey.hl-repeat,.hlkey.hl-opener,.hlkey.hl-style{background:#f6edfb;color:#7a3594}
mark.hl.sel{outline:2px solid var(--ink)}
.hltip{display:none;margin-top:8px;padding:8px 10px;border-radius:12px;background:#1f2756;color:#fff;font-size:14px}.hltip.show{display:block}
.coachsum{background:#f6f8fc;border-radius:10px;padding:6px 10px;margin:6px 0;color:var(--muted)}
.draftno{color:#5b3cc4}
.tfb{border:2px solid #f0c64a;background:#fffaf0;border-radius:14px;padding:10px 12px;margin:8px 0}
.tfgrid{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;margin-top:6px}
.tfgrid .dots{color:#d99a00;letter-spacing:2px}.tfgrid .dots .dim{color:#e6dcc0}
.tfc{font-style:italic;margin:8px 0 4px}.redraft{color:#b5650c}
.markform .mrk{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #eef2f8;font-size:14px}
.seg{display:flex;gap:4px}.segb{width:34px;height:34px;border-radius:10px;border:2px solid #dbe3ef;background:#fff;font-weight:800}
.segb.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.small{font-size:12px;padding:4px 9px}

/* cloud */
.logincard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#1f2756,#34418f);color:#fff;box-shadow:0 4px 0 #141a3d}
.logincard small{display:block;opacity:.85}.logincard .mic{font-size:30px}
.codein{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
.bigcode{font-size:44px;font-weight:900;color:var(--navy);letter-spacing:.18em;margin:2px 0 6px}
.pindots{display:flex;gap:14px;justify-content:center;margin:14px 0 6px}.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid #c9d3e6;transition:.15s}.pindots i.on{background:var(--navy);border-color:var(--navy)}
.pindots.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin-top:12px}
.pk{height:62px;border-radius:16px;border:2px solid #dbe3ef;background:#fff;font-size:26px;font-weight:800;box-shadow:0 3px 0 #dbe3ef}.pk:active{transform:translateY(2px);box-shadow:none}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid #e3e9f4;border-top-color:var(--navy);margin:6px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.syncdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#1fa65a;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 3px #1fa65a33}.syncdot.busy{background:#d48a00;box-shadow:0 0 0 3px #d48a0033}.syncdot.off{background:#9aa5b8;box-shadow:0 0 0 3px #9aa5b833}
.cloudbar{display:flex;align-items:center;gap:8px;background:#eef4ff;border:2px solid #c9d8f5;border-radius:16px;padding:10px 12px;margin-bottom:12px}
.tool.wide{grid-column:1/-1;width:100%;margin-bottom:12px}
.seg2{display:flex;background:#eef2f8;border-radius:12px;padding:4px;gap:4px;margin-bottom:6px}.seg2 button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:800;color:var(--muted)}.seg2 button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px #0002}
.pinshow{cursor:pointer;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
.lcard{border:2px dashed #9aa5b8;border-radius:14px;padding:12px;background:#fff;break-inside:avoid}
.lc-top{font-size:12px;font-weight:800;color:var(--muted)}.lc-name{font-size:24px;font-weight:900;color:var(--navy);margin:2px 0 6px}
.lc-row{display:flex;justify-content:space-between;font-size:16px;padding:3px 0;border-top:1px solid #eef2f8}.lc-row b{font-size:20px}
.lc-how{font-size:12px;color:var(--muted);margin-top:6px}
@media print{ .noprint,.toast{display:none!important} body{background:#fff!important} #app{max-width:none;padding:0} .lcard{border-color:#555} }

</style>

SPELL_WEEKS.forEach((w,i)=>{
  const sw=SPELL_SWAPS[w.week];
  if (sw) sw.split('|').forEach(x=>{ const [pair,s]=[x.slice(0,x.indexOf(':')), x.slice(x.indexOf(':')+1)], [oldW,newW]=pair.split('>'); const j=w.words.findIndex(p=>p[0]===oldW); if (j>=0) w.words[j]=[newW,s]; });
  w.stretch = (SPELL_STRETCH[i]||'').split('|').filter(Boolean).map(x=>{ const k=x.indexOf(':'); return [x.slice(0,k), x.slice(k+1)]; });
});
const spellAll = w => [...w.words, ...(w.stretch||[])];
const SPELL_N = w => spellAll(SPELL_WEEKS[w-1]).length;

const SPELL_ALL = SPELL_WEEKS.flatMap(spellAll);
const SPELL_TIER = lv => SPELL_WEEKS.filter(w=> lv===1 ? w.week<=15 : lv===2 ? w.week>15&&w.week<=30 : w.week>30).flatMap(spellAll);
const blankWord = (s,w) => s.replace(new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),'______');

PSG('bean','How to Grow a Bean in a Jar','instructions',2,`
Aim: To watch a bean seed sprout and grow roots.

You will need: a clean glass jar, paper towel, cotton wool, two dried beans and some water.

1. Fold the paper towel and press it around the inside of the jar.
2. Fill the middle of the jar with cotton wool to hold the paper in place.

5. Put the jar in a warm, light place, like a windowsill.

PSG('watercycle','The Water Cycle','information',2,`
The water you drink today might once have been part of a cloud, an ocean or even a dinosaur's drink! That is because water moves around our planet in a never-ending journey called the water cycle.

Evaporation: The sun heats water in oceans, rivers and dams. Some of the water turns into an invisible gas called water vapour and rises into the air.

Condensation: High in the sky, the air is cooler. The water vapour cools down and turns back into tiny drops of water. These drops join together to form clouds.

Precipitation: When the drops become too heavy, they fall back to the earth as rain, hail or snow.

Collection: The water collects in rivers, dams, oceans and under the ground. Then the sun heats it again, and the cycle starts all over.`,

On a summer night, you may have seen tiny lights flashing in the garden. These are fireflies, and they are one of many animals that can make their own light. This amazing ability is called bioluminescence.

Animals glow because of a chemical reaction inside their bodies. Unlike a light bulb, this light is "cold light", which means it gives off almost no heat.

Animals use their light in different ways. Fireflies flash to find a partner. Some deep-sea fish, like the anglerfish, have a glowing lure that dangles in front of their mouths. Curious little fish swim towards the light and get gobbled up!

Some jellyfish glow to startle animals that want to eat them. In parts of the world, tiny sea creatures make the waves sparkle blue at night.

Most glowing animals live in the deep ocean, where sunlight cannot reach.`,

PSG('moonglow','How the Moon Got Its Glow','legend',3,`
Long ago, when the world was new, the Moon had no light of its own. Every night it hung in the sky, dull and grey as an old stone, and the animals stumbled about in the dark.

The Sun felt sorry for the animals. "I cannot shine at night," she said, "because I must rest. But perhaps the Moon could carry a little of my light."

The Moon was shy. "I am too small and too plain to shine," it whispered.

So the Sun asked the animals for help. Each one gave a gift. The firefly gave a tiny spark. The heron gave the silver shine from the stream where it fished. The owl, who knew the night best, gave the gift of patience, so the Moon would not burn too brightly all at once.

The Sun gathered the gifts and wrapped them around the Moon like a soft blanket. That night, the Moon glowed gently above the world. The animals cheered and found their way home.

But the owl's gift of patience is why the Moon still grows slowly from a thin silver smile to a full, round face, and then slowly fades again, so that it never shines too brightly for too long.`,

PSG('phones','Should Learners Have Phones at School?','discussion',3,`

Other people say no. They argue that phones distract learners in class, because it is hard to concentrate when messages keep buzzing. Phones can also lead to cyberbullying, where unkind messages are sent online. Some teachers have noticed that learners talk and play less during break when they are looking at screens. There is also a risk that expensive phones could be lost or stolen.

What do you think? Before you decide, it is a good idea to listen to both sides of the argument.`,

Every September, the people of Riverbend held a kite festival on the hill behind the primary school. For weeks beforehand, the shop windows filled with kites shaped like dragons, octopuses and rockets, each one more expensive than the last.

On the morning of the festival, the hill was a sea of colour. Beside the gleaming shop kites, their homemade eagle looked small and rather lopsided. A tall boy in a branded cap glanced at it and snorted. "Did you build that in your sleep? It won't get higher than your knees."

Sipho felt his ears burn. He wanted to roll up the kite and walk straight home, but Ayo had already let out the string and was waiting for him.

For a while, nothing happened. The air was heavy and still, and dozens of expensive kites lay on the grass like stranded fish. Then, just after eleven, a strong breeze swept up the slope. The eagle trembled, lifted and suddenly shot upwards, climbing past the dragons and the rockets until it was a tiny red speck against the blue.

The tall boy's octopus, meanwhile, had spun in circles and wrapped itself around the branches of a gum tree.

The hippopotamus gets its name from two Greek words meaning "river horse". Yet a hippo is not related to horses at all. Scientists have discovered that its closest living relatives are actually whales and dolphins.

Hippos are among the largest land mammals on Earth. A large adult male can weigh as much as 3 000 kilograms, which is about as heavy as two small cars. Despite their size, they can run at up to 30 kilometres an hour over short distances, which is faster than most people can sprint.

Because their skin is thin and sensitive, hippos spend most of the day in rivers and lakes to keep cool and to avoid sunburn. Their eyes, ears and nostrils are positioned on the top of their heads, so they can see, hear and breathe while the rest of their body stays hidden underwater. When they dive, special muscles close their nostrils and ears. An adult can hold its breath for about five minutes. Hippos even produce a reddish, oily liquid on their skin that works like a natural sunscreen. This led early explorers to believe, wrongly, that hippos sweat blood.

At night, hippos leave the water to feed. They may walk several kilometres along the same well-worn paths and eat up to 40 kilograms of grass before returning at dawn. Surprisingly, they cannot really swim. Instead, they walk or bounce along the riverbed.

Although they eat only plants, hippos are extremely territorial and aggressive. A male will defend his stretch of river fiercely, and a mother will attack anything she thinks is a threat to her calf. Hippos are often described as one of the most dangerous animals in Africa, and they cause far more human deaths than lions or leopards. Most attacks happen when people come between a hippo and the water, or when boats surprise them.

Today, hippos face serious threats. Their habitat is shrinking as rivers are dammed and land is cleared for farming, and they are hunted illegally for their meat and ivory teeth. They are listed as a vulnerable species, which means that without protection, their numbers could fall sharply.`,

Lindiwe had a voice like warm honey. At home she sang constantly: in the shower, while washing the dishes, even while walking the dog around the block. But in public she sang to nobody. The thought of a room full of faces staring at her was enough to make her stomach twist into a knot.

So when her music teacher, Mr Daniels, asked her to sing a solo at the end-of-year concert, she said no before he had even finished the sentence.

"Think about it," he said gently. "You have a gift, Lindiwe. Gifts are meant to be shared."

She thought about it all week. She thought about it so much that she could not concentrate in Maths and burnt the toast two mornings in a row. On Friday, her grandmother found her sitting on the back step, staring at nothing.

"When I was your age," Gogo said, lowering herself onto the step, "I was terrified of the dark. Every night I lay awake listening to every creak and rustle. Do you know what cured me?" Lindiwe shook her head. "My mother made me walk to the bottom of the garden every evening to close the gate. The first night, I ran there and back so fast I nearly flew. By the end of the month, I was strolling."

Lindiwe was quiet for a long time. Then she went inside and wrote Mr Daniels a two-word note: "I'll try."

The night of the concert, the hall was packed. Lindiwe stood in the wings, her heart hammering like a drum. When her name was called, her legs felt as if they belonged to somebody else. She walked to the microphone, looked out at the sea of faces, and for one dreadful moment, her mind went completely blank.

Lindiwe closed her eyes and began to sing.

A honeybee colony can contain up to 60 000 bees, yet it works with remarkable precision, almost like a single living creature. Every bee has a job, and those jobs change as the bee grows older.

A worker bee lives for only about six weeks in summer. During her first days, she cleans the cells of the hive. Next, she becomes a nurse, feeding the developing young. Later she builds wax comb, guards the entrance, and finally, in the last weeks of her life, she becomes a forager, flying out to collect nectar and pollen. The queen, by contrast, can live for several years. Her only task is to lay eggs: as many as 2 000 a day in summer.

Perhaps the most astonishing discovery about bees was made by an Austrian scientist, Karl von Frisch, who spent decades observing them. He noticed that when a forager found a good source of food, other bees soon arrived at the same place, even though they had not followed her. How did they know where to go?

Von Frisch discovered that bees communicate through dance. If the food is close to the hive, the forager performs a "round dance", circling first one way and then the other. If it is further away, she performs a "waggle dance": she runs in a straight line while waggling her body, then loops back and repeats. The direction of the straight run shows the direction of the food in relation to the sun, and the length of the waggle shows how far away it is. For this discovery, von Frisch was awarded a Nobel Prize in 1973.

Bees matter far beyond the hive. As they move from flower to flower, they carry pollen that allows plants to produce seeds and fruit. Experts estimate that about one third of the food we eat depends on pollinators such as bees. Sadly, bee populations in many parts of the world are falling because of disease, the loss of wild flowers, and the use of pesticides. Planting indigenous flowers and avoiding poisonous sprays are two simple ways that anyone can help.`,

The storm arrived earlier than anyone had predicted. By four o'clock the sky over Cape Agulhas had turned the colour of a bruise, and the sea was flinging itself against the rocks as though it had a personal grudge against the land.

Her mother was in Bredasdorp, more than thirty kilometres away, and the telephone line had gone dead an hour before. Nadia was entirely alone.

Nadia pulled on her yellow oilskin and climbed the spiral staircase to the lamp room, two at a time. Her father had shown her the manual switch only once, three summers ago, almost as a joke. "In case you ever need to wake up the whole ocean," he had said. Her hands were shaking so badly that it took three attempts to lift the heavy lever. Then, with a deep hum, the lamp blazed into life, and a beam of white light swept across the churning water.

Every single minute, the equivalent of a full rubbish truck of plastic is dumped into the world's oceans. If nothing changes, some experts warn that by 2050 there could be more plastic in the sea than fish. This is not a problem for the future. It is happening now, and it is happening on our own beaches.

Some people argue that plastic is too useful to give up, and they have a point. Plastic keeps food fresh, makes medical equipment safe and clean, and is light and cheap to transport. However, the real problem is not plastic itself. It is single-use plastic: the straws, bags, bottles and wrappers that we use for a few minutes and then throw away. These items can take up to 450 years to break down, and even then they never truly disappear. Instead, they crumble into tiny pieces called microplastics, which are now found in sea salt, in tap water, and even in the air we breathe.

The damage to wildlife is heartbreaking. Sea turtles mistake floating bags for jellyfish. Seabirds feed bottle caps to their chicks. Whales have washed up on beaches with their stomachs full of plastic. Once these animals swallow plastic, they feel full, so they stop eating and slowly starve.

Recycling is helpful, but it cannot solve the problem alone. In South Africa, only a small fraction of plastic is recycled; the rest ends up in landfills, rivers and the sea. The most effective solution is simpler: we must use less plastic in the first place.

This is where every learner can make a difference. Carry a refillable water bottle. Pack your lunch in a container instead of cling film. Say no to straws. Persuade your family to take reusable bags to the shops. Join a beach or river clean-up, and when you see litter, pick it up, even if it is not yours.

const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function mc(prompt, answer, wrongs, explain, extra={}){
  return Object.assign({type:'mc', prompt, answer, options:shuffle(uniq([answer, ...wrongs])), explain}, extra);
}
function tq(sentence, prompt, explain, extra={}){
  const tokens = sentence.split(' ').map(t=>{
    const m = t.match(/^(\W*)\*(.+?)\*(\W*)$/);
    return m ? {pre:m[1], w:m[2], p:m[3], ok:true} : {pre:'', w:t, p:'', ok:false};
  });
  return Object.assign({type:'tap', prompt, tokens, explain, answer:tokens.filter(t=>t.ok).map(t=>t.w).join(' / ')}, extra);
}
function typeQ(prompt, answer, explain, extra={}){ return Object.assign({type:'type', prompt, answer, explain}, extra); }
function sortQ(prompt, buckets, groups, per, explain){
  const items = shuffle(groups.flatMap((g,b)=>sample(g,per).map(w=>({w,b}))));
  const key = buckets.map((name,b)=>`<b>${escH(name)}:</b> ${items.filter(i=>i.b===b).map(i=>escH(i.w)).join(', ')}`).join('<br>');
  return {type:'sort', prompt, buckets, items, explain:(explain?explain+'<br>':'')+key, answer:'see the groups below'};
}
function orderQ(prompt, items, explain, extra={}){
  let order; do { order = shuffle(items.map((_,i)=>i)); } while (items.length>1 && order.every((k,i)=>items[k]===items[i]));
  return Object.assign({type:'order', prompt, items, order, explain, answer:items.join(' ')}, extra);
}
function matchQ(prompt, pairs, explain){
  return {type:'match', prompt, pairs, explain:(explain?explain+'<br>':'')+pairs.map(p=>`${escH(p[0])} → <b>${escH(p[1])}</b>`).join('<br>'), answer:'see the pairs below'};
}

function F(spec, prompt='Choose the word that fits:', why=''){ const [s,a,...w]=spec.split('|'); return mc(prompt, a, w, `<b>${escH(fill(s,a))}</b> ${why}`, {clue:s}); }
function M(spec, why=''){ const [main,ex]=spec.split('>>'); const [q,a,...w]=main.split('|'); return mc(q, a, w, ex||why||`The answer is <b>${escH(a)}</b>.`); }
function C(clue, prompt, spec, why=''){ const [a,...w]=spec.split('|'); return mc(prompt, a, w, why||`The answer is <b>${escH(a)}</b>.`, {clue}); }

}

/* ================= WORLDS & SKILLS ================= */
const WORLDS = [
{ id:'nouns', name:'Noun Nest', icon:'🪺', color:'#2f80ed',
  boss:{name:'Captain Croc', e:'🐊', taunt:"Snap snap! I'll gobble up all your nouns!"},
  skills:[
  { id:'n-cp', name:'Common & proper nouns', out:'I can tell common and proper nouns apart and use capital letters for proper nouns.', lvl:['Sort common and proper nouns','Find the missing capital','Capitals in tricky places'],
    learn:{rule:"A <b>noun</b> is a naming word. A <b>common noun</b> names any person, place or thing: <i>city, river, teacher</i>. A <b>proper noun</b> names one special person, place or thing, and always starts with a capital letter: <i>Johannesburg, the Vaal River, Mrs Botha</i>.",
      tip:"Proper nouns are VIPs. They always wear a capital-letter crown 👑", ex:["a <b>city</b> → <b>Durban</b>","a <b>month</b> → <b>December</b>","a <b>language</b> → <b>English</b>"]},
    gen:lv=> lv===1 ? sortQ('Sort the nouns. Tap a word, then tap its group.', ['Common nouns','Proper nouns'], [COMMON, PROPER], 3, 'Proper nouns name one special person, place or thing and start with a capital.')
      : lv===2 ? (s=>tq(s,'Tap the word that needs a capital letter',`It should be <b>${(w=>w==='i'?'I':cap1(w))(s.match(/\*(.+?)\*/)[1])}</b>. Names of people, places, days and months are proper nouns.`))(rnd(CAPS2))
      : best3(CAPS3) },
  { id:'n-abs', name:'Abstract nouns', out:'I can identify abstract nouns and make abstract nouns from other words.', lvl:['Sort concrete and abstract nouns','Spot the abstract noun','Make abstract nouns'],
    learn:{rule:"<b>Concrete nouns</b> are things you can see, touch, hear, smell or taste: <i>apple, rain, drum</i>. <b>Abstract nouns</b> are feelings, ideas and qualities you cannot touch: <i>love, courage, honesty</i>.",
      tip:"Can you put it in a box? 📦 If not, it's abstract. Nobody can box up happiness!", ex:["Her <b>kindness</b> made us smile.","We felt great <b>joy</b> when we won.","brave → <b>bravery</b>, curious → <b>curiosity</b>"]},
    gen:lv=> lv===1 ? sortQ('Sort the nouns. Tap a word, then tap its group.', ['Concrete (can touch)','Abstract (cannot touch)'], [CONCRETE, ABSTRACT], 3)
      : lv===2 ? tq(rnd(ABS_TAP),'Tap the abstract noun','An abstract noun is a feeling, idea or quality that you cannot touch.')
      : (([a,n])=>typeQ(`Turn "${a}" into an abstract noun`, n, `${a} → <b>${n}</b>`, {clue:'Example: kind → kindness'}))(rnd(ABS3)) },
  { id:'n-coll', name:'Collective nouns', out:'I can use collective nouns for groups of people, animals and things.', lvl:['Everyday groups','Animal groups','Unusual groups'],
    learn:{rule:"A <b>collective noun</b> is one word for a whole group of people, animals or things.",
      tip:"Some are wild! A <b>tower</b> of giraffes 🦒, a <b>crash</b> of rhinos 🦏, a <b>parliament</b> of owls 🦉", ex:["a <b>flock</b> of sheep","a <b>pride</b> of lions","a <b>tower</b> of giraffes"]},
    gen:lv=>{ const pool=[COLL1,COLL2,COLL3][lv-1];
      if (lv>1 && pct(.3)) return matchQ('Match each group to its collective noun.', sample(pool,4));
      const [g,c]=rnd(pool); return mc(`a ___ of ${g}`, c, sample(pool.filter(x=>x[1]!==c).map(x=>x[1]),3), `a <b>${c}</b> of ${g}`); } },
  { id:'n-plural', name:'Plurals & gender', out:'I can spell plurals correctly and use masculine and feminine nouns.', lvl:['Add -s or -es','y → ies, f → ves, o → oes','Irregular plurals'],
    learn:{rule:"Most nouns add <b>-s</b>. Words ending in s, x, ch or sh add <b>-es</b>. Consonant + y → <b>-ies</b>. Many words ending in f or fe → <b>-ves</b>. Some are irregular: <i>child → children</i>.<br><br>Nouns can also be <b>masculine</b> or <b>feminine</b>: <i>king → queen</i>.",
      tip:"Words ending in s, x, ch and sh <b>hiss</b> 🐍 so they need an extra syllable: box<b>es</b>, church<b>es</b>!", ex:["fox → fox<b>es</b>","baby → bab<b>ies</b>","wolf → wol<b>ves</b>","mouse → <b>mice</b>"]},
    gen:lv=>{ if (pct(.25)){ const [m,f]=rnd(GENDER); return mc(`What is the feminine of "${m}"?`, f, sample(GENDER.filter(x=>x[1]!==f).map(x=>x[1]),3), `${m} → <b>${f}</b>`); }
      const [s,p,...alts]=rnd([PL1,PL2,PL3][lv-1]); const rule=['Add -s, or -es after s, x, ch and sh.','Change y to ies, f to ves, and add -es to some o words.','This one is irregular, so you just have to learn it!'][lv-1];
      return typeQ(`Write the plural of "${s}"`, p, `${s} → <b>${p}</b>. ${rule}`, {alts}); } },
  { id:'n-pron', name:'Pronouns', out:'I can use personal and possessive pronouns correctly.', lvl:['Personal pronouns','Possessive pronouns','Tricky pronouns'],
    learn:{rule:"A <b>pronoun</b> takes the place of a noun so we don't keep repeating it.<br><b>Personal:</b> I, you, he, she, it, we, they, me, him, her, us, them.<br><b>Possessive:</b> mine, yours, his, hers, ours, theirs.",
      tip:"Pronouns are substitute players 🔄 When the noun needs a rest, the pronoun comes onto the field! Tricky one: take the other person away to test it. <i>Gran gave sweets to (Ben and) me.</i>", ex:["<b>Sipho</b> kicked the ball. <b>He</b> scored!","This book is <b>mine</b>.","Mom and <b>I</b> went shopping."]},
    gen:lv=> lv===1&&pct(.35) ? tq(rnd(PRON_TAP),'Tap one pronoun','A pronoun takes the place of a noun.') : F(rnd([PRON1,PRON2,PRON3][lv-1]),'Choose the correct pronoun:') },
  { id:'n-count', name:'Countable & uncountable', out:'I can tell countable and uncountable nouns apart and use much, many, few and little correctly.', lvl:['Sort the nouns','Much or many?','Few, little, fewer, less'],
    learn:{rule:"<b>Countable nouns</b> can be counted: <i>one apple, two apples</i>. Use <b>many</b>, <b>few</b> and <b>fewer</b>.<br><b>Uncountable nouns</b> can't be counted one by one: <i>water, sugar, homework</i>. Use <b>much</b>, <b>little</b> and <b>less</b>.",
      tip:"Can you put a number in front of it? 🔢 <i>Three eggs</i> ✅ <i>Three waters</i> ❌ If not, it's uncountable!", ex:["How <b>many</b> eggs? How <b>much</b> milk?","<b>a few</b> biscuits, <b>a little</b> sugar","<b>fewer</b> people, <b>less</b> noise"]},
    gen:lv=> lv===1 ? sortQ('Sort the nouns. Tap a word, then tap its group.', ['Countable','Uncountable'], [COUNTABLE, UNCOUNTABLE], 3)
      : F(rnd(lv===2?MANY:FEW)) },
  { id:'n-ptypes', name:'More pronoun types', out:'I can use demonstrative, reflexive and question pronouns.', lvl:['this, that, these, those','myself, themselves...','who, whose, which...'],
    learn:{rule:"<b>Demonstrative</b> pronouns point: <i>this, that, these, those</i>.<br><b>Reflexive</b> pronouns point back to the subject: <i>myself, himself, ourselves, themselves</i>.<br><b>Interrogative</b> pronouns ask questions: <i>who, whom, whose, which, what</i>.",
      tip:"<b>This/these</b> = here, close by 👇 <b>That/those</b> = over there 👉", ex:["<b>These</b> shoes are mine.","I made it <b>myself</b>.","<b>Whose</b> bag is this?"]},
    gen:lv=> F(rnd([DEMO,REFL,INTERR][lv-1]),'Choose the correct pronoun:') }
]},
{ id:'verbs', name:'Verb Vlei', icon:'🏃', color:'#1fa65a',

  { id:'v-conc', name:'Subject–verb agreement', out:'I can make the verb agree with its subject.', lvl:['is/are, has/have','Longer subjects','Tricky subjects'],

      tip:"It's a see-saw ⚖️ Only ONE side gets the s: The dog bark<b>s</b>. The dog<b>s</b> bark. Watch out: <i>each, everybody, nobody</i> are singular!", ex:["The boy <b>is</b> happy. The boys <b>are</b> happy.","The bag of apples <b>is</b> heavy.","Everybody <b>is</b> ready."]},

  { id:'v-help', name:'Helping verbs', out:'I can identify helping verbs and use them to change meaning.', lvl:['Spot the helping verb','Choose the helping verb','What does it mean?'],
    learn:{rule:"A <b>helping (auxiliary) verb</b> helps the main verb: <i>is, am, are, was, were, has, have, had, will, can, should, must, might, may</i>.",
      tip:"The helping verb is the sidekick 🦸 It stands next to the hero verb: <b>is</b> singing, <b>will</b> go, <b>has</b> eaten.", ex:["She <b>is</b> singing.","You <b>must</b> wear a seatbelt.","It <b>might</b> rain."]},
    gen:lv=> lv===1 ? tq(rnd(HELP_TAP),'Tap the helping verb','The helping verb works with the main verb.')
      : lv===2 ? (([s,a,o])=>mc('Choose the helping verb that fits:', a, o, `<b>${escH(fill(s,a))}</b>`, {clue:s}))(rnd(HELP_FILL)) : M(rnd(MODAL)) },
  { id:'v-voice', name:'Active & passive voice ⭐', out:'I can tell active and passive sentences apart and change one into the other. (Challenge skill)', lvl:['Active or passive?','Make it passive','Make it active'],

      tip:"Spot the passive with <b>was/were + by</b> 🔍 <i>The ball <b>was</b> kicked <b>by</b> Thabo.</i>", ex:["Active: <b>Gran</b> baked a cake.","Passive: The cake <b>was baked by</b> Gran."]},
    gen:lv=> lv===1 ? (([s,t])=>mc('Is this sentence active or passive?', t, ['active','passive'], t==='passive'?'The subject has the action done to it (was ... by).':'The subject does the action.', {clue:s}))(rnd(VOICE1))

]},
{ id:'describe', name:'Describing Dunes', icon:'🎨', color:'#e67e22',
  boss:{name:'The Dull Python', e:'🐍', taunt:"Sssso boring... I'll ssssqueeze all the describing wordsss out!"},
  skills:[
  { id:'d-adj', name:'Adjectives', out:'I can identify adjectives, choose strong adjectives and make adjectives from nouns.', lvl:['Spot the adjective','Choose the best adjective','Make adjectives'],
    learn:{rule:"An <b>adjective</b> describes a noun. It tells us what kind, which one or how many. We can make adjectives by adding endings: <i>danger → dangerous, rain → rainy, help → helpful</i>.",
      tip:"Adjectives are the noun's paint box 🎨 A car is boring. A <b>shiny</b>, <b>red</b>, <b>speedy</b> car is exciting!", ex:["a <b>tall</b> giraffe","the <b>fluffy</b> kitten","fame → <b>famous</b>"]},
    gen:lv=> lv===1 ? tq(rnd(ADJ_TAP),'Tap one adjective','An adjective describes a noun.')
      : lv===2 ? (pct(.5)?F(rnd(ADJ_PICK),'Choose the adjective that fits:','An adjective describes the noun.'):(a=>mc('Which word is an adjective?', a, sample(NONADJ,3), `<b>${a}</b> can describe a noun.`))(rnd(ADJS)))
      : (([n,a,...alts])=>typeQ(`Turn the noun "${n}" into an adjective`, a, `${n} → <b>${a}</b>`, {alts, clue:'Example: rain → rainy'}))(rnd(ADJ_MAKE)) },
  { id:'d-comp', name:'Degrees of comparison', out:'I can use comparative and superlative forms of adjectives.', lvl:['-er and -est','Double it or change y','more, most and irregulars'],
    learn:{rule:"<b>Positive:</b> tall. <b>Comparative</b> (comparing two): taller. <b>Superlative</b> (three or more): tallest.<br>Long adjectives use <b>more</b> and <b>most</b>. Some are irregular: <i>good → better → best</i>.",
      tip:"<b>-er</b> for a pair 👫 <b>-est</b> for the rest 👨‍👩‍👧‍👦", ex:["big → big<b>ger</b> → big<b>gest</b>","happy → happ<b>ier</b> → happ<b>iest</b>","good → <b>better</b> → <b>best</b>"]},
    gen:lv=>{ const [b,c,s]=rnd([COMP1,COMP2,COMP3][lv-1]), w=(b+'er'===c)?'more '+c:b+'er';
      if (pct(.45)||b==='many'||b==='little') return pct(.5) ? typeQ(`Write the comparative of "${b}"`, c, `${b} → <b>${c}</b> → ${s}`) : typeQ(`Write the superlative of "${b}"`, s, `${b} → ${c} → <b>${s}</b>`);
      return pct(.5) ? mc('Choose the correct word:', c, [b, s, w], `Comparing TWO things, so use the comparative: <b>${c}</b>.`, {clue:`This one is ___ than that one. (${b})`})
        : mc('Choose the correct word:', s, [b, c, w], `Comparing THREE or more, so use the superlative: <b>${s}</b>.`, {clue:`It is the ___ of them all. (${b})`}); } },
  { id:'d-adv', name:'Adverbs', out:'I can identify adverbs of manner, time and place and form adverbs from adjectives.', lvl:['Spot the adverb','How, when or where?','Make adverbs'],
    learn:{rule:"An <b>adverb</b> tells us more about a verb: <b>how</b> (quickly), <b>when</b> (yesterday) or <b>where</b> (outside). Many adverbs end in <b>-ly</b>.",
      tip:"An adverb ADDS to the VERB ➕ That's why it's called an ad-verb! Watch out: good → <b>well</b>.", ex:["She ran <b>quickly</b>. (how?)","We swam <b>yesterday</b>. (when?)","happy → happ<b>ily</b>"]},
    gen:lv=> lv===1 ? tq(rnd(ADV_TAP),'Tap the adverb','An adverb tells us how, when or where.')
      : lv===2 ? sortQ('Sort the adverbs. Tap a word, then tap its group.', ['How?','When?','Where?'], ADV_SORT, 2)
      : (([a,d])=>typeQ(`Turn the adjective "${a}" into an adverb`, d, `${a} → <b>${d}</b>`, {clue:'Example: slow → slowly'}))(rnd(ADV3)) },
  { id:'d-art', name:'A, an and the', out:'I can choose a, an or the correctly, listening for vowel sounds.', lvl:['a or an?','Tricky sounds','a, an or the?'],
    learn:{rule:"Use <b>a</b> before a consonant SOUND and <b>an</b> before a vowel SOUND. Use <b>the</b> when you mean one particular thing, or something there is only one of (the sun).",
      tip:"Listen, don't look! 👂 <b>an</b> hour (sounds like 'our'), <b>a</b> unicorn (sounds like 'you')", ex:["<b>an</b> elephant","<b>an</b> hour","<b>a</b> uniform","<b>the</b> sun"]},
    gen:lv=> lv===3 ? F(rnd(ART3)) : (([w,a])=>mc('Choose a or an:', a, ['a','an'], `<b>${a} ${w}</b>. ${a==='an'?'It starts with a vowel sound.':'It starts with a consonant sound.'}`, {clue:`___ ${w}`}))(rnd(lv===1?ART1:ART2)) }
]},
{ id:'sentences', name:'Sentence Bridge', icon:'🌉', color:'#8e44ad',
  boss:{name:'The Bridge Troll', e:'🧌', taunt:"Nobody crosses MY bridge without perfect sentences!"},
  skills:[
  { id:'s-types', name:'Kinds of sentences', out:'I can identify and write statements, questions, commands and exclamations.', lvl:['Name the sentence','Choose the end mark','Change the sentence'],
    learn:{rule:"<b>Statement:</b> tells you something (.)<br><b>Question:</b> asks something (?)<br><b>Command:</b> tells someone to do something (. or !)<br><b>Exclamation:</b> shows strong feeling (!)",
      tip:"Statements TELL 📣, questions ASK ❓, commands ORDER 👉, exclamations SHOUT 💥", ex:["The bus is late. <i>(statement)</i>","Where is my pencil? <i>(question)</i>","Close the door. <i>(command)</i>","What a goal! <i>(exclamation)</i>"]},
    gen:lv=> lv===1 ? (([s,t])=>mc('What kind of sentence is this?', t, ['statement','question','command','exclamation'], `It is a <b>${t}</b>.`, {clue:s}))(rnd(STYPES))
      : lv===2 ? (([s,m])=>mc('Which punctuation mark should end this sentence?', m, ['.','?','!'], `<b>${escH(s+m)}</b>`, {clue:s+' ___'}))(rnd(END_MARK)) : M(rnd(STYPE3)) },
  { id:'s-subj', name:'Subject, predicate & object', out:'I can find the subject, predicate and object of a sentence.', lvl:['Find the subject','Find the predicate','Find the object'],
    learn:{rule:"The <b>subject</b> is who or what the sentence is about. The <b>predicate</b> is everything else: what the subject does or is. The <b>object</b> is the person or thing that the action is done to.",
      tip:"Ask WHO did it? 🙋 That's the subject. Ask WHAT did they do it to? 🎯 That's the object.", ex:["<b>The hungry lion</b> | chased a zebra. (subject | predicate)","The lion chased <b>a zebra</b>. (object)"]},
    gen:lv=>{ if (lv===3){ const [a,o,e]=rnd(OBJ), s=a+o+e, subj=a.trim().split(' ').slice(0,-1).join(' '), verb=a.trim().split(' ').pop();
        return mc('What is the OBJECT of this sentence?', o, [subj, verb, s.replace(/\.$/,'')], `<b>${o}</b> is what the action (${verb}) is done to.`, {clue:s}); }
      const [s,p]=rnd(SUBJ), pw=p.replace(/\.$/,'').split(' '), sw=s.split(' '), mix=sw[sw.length-1]+' '+pw[0], tail=pw.slice(-2).join(' '), pr=p.replace(/\.$/,'');
      return lv===1 ? mc('What is the SUBJECT of this sentence?', s, [pr, mix, tail], `<b>${s}</b> is who or what the sentence is about.`, {clue:s+' '+p})
        : mc('What is the PREDICATE of this sentence?', pr, [s, mix, tail], `<b>${pr}</b> tells us what the subject did.`, {clue:s+' '+p}); } },
  { id:'s-conj', name:'Joining words', out:'I can use conjunctions to join words and sentences.', lvl:['and, but, or','so, because','although, unless, until, while'],
    learn:{rule:"<b>Conjunctions</b> join words and sentences. <i>and</i> adds, <i>but</i> shows a contrast, <i>or</i> gives a choice, <i>so</i> shows a result, <i>because</i> gives a reason. Others: <i>although, unless, until, while, before</i>.",
      tip:"Remember the FANBOYS 👦: <b>F</b>or, <b>A</b>nd, <b>N</b>or, <b>B</b>ut, <b>O</b>r, <b>Y</b>et, <b>S</b>o", ex:["I was tired, <b>so</b> I slept.","We stayed in <b>because</b> it was cold.","<b>Although</b> it rained, we played."]},
    gen:lv=> lv===1&&pct(.3) ? tq(rnd(CONJ_TAP),'Tap the conjunction','A conjunction joins words or sentences.') : F(rnd([CONJ1,CONJ2,CONJ3][lv-1]),'Choose the best conjunction:') },
  { id:'s-prep', name:'Prepositions', out:'I can use prepositions of place and time correctly.', lvl:['Where?','When?','Tricky prepositions'],
    learn:{rule:"A <b>preposition</b> shows where something is, or when something happens: <i>in, on, under, over, behind, between, through, during, after</i>.",
      tip:"Picture a mouse and a box 🐭📦 The mouse can be IN, ON, UNDER, BEHIND or BESIDE the box. <b>Between</b> two, <b>among</b> many!", ex:["The cat hid <b>under</b> the bed.","We have art <b>on</b> Monday <b>at</b> ten o'clock.","Share it <b>among</b> the class."]},
    gen:lv=> lv===1 ? (pct(.5)?tq(rnd(PREP_TAP),'Tap a preposition','A preposition shows where or when.'):(([s,a,o])=>mc('Choose the best preposition:', a, o, `<b>${escH(fill(s,a))}</b>`, {clue:s}))(rnd(PREP_FILL)))
      : F(rnd(lv===2?PREP2:PREP3),'Choose the best preposition:') },
  { id:'s-build', name:'Build a sentence', out:'I can put words in the right order to make a complete sentence.', lvl:['Short sentences','Longer sentences','Sentences with commas'],
    learn:{rule:"A sentence starts with a capital letter, ends with a full stop, question mark or exclamation mark, and makes complete sense. Many sentences go: <b>Who/what</b> → <b>did what</b> → <b>where/when</b>.",
      tip:"Find the word with the capital letter first 🔠 That one starts the sentence. The word with the full stop goes last!", ex:["<b>The heron</b> | caught a fish | in the river.","<b>After school,</b> we played soccer."]},
    gen:lv=> (s=>orderQ('Build the sentence. Tap the words in the right order.', s.split(' '), `<b>${escH(s)}</b>`))(rnd([BUILD1,BUILD,BUILD3][lv-1])) },
  { id:'s-complex', name:'Simple, compound & complex', out:'I can identify simple, compound and complex sentences and join sentences.', lvl:['Simple or compound?','Compound or complex?','Join the sentences'],
    learn:{rule:"A <b>simple</b> sentence has one main idea. A <b>compound</b> sentence joins two simple sentences with <i>and, but, or, so</i>. A <b>complex</b> sentence has a main part and a part starting with <i>because, when, although, if</i> that can't stand on its own.",
      tip:"Cover up the joining word part 🙈 If what's left makes sense AND the hidden part makes sense alone, it's compound. If the hidden part can't stand alone, it's complex!", ex:["The dog barked. <i>(simple)</i>","The dog barked <b>and</b> the cat ran. <i>(compound)</i>","<b>When</b> the dog barked, the cat ran. <i>(complex)</i>"]},
    gen:lv=> lv===3 ? M(rnd(SC3)) : (([s,t])=>mc('What kind of sentence is this?', t, lv===1?['simple','compound']:['simple','compound','complex'], `It is a <b>${t}</b> sentence.`, {clue:s}))(rnd(lv===1?SC1:SC2)) }
]},
{ id:'punct', name:'Punctuation Pond', icon:'💧', color:'#0097a7',
  boss:{name:'Inky the Octopus', e:'🐙', taunt:"Splat! I've squirted ink all over your punctuation!"},
  skills:[
  { id:'p-caps', name:'Capitals & end marks', out:'I can use capital letters and full stops, question marks and exclamation marks correctly.', lvl:['End marks','Find the missing capital','Spot the correct sentence'],
    learn:{rule:"Use a <b>capital letter</b> for the first word of a sentence, for <b>I</b>, and for names of people, places, days and months. End every sentence with a <b>. ? or !</b>",
      tip:"The capital letter is the doorbell 🔔 that starts a sentence. The full stop is the door closing 🚪", ex:["<b>O</b>n <b>M</b>onday, <b>I</b> visited <b>C</b>ape <b>T</b>own<b>.</b>"]},
    gen:lv=>{ if (lv===1){ const [s,m]=rnd(END_MARK); return mc('Which punctuation mark should end this sentence?', m, ['.','?','!'], `<b>${escH(s+m)}</b>`, {clue:s+' ___'}); }
      if (lv===3) return best3(PUNCT3);
