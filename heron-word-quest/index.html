const TIRED = {nice:'lovely, pleasant, delightful, kind', good:'excellent, wonderful, enjoyable, skilful', bad:'awful, dreadful, terrible, unpleasant', very:'extremely, incredibly, or a stronger word',
  got:'received, fetched, became, reached', said:'whispered, shouted, replied, explained', went:'walked, raced, wandered, hurried', big:'enormous, huge, massive, gigantic', fun:'exciting, thrilling, entertaining',
  happy:'delighted, thrilled, cheerful, overjoyed', sad:'miserable, upset, heartbroken, gloomy', stuff:'a more exact word', things:'a more exact word', really:'extremely, truly, or leave it out', little:'tiny, small, minute, slight'};
const TIRED_LIMIT = {said:3, went:3, very:2, really:2, got:2, nice:2, good:2, bad:2, big:2, fun:2, happy:3, sad:3, stuff:1, things:2, little:3};
const STOP = new Set('the a an and but or so of to in on at for with from by as is was were are be been am it its this that these those he she they we you i me him her them us my your his their our there then than when what which who whom whose where why how not no yes all some any very just also too into onto out up down over under after before because if while said had has have do did does can could will would should may might must one two three'.split(' '));
const CONNECTIVES = ['because','however','although','therefore','meanwhile','suddenly','finally','eventually','afterwards','unless','whereas','since','until','as soon as','even though','in addition','furthermore','on the other hand','as a result','despite','while','before','after','when','so that','instead'];
const DAYS_MONTHS = /\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|january|february|march|april|june|july|august|september|october|november|december|english|afrikaans|isizulu|isixhosa|sesotho|south africa|johannesburg|cape town|durban|pretoria)\b/g;

function sentencesOf(text){
  const out=[]; const re=/[^.!?]+(?:[.!?]+["'”’]?|$)/g; let m;
  while ((m=re.exec(text))){ const raw=m[0]; const s=raw.trim(); if (!s) continue; const start=m.index+raw.indexOf(s); out.push({s, start, end:start+s.length}); }
  return out;
}
const wordsOf = t => (t.match(/[A-Za-z']+/g)||[]);

function analyseWriting(text, opts={}){
  const t=String(text||''), lower=t.toLowerCase(), issues=[], add=(start,end,type,msg,fix)=>issues.push({start,end,type,msg,fix});
  const words=wordsOf(t), wc=words.length, sents=sentencesOf(t).filter(x=>/[A-Za-z]/.test(x.s));
  const paras=t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  // 1. Spelling: common mistakes and missing apostrophes
  let m; const wre=/[A-Za-z']+/g;
  while ((m=wre.exec(t))){ const w=m[0], lw=w.toLowerCase(), fix=MISSPELT[lw];
    if (fix)
      add(m.index, m.index+w.length, fix.includes("'")?'punct':'spell', fix.includes("'")?`Missing apostrophe: write "${fix}".`:`Check the spelling: "${fix}".`, fix);
    if (w==='i') add(m.index, m.index+1, 'caps', 'Always write "I" as a capital letter.', 'I'); }
  // 2. "should of"
  const ofre=/\b(should|could|would|must|might)\s+of\b/gi;
  while ((m=ofre.exec(t))) add(m.index, m.index+m[0].length, 'grammar', `Write "${m[1]} have", not "${m[1]} of".`, m[1]+' have');
  // 3. Double words
  const dre=/\b(\w+)\s+\1\b/gi;
  while ((m=dre.exec(t))) if (!/^(had|that|very)$/i.test(m[1])) add(m.index, m.index+m[0].length, 'edit', `You wrote "${m[1]}" twice in a row.`);
  // 4. Capital letters at the start of sentences, days, months and places
  const capre=opts.poem ? /(^)(["'“‘]?)([a-z])/g : /(^|\n\s*\n\s*|[.!?]\s+)(["'“‘]?)([a-z])/g;
  while ((m=capre.exec(t))){ const before=t.slice(Math.max(0,m.index-6), m.index+m[1].length);
    if (/\b(e\.g|i\.e|etc|Mr|Mrs|Ms|Dr|St|a\.m|p\.m)\.\s*$/i.test(before)) continue;
    const pos=m.index+m[1].length+m[2].length; add(pos, pos+1, 'caps', 'Start every sentence with a capital letter.', m[3].toUpperCase()); }
  let d; DAYS_MONTHS.lastIndex=0;
  while ((d=DAYS_MONTHS.exec(lower))){ const orig=t.slice(d.index, d.index+d[0].length); if (/^[a-z]/.test(orig)) add(d.index, d.index+d[0].length, 'caps', 'Names of days, months, languages and places need capital letters.'); }
  // 5. End punctuation
  if (wc>=5 && !/[.!?]["'”’)]*\s*$/.test(t.trim())) add(Math.max(0,t.trimEnd().length-1), t.trimEnd().length, 'punct', 'Finish your last sentence with a full stop, question mark or exclamation mark.');
  paras.slice(0,-1).forEach(pg=>{ if (!/[.!?:]["'”’)]*$/.test(pg) && wordsOf(pg).length>4 && !opts.poem){ const i=t.indexOf(pg); add(i+pg.length-1, i+pg.length, 'punct', 'This paragraph needs end punctuation.'); } });
  // 6. Speech punctuation
  const spre=/"([^"\n]*[A-Za-z0-9])"\s+(said|asked|shouted|whispered|replied|cried|called|yelled|answered|exclaimed|muttered|laughed)/gi;
  while ((m=spre.exec(t))) add(m.index, m.index+m[0].length, 'punct', 'Put a comma (or ? or !) before the closing speech mark: "…," said…');
  if (/!!+|\?\?+/.test(t)){ const i=t.search(/!!+|\?\?+/); add(i, i+2, 'style', 'One exclamation or question mark is enough.'); }
  // 7. Long sentences (run-ons)
  sents.forEach(x=>{ const n=wordsOf(x.s).length, ands=(x.s.match(/\band\b/gi)||[]).length;
    if (!opts.poem && (n>32 || ands>=3)) add(x.start, x.end, 'long', ands>=3?`This sentence uses "and" ${ands} times. Try splitting it into two or three sentences.`:`This sentence is ${n} words long. Could you split it?`); });
  // 8. Tired and repeated words
  const counts={}; words.forEach(w=>{ const lw=w.toLowerCase(); counts[lw]=(counts[lw]||0)+1; });
  Object.entries(TIRED_LIMIT).forEach(([w,lim])=>{ if ((counts[w]||0)>=lim){ const re=new RegExp('\\b'+w+'\\b','gi'); let k; while ((k=re.exec(t))) add(k.index, k.index+w.length, 'word', `"${w}" is a tired word (${counts[w]} times). Try: ${TIRED[w]}.`); } });
  const reps=Object.entries(counts).filter(([w,c])=>w.length>=4 && !STOP.has(w) && !TIRED_LIMIT[w] && !(opts.keep||[]).includes(w) && c>=(wc>150?4:3)).sort((a,b)=>b[1]-a[1]).slice(0,3);
  reps.forEach(([w,c])=>{ const re=new RegExp("\\b"+w.replace(/'/g,"'")+"\\b",'gi'); let k, first=true; while ((k=re.exec(t))){ if (!first) add(k.index, k.index+w.length, 'repeat', `You used "${w}" ${c} times. Could you use a pronoun or a synonym sometimes?`); first=false; } });
  // 9. Sentence openers
  const openers={}; sents.forEach(x=>{ const f=(wordsOf(x.s)[0]||'').toLowerCase(); if (f) (openers[f]=openers[f]||[]).push(x); });
  Object.entries(openers).forEach(([w,list])=>{ if (list.length>=3 && list.length/sents.length>=.3 && !opts.poem) list.slice(1).forEach(x=>add(x.start, x.start+w.length, 'opener', `${list.length} sentences start with "${w[0].toUpperCase()+w.slice(1)}". Vary your openers: try a time word, an -ing word or an adverb.`)); });
  // 10. Paragraphs
  const needParas = !opts.poem && !opts.short && wc>=110 && paras.length<2;
  // Strengths
  const lens=sents.map(x=>wordsOf(x.s).length), avg=lens.length?lens.reduce((a,b)=>a+b,0)/lens.length:0;
  const sd=lens.length>2?Math.sqrt(lens.reduce((a,b)=>a+(b-avg)**2,0)/lens.length):0;
  const distinctOpen=sents.length?Object.keys(openers).length/sents.length:0;
  const conns=CONNECTIVES.filter(c=>new RegExp('\\b'+c+'\\b','i').test(t));
  const wow=uniq(words.map(w=>w.toLowerCase()).filter(w=>WOW.includes(w) || (w.length>=9 && !STOP.has(w))));
  const fig=/\blike an? \w+|\bas \w+ as\b/i.test(t);
  const speechOK=/"[^"]*[,!?]"\s+(said|asked|shouted|whispered|replied|cried|called|yelled|answered|exclaimed|muttered|laughed)/i.test(t);
  const unique=wc?new Set(words.map(w=>w.toLowerCase())).size/wc:0;
  const stars=[];
  if (wow.length>=3) stars.push(`Ambitious vocabulary: ${wow.slice(0,4).map(w=>`<b>${escH(w)}</b>`).join(', ')}.`);
  if (sd>=4.5 && sents.length>=4) stars.push('A good mix of short and long sentences. That keeps the reader interested.');
  if (distinctOpen>=.7 && sents.length>=4) stars.push('You start your sentences in lots of different ways.');
  if (conns.length>=3) stars.push(`Great joining words: ${conns.slice(0,4).map(c=>`<b>${c}</b>`).join(', ')}.`);
  if (fig) stars.push('You used a simile to paint a picture in the reader\'s mind.');
  if (speechOK) stars.push('Your speech punctuation is correct.');
  if (paras.length>=3 && !opts.poem) stars.push(`Clear paragraphs (${paras.length}) to organise your ideas.`);
  if (!stars.length && wc>=20) stars.push('You got your ideas down on paper. That is the hardest part!');
  // pick the main next step
  const byType=t=>issues.filter(i=>i.type===t).length;
  const order=[['caps','Use capital letters at the start of every sentence and for names.'],['punct','Check your punctuation, especially full stops, apostrophes and speech marks.'],['spell','Fix the spelling mistakes marked in red.'],
    ['long','Split your very long sentences into shorter ones.'],['para','Break your writing into paragraphs: start a new one for each new idea, time or place.'],['word','Swap your tired words for more powerful ones.'],
    ['repeat','Avoid repeating the same word; use pronouns and synonyms.'],['opener','Start your sentences in different ways.']];
  let wish=null; for (const [ty,msg] of order){ if (ty==='para'?needParas:byType(ty)>0){ wish=msg; break; } }
  if (!wish) wish = conns.length<2 ? 'Join ideas with connectives like <b>although</b>, <b>however</b> or <b>as soon as</b>.' : wow.length<3 ? 'Add some ambitious vocabulary to make your writing shine.' : !fig && !opts.poem ? 'Try adding a simile or metaphor to create a picture.' : 'Read it aloud once more. Can you make the ending even stronger?';
  const fixCount = issues.filter(i=>['spell','caps','punct','grammar','edit'].includes(i.type)).length;
  return {issues, stars:stars.slice(0,2), wish, wc, sents:sents.length, paras:paras.length, avg:Math.round(avg*10)/10, needParas, fixCount, styleCount:issues.length-fixCount, conns, wow};
}

const HL_LABEL = {spell:'Spelling', caps:'Capital letters', punct:'Punctuation', grammar:'Grammar', edit:'Editing', long:'Long sentence', word:'Tired word', repeat:'Repeated word', opener:'Sentence openers', style:'Style'};
function highlightHTML(text, issues){
  const ranges=issues.slice().sort((a,b)=>a.start-b.start||b.end-a.end), out=[]; let pos=0;
  ranges.forEach((r,i)=>{ if (r.start<pos) return; out.push(escH(text.slice(pos,r.start))); out.push(`<mark class="hl hl-${r.type}" data-hi="${issues.indexOf(r)}">${escH(text.slice(r.start,r.end))}</mark>`); pos=r.end; });
  out.push(escH(text.slice(pos))); return out.join('').replace(/\n/g,'<br>');
}
function coachHTML(text, a){
  const groups={}; a.issues.forEach(i=>{ (groups[i.type]=groups[i.type]||[]).push(i); });
  const glist=Object.entries(groups).map(([ty,l])=>`<span class="hlkey hl-${ty}">${HL_LABEL[ty]} · ${l.length}</span>`).join('');
  return `<div class="coach">
    <div class="cstars">${a.stars.map(s=>`<div>⭐ ${s}</div>`).join('')}</div>
    <div class="cwish">🎯 <b>Next step:</b> ${a.wish}</div>
    <div class="cstats small muted">${a.wc} words · ${a.sents} sentences · ${a.paras} paragraph${a.paras===1?'':'s'} · average ${a.avg} words per sentence</div>
    ${a.issues.length?`<div class="mt8"><b>🔧 Things to look at (${a.issues.length})</b> <small class="muted">Tap a highlight to see why.</small><div class="hlkeys">${glist}</div></div>
      <div class="hltext" id="hltext">${highlightHTML(text,a.issues)}</div><div class="hltip" id="hltip"></div>`
     : '<div class="fb good mt8"><p>✨ No fix-its found. Now read it aloud: does every sentence make sense?</p></div>'}
    ${a.needParas?'<p class="small b mt8">📄 Your writing is one long block. Leave an empty line between paragraphs.</p>':''}
    <p class="small muted mt8">The coach checks common mistakes, not everything. Always reread your work.</p></div>`;
}
function wireCoach(a){ $$('#hltext mark').forEach(mk=>mk.onclick=()=>{ const i=a.issues[+mk.dataset.hi]; $$('#hltext mark.sel').forEach(x=>x.classList.remove('sel')); mk.classList.add('sel');
  $('#hltip').innerHTML=`<b>${HL_LABEL[i.type]}:</b> ${escH(i.msg)}`; $('#hltip').classList.add('show'); }); }
const coachSummary = a => ({fix:a.fixCount, style:a.styleCount, stars:a.stars.map(stripTags), wish:stripTags(a.wish), wc:a.wc});

/* ================= WEEKLY PLAN, YEAR PLAN, SPELLING TESTS, WRITING TASKS ================= */
const curWeek = () => Math.min(YEAR.length, Math.max(1, DB.week||1));
const weekOpen = w => DB.openAll || w <= curWeek();
function weekStatus(p, w){
  const y=YEAR[w-1], r=p.yr['w'+w]||{}, items=[];
  items.push(['spell', !!r.spell]); items.push(['read', (r.read||0)>=3]);
  y.skills.forEach(s=>items.push([s, (p.best[s]||0)>=1]));
  if (y.write) items.push(['write', !!r.write]);
  items.push(['quiz', r.quiz!=null]);
  const tt=testForWeek(w); if (tt) items.push(['test', !!p.tests[tt.id]]);
  return {items, done:items.filter(i=>i[1]).length, total:items.length};
}
function weekCardHTML(p){

/* ================= BIG TESTS: mid-term (week 8) and end-of-term (week 15) ================= */
const CAPS_LEVELS = [[80,7,'Outstanding'],[70,6,'Meritorious'],[60,5,'Substantial'],[50,4,'Adequate'],[40,3,'Moderate'],[30,2,'Elementary'],[0,1,'Not achieved']];
const capsLevel = pc => CAPS_LEVELS.find(([m])=>pc>=m);
const testOpen = t => weekOpen(t.week);
const testLv = t => t.term===1 ? 2 : 3;            // Term 1 Silver, Terms 2 and 3 Gold (with challenge questions)
const TBY = id => TESTS.find(t=>t.id===id);
const testShort = t => `T${t.term} ${t.kind==='Mid-term'?'Mid':'End'}`;
const pctOf = r => Math.round(r.score/r.total*100);
const SECS = {
  A:{ic:'🔤', name:'Section A: Spelling', what:'10 words (4 stretch)', tip:'Plume says each word. Listen, then type it carefully. The sentence helps you know which word it is.'},
  B:{ic:'🧩', name:'Section B: Language', what:'12 questions', tip:'Grammar, punctuation and vocabulary from the weeks you have covered. Read each question carefully.'},
  C:{ic:'📖', name:'Section C: Reading', what:'1 text, 8 questions', tip:'Read the whole text first. It stays at the top of every question, so you can look back at it.'}
};
const TEST_TYPES = ['mc','tap','type','sort','order'];

function buildTest(t){
  const lv=testLv(t), weeks=YEAR.filter(y=>y.w>=t.from && y.w<=t.to);
  const A = [...sample(weeks.flatMap(y=>SPELL_WEEKS[y.w-1].words), 6), ...sample(weeks.flatMap(y=>SPELL_WEEKS[y.w-1].stretch), 4)].map(([wd,s])=>Object.assign(
    typeQ('Listen, then spell the word', wd, `<b>${escH(wd)}</b>: ${escH(s)}`, {speak:wd, clue:blankWord(s,wd)}), {skill:'sp-bee', lv, sec:'A'}));
  const skills = shuffle(uniq(weeks.flatMap(y=>y.skills)).filter(s=>!/^r-/.test(s)));
  const B=[], seen=new Set(); let i=0, g=0;
  while (B.length<12 && g++<800){
    const s=skills[i++ % skills.length]; let q;
    try { q=makeQ(s, lv); } catch(e){ continue; }
    if (!TEST_TYPES.includes(q.type) || q.passage || q.speak) continue;
    const k=qKey(q); if (seen.has(k)) continue; seen.add(k); q.sec='B'; B.push(q);
  }
  const ps=TP(t.passage);
  const C = ps.qs.map(([q,a,o,e])=>Object.assign(mc(q,a,o,e,{passage:ps}), {skill:'r-comp', lv:ps.lv, sec:'C'}));
  return [...A, ...B, ...C];
}

     ${open?`<button class="btn gold w100 mt8" id="go">${r?'Practise it again ↻':'Start the test ▶'}</button>`:`<p class="muted b mt8">🔒 This test opens in Term ${t.term}, Week ${wk}.</p>`}
     ${r&&r.last?`<button class="btn ghost w100 mt8" id="rv">🔍 See corrections from my last try</button>`:''}

  $('#quit').onclick=testQuit;

}

function renderTestQ(){
  const q=R.qs[R.i], sec=q.sec, inSec=R.qs.filter(x=>x.sec===sec), si=inSec.indexOf(q);
  if (!R.shown[sec]) return testSectionIntro(sec);
  R.answered=false;
  app.innerHTML = `<div class="qtop"><button class="x" id="quit" aria-label="Leave the test">✕</button>
    <div class="prog"><i style="width:${R.i/R.qs.length*100}%"></i></div><div class="pts">${SECS[sec].ic} ${si+1}/${inSec.length}</div></div>
    <div class="card qcard testmode"><div class="secbar">${SECS[sec].name} · Question ${R.i+1} of ${R.qs.length}</div>${qBody(q)}</div>`;
  $('#quit').onclick=testQuit;
  const last = R.i+1>=R.qs.length, nextLbl = last?'Finish the test 🏁':'Save and go on →';
  const commit = ok => { if (R.answered) return; R.answered=true; q.ok=ok; if (ok) R.correct++; record(q,ok); sfx.tap(); R.i++; R.i<R.qs.length?renderTestQ():endTest(); };
  wireQ(q, commit);
  // Multiple choice and tap: choose, change your mind, then save.
  if (q.type==='mc' || q.type==='tap'){
    const sel = q.type==='mc'?'.opt':'.tok';
    $('#fb').innerHTML=`<button class="btn w100 mt8" id="tsv" disabled>${nextLbl}</button>`;
    $$(sel).forEach(b=>b.onclick=()=>{ if (R.answered) return; sfx.tap();
      $$(sel).forEach(x=>x.classList.remove('picked')); b.classList.add('picked');
      q.given = q.type==='mc' ? q.options[+b.dataset.i] : q.tokens[+b.dataset.k].w;
      q.pickOk = q.type==='mc' ? q.given===q.answer : !!q.tokens[+b.dataset.k].ok;
      $('#tsv').disabled=false; });
    $('#tsv').onclick=()=>{ if (q.given==null) return; commit(q.pickOk); };
  } else if ($('#chk')) $('#chk').textContent = last?'Save and finish 🏁':'Save answer →';
}

const qPlain = q => {
  if (q.sec==='A') return `Spell the word: ${q.clue}`;
  let t=stripTags(q.prompt);
  if (q.clue) t+=' '+q.clue;
  if (q.type==='tap') t+=' '+q.tokens.map(x=>x.pre+x.w+x.p).join(' ');
  return t;
};
const qAnswerText = q => q.type==='sort' ? q.buckets.map((b,i)=>`${b}: ${q.items.filter(it=>it.b===i).map(it=>it.w).join(', ')}`).join(' | ')
  : q.type==='order' ? q.items.join(q.long?' → ':' ') : String(q.answer);
const qGivenText = q => (q.type==='sort'||q.type==='order') ? 'Some were in the wrong place' : (q.given||'(no answer)');

function endTest(){
  stopSpeech();
  const p=P(), t=R.test, qs=R.qs, by=s=>qs.filter(q=>q.sec===s), sc=s=>by(s).filter(q=>q.ok).length;
  const score=qs.filter(q=>q.ok).length, total=qs.length, pc=Math.round(score/total*100), cl=capsLevel(pc), oldLv=level(p.xp);
  const sk={}; qs.forEach(q=>{ const k=q.sec==='A'?'spelling':q.sec==='C'?'reading':q.skill; const a=sk[k]||(sk[k]=[0,0]); a[1]++; if (q.ok) a[0]++; });
  const res={score, total, A:sc('A'), B:sc('B'), C:sc('C'), nA:by('A').length, nB:by('B').length, nC:by('C').length, date:today(), sk, reader:!!p.reader};
  const prev=p.tests[t.id], official=!prev;
  if (official) p.tests[t.id]={first:res, best:res, tries:1};
  else { prev.tries++; if (score>prev.best.score) prev.best=res; }
  const rec=p.tests[t.id];
  rec.last = qs.filter(q=>!q.ok).map(q=>({s:q.sec, q:qPlain(q).slice(0,220), g:qGivenText(q).slice(0,80), a:qAnswerText(q).slice(0,220), e:String(q.explain||'').slice(0,260), t:q.type}));
  qs.filter(q=>!q.ok).forEach(addMistake);
  const xp=score*10, coins=score*3+(pc>=80?20:0);
  p.xp+=xp; p.coins+=coins; p.rounds++; markDay();
  const fresh=checkBadges(); save();
  const bar=(n,of)=>`<div class="secscore"><div class="wkbar"><i style="width:${of?n/of*100:0}%"></i></div></div>`;
  app.innerHTML = `<div class="card center">${heronSVG(p.look,'h110 bounce')}<h2>Test complete!</h2><div class="muted b">${t.title}</div>
    <div class="bigscore">${score}<small>/${total}</small></div>
    <div class="f20 b">${pc}% · Level ${cl[1]}: ${cl[2]}</div>
    <p class="small muted">${official?'📌 This is your official mark. Well done for finishing!':`Practice try. Your official mark stays ${rec.first.score}/${rec.first.total}. Best try: ${rec.best.score}/${rec.best.total}.`}</p>
    <div class="secs mt8">${['A','B','C'].map(s=>`<div class="sec"><span>${SECS[s].ic}</span><b>${res[s]}/${res['n'+s]}</b><small>${SECS[s].name.split(': ')[1]}</small>${bar(res[s],res['n'+s])}</div>`).join('')}</div>
    <div class="reward"><div>⭐ +${xp} XP</div><div>🪙 +${coins} coins</div></div>
    ${level(p.xp)>oldLv?`<div class="fb good"><h3>🎉 Level up! You're now level ${level(p.xp)}</h3></div>`:''}
    ${badgeHTML(fresh)}
    ${rec.last.length?`<p class="muted mt8">You have <b>${rec.last.length}</b> correction${rec.last.length===1?'':'s'} to look at. They are also saved in 🩹 Fix my mistakes.</p>`:'<div class="fb good"><h3>💯 Full marks!</h3></div>'}
    <div class="row mt">${rec.last.length?'<button class="btn gold grow" id="rv">🔍 Corrections</button>':''}<button class="btn ghost grow" id="bw">← Back</button></div></div>`;
  if (pc>=75||fresh.length){ confetti(); sfx.win(); }
  const back=R.back, id=t.id;
  $('#bw').onclick=()=>back();
  if ($('#rv')) $('#rv').onclick=()=>screenTestReview(id, back);
}

function startStarter(src,n,timer,lv){
  stopTimers(); lv=lv||0;
  const pool = src==='mixed' ? ALLSKILLS : WD(src).skills, qs=[], seen=new Set(); let g=0;
  while (qs.length<n && g++<400){ const k=rnd(pool), q=makeQ(k.id, lv||1+Math.floor(Math.random()*3)), key=qKey(q); if (seen.has(key)) continue; seen.add(key); qs.push(q); }
  S={qs, i:0, revealed:false, timer, src, n, lv};
  R={mode:'starter', lastPassage:null};
  window.onkeydown=e=>{ if (!S||S.done) return;
    if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); S.revealed?starterGo(1):starterReveal(); }
    if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); starterGo(-1); } };
  renderStarter();
}
function renderStarter(){
  clearInterval(starterTimer); document.body.classList.add('wide');

  if (q.passage) body+=`<div class="ppassage"><b>${escH(q.passage.title)}</b>${q.passage.text.map(x=>`<p>${escH(x).replace(/\n/g,'<br>')}</p>`).join('')}</div>`;

  if (q.type==='mc') body+=`<div class="ptiles">${q.options.map((o,i)=>`<div class="ptile" data-i="${i}"><span class="letter">${letters[i]}</span>${escH(o)}</div>`).join('')}</div>`;
  if (q.type==='tap') body+=`<div class="psentence">${q.tokens.map(t=>`${escH(t.pre)}<span class="pw ${t.ok?'tgt':''}">${escH(t.w)}</span>${escH(t.p)}`).join(' ')}</div>`;

    <div class="projtop"><button class="x" id="quit" aria-label="Exit">✕</button><b>Question ${S.i+1} of ${S.qs.length}</b><span class="tag" style="background:${w.color}">${w.icon} ${k.name}</span>
      <span class="grow"></span>${S.timer?`<span class="ptimer" id="pt">${S.timer}</span>`:''}${document.fullscreenEnabled?'<button class="btn small ghost" id="fs" aria-label="Full screen">⛶</button>':''}</div>
    ${body}
    <div class="preveal" id="rv"></div>
    <div class="row mt"><button class="btn ghost" id="prev" ${S.i?'':'disabled'}>◀</button><button class="btn gold grow" id="rev">👀 Reveal answer</button><button class="btn grow" id="next">${S.i+1<S.qs.length?'Next ▶':'Finish 🎉'}</button></div>
    <p class="muted small center">Clicker or arrow keys: first press reveals, second press moves on.${document.fullscreenEnabled?'':' For full screen, press F11 (Windows) or Ctrl+Cmd+F (Mac).'}</p></div>`;
  $('#quit').onclick=()=>{ S=null; screenTeacher(); };
  if ($('#fs')) $('#fs').onclick=()=>{ const fail=()=>toast('Full screen is blocked here. Press F11 (Windows) or Ctrl+Cmd+F (Mac) instead.');
    try { const pr=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); if (pr&&pr.catch) pr.catch(fail); } catch(e){ fail(); } };
  const pj=$('.proj'); if (pj){ pj.tabIndex=-1; try { pj.focus({preventScroll:true}); } catch(e){} }
  $('#rev').onclick=()=>starterReveal(); $('#next').onclick=()=>starterGo(1); $('#prev').onclick=()=>starterGo(-1);
  if ($('#psay')) $('#psay').onclick=()=>speak(q.speak);
  if (S.timer) starterTimer=setInterval(()=>{ if (!S||S.revealed) return; S.left--; const el=$('#pt'); if (!el) return; el.textContent=Math.max(0,S.left);

/* ---------- Writing pieces need a stable id so the teacher's marks find the right piece ---------- */
const hashStr = s => { let h=5381; for (let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); };
const pieceKey = w => w.id || (w.id = 'h'+hashStr((w.d||'')+'|'+(w.kind||'')+'|'+String(w.text||'').slice(0,60)));

function applyTeacherFields(p, d){
  const marks=(d&&d.marks)||{}; let fresh=0;
  (p.writing||[]).forEach(w=>{ const m=marks[pieceKey(w)]; if (m){ if (!w.tm || JSON.stringify(w.tm)!==JSON.stringify(m)) fresh++; w.tm=m; } });
  if (d && d.teacher){ p.reader=!!d.teacher.reader; if (p.reader) p.prefs.autoRead=true; }
  return fresh;
}

}

function schedulePush(){ clearTimeout(CL.pushT); const wait=Math.max(1500, PUSH_GAP-(Date.now()-CL.lastPush)); CL.pushT=setTimeout(()=>cloudPush(), wait); }
async function cloudPush(force){
  if (!isCloudLearner()) return; const p=DB.profiles[DB.cloud.name]; if (!p) return;
  try { await cloudInit(); if (!CL.user || CL.user.uid!==DB.cloud.uid) return setSync('off');
    const clean=Object.assign({}, p); delete clean._uid; delete clean._code;
    const json=JSON.stringify(clean); if (!force && json===CL.lastJson) return;
    CL.lastPush=Date.now(); setSync('busy');
    await CL.db.doc(`classes/${DB.cloud.code}/learners/${DB.cloud.uid}`).set({name:p.name, profile:json, summary:summaryOf(p), updated:FV().serverTimestamp()}, {merge:true});
    CL.lastJson=json; DB.cloud.synced=Date.now(); setSync('ok');
  } catch(e){ setSync('off'); }
}
function setSync(s){ CL.state=s; const el=$('#syncdot'); if (el){ el.className='syncdot '+s; el.title={ok:'Saved online',busy:'Saving…',off:'Offline: saved on this device'}[s]||''; } }
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden' && isCloudLearner()) cloudPush(); });

async function learnerSignIn(code, entry, pin){
  await cloudInit(); if (cloudOn()) await cloudLogout(true);
  busy('Logging in…');
  if (CL.user) await CL.auth.signOut();
  const cred=await CL.auth.signInWithEmailAndPassword(learnerEmail(code, entry.login), learnerPass(code, pin));
  const uid=cred.user.uid; CL.user=cred.user;
  const [ld, cd]=await Promise.all([CL.db.doc(`classes/${code}/learners/${uid}`).get({source:'server'}), CL.db.doc(`classes/${code}`).get({source:'server'})]);
  const d=ld.exists?ld.data():{}, name=entry.name; let p=null;
  try { p=d.profile?migrate(JSON.parse(d.profile)):null; } catch(e){ p=null; }
  const local=DB.profiles[name];
  // First login on a device that already has this learner's offline progress: keep the progress.
  if ((!p || (!p.xp && !p.rounds)) && local && !local._uid && (local.xp || local.rounds)) p=migrate(local);
  if (!p) p=newProfile(name, entry.col||'grey');
  p.name=name; p._uid=uid; p._code=code; applyTeacherFields(p, d);
  DB.profiles[name]=p; DB.current=name; DB.cloud={role:'learner', uid, code, name};
  if (cd.exists) applyClassSettings(cd.data());
  CL.lastJson=''; save(); await cloudPush(true); learnerListen(); busy(); document.onkeydown=null; applyPrefs();
  toast(`👋 Welcome, ${name}! Your progress is saved online.`);
  if (!p.rounds && !p.xp) screenStory(true); else screenHome();
}
function learnerListen(){
  CL.unsubs.forEach(u=>{ try{u();}catch(e){} }); CL.unsubs=[]; if (!isCloudLearner()) return;
  const {code, uid, name}=DB.cloud;
  CL.unsubs.push(CL.db.doc(`classes/${code}/learners/${uid}`).onSnapshot(s=>{ const p=DB.profiles[name]; if (!p || !s.exists) return;
    const n=applyTeacherFields(p, s.data()); if (n){ save(); toast(`📝 ${teacherName()} has marked your writing! Look in your Writing Book.`); } }, ()=>{}));
  CL.unsubs.push(CL.db.doc(`classes/${code}`).onSnapshot(s=>{ if (s.exists){ applyClassSettings(s.data()); save(); } }, ()=>{}));
}
async function cloudResume(){
  if (!cloudOn()) return;
  try { await cloudInit();
    if (!CL.user || CL.user.uid!==DB.cloud.uid){ setSync('off'); if (!CL.user && navigator.onLine){ toast('Please log in again.'); const was=DB.cloud.role; await cloudLogout(true); if (was==='teacher') screenCloudTeacher(); } return; }
    if (isCloudLearner()){ learnerListen(); cloudPush(); }
  } catch(e){ setSync('off'); }
}
async function cloudLogout(quiet){
  if (!quiet) busy('Saving and logging out…');
  try { if (isCloudLearner()) await Promise.race([cloudPush(true), sleep(6000)]); if (isCloudTeacher()) await Promise.race([teacherPush(), sleep(6000)]); } catch(e){}
  CL.unsubs.forEach(u=>{ try{u();}catch(e){} }); CL.unsubs=[];
  try { await cloudInit(); await CL.auth.signOut(); } catch(e){}
  if (DB.cloud){ Object.keys(DB.profiles).forEach(k=>{ if (DB.profiles[k]._uid) delete DB.profiles[k]; });
    if (DB.cloud.role==='teacher' && DB.localBackup){ Object.assign(DB.profiles, DB.localBackup); delete DB.localBackup; } }
  DB.cloud=null; DB.current=null; CL.lastJson=''; CL.pushed=null; save(); busy();
  if (!quiet){ toast('Logged out. See you next time!'); screenProfiles(); }
}

async function teacherCreateClass(name){
  const uid=CL.user.uid; let code, tries=0;
  while (tries++<5){ code=randCode(6);
    try { await CL.db.doc(`classes/${code}`).set({name, teacherUid:uid, teacherName:CL.user.displayName||teacherName(), created:FV().serverTimestamp(),
      learners:{}, learnerUids:[], settings:{week:DB.week||1, startLv:DB.startLv||2, kbd:DB.kbd||'auto', openAll:!!DB.openAll}}); break; }
    catch(e){ if (tries>=5) throw e; } }
  await CL.db.doc(`rosters/${code}`).set({className:name, names:[]});
  await CL.db.doc(`teachers/${uid}`).set({classes:FV().arrayUnion({code, name})}, {merge:true});
  return code;
}
async function teacherOpenClass(code, isNew){
  busy('Loading your class…');
  try { await cloudInit(); const cd=await CL.db.doc(`classes/${code}`).get({source:'server'}); const c=cd.data();
    if (DB.cloud && DB.cloud.role==='learner') await cloudLogout(true);
    DB.cloud={role:'teacher', uid:CL.user.uid, code, name:c.name, email:CL.user.email};
    const locals=Object.keys(DB.profiles).filter(n=>!DB.profiles[n]._uid);
    if (locals.length){ DB.localBackup=Object.assign(DB.localBackup||{}, Object.fromEntries(locals.map(n=>[n, DB.profiles[n]]))); locals.forEach(n=>delete DB.profiles[n]); }
    DB.current=null; applyClassSettings(c); await teacherPull(); busy(); screenCloudClass(isNew);
  } catch(e){ busy(); toast(cloudErr(e)); }

const teacherSigOf = p => { const marks={}; (p.writing||[]).forEach(w=>{ if (w.tm) marks[pieceKey(w)]=w.tm; }); return {marks, teacher:{reader:!!p.reader}}; };
const settingsSig = () => JSON.stringify({week:DB.week||1, startLv:DB.startLv||2, kbd:DB.kbd||'auto', openAll:!!DB.openAll, t:teacherName()});
async function teacherPull(){
  const code=DB.cloud.code;
  await teacherPush();
  const [cd, qs]=await Promise.all([CL.db.doc(`classes/${code}`).get({source:'server'}), CL.db.collection(`classes/${code}/learners`).get({source:'server'})]);
  const c=cd.data(); CL.cls=c; const out={}, pushed={_s:settingsSig()};
  qs.forEach(doc=>{ const d=doc.data(), info=(c.learners||{})[doc.id]; if (!info) return;
    let p; try { p=migrate(JSON.parse(d.profile||'null')||newProfile(info.name, info.col||'grey')); } catch(e){ p=newProfile(info.name, info.col||'grey'); }
    p.name=info.name; p._uid=doc.id; applyTeacherFields(p, d); out[info.name]=p; pushed[doc.id]=JSON.stringify(teacherSigOf(p)); });
  Object.entries(c.learners||{}).forEach(([uid,info])=>{ if (!out[info.name]){ const p=newProfile(info.name, info.col||'grey'); p._uid=uid; out[info.name]=p; pushed[uid]=JSON.stringify(teacherSigOf(p)); } });
  Object.keys(DB.profiles).forEach(n=>{ if (DB.profiles[n]._uid) delete DB.profiles[n]; });
  Object.assign(DB.profiles, out); DB.classList=Object.values(c.learners||{}).map(x=>x.name).sort();
  CL.pushed=pushed; DB.cloud.synced=Date.now(); save();
}
function scheduleTeacherPush(){ clearTimeout(CL.tpT); CL.tpT=setTimeout(()=>teacherPush().catch(()=>setSync('off')), 1200); }
async function teacherPush(){
  if (!isCloudTeacher() || !CL.pushed) return; await cloudInit();
  const code=DB.cloud.code, batch=CL.db.batch(); let n=0;
  Object.values(DB.profiles).filter(p=>p._uid).forEach(p=>{ const sig=teacherSigOf(p), js=JSON.stringify(sig);
    if (CL.pushed[p._uid]!==js){ batch.set(CL.db.doc(`classes/${code}/learners/${p._uid}`), sig, {merge:true}); CL.pushed[p._uid]=js; n++; } });
  const ss=settingsSig(); if (CL.pushed._s!==ss){ batch.update(CL.db.doc(`classes/${code}`), {settings:{week:DB.week||1, startLv:DB.startLv||2, kbd:DB.kbd||'auto', openAll:!!DB.openAll}, teacherName:teacherName()}); CL.pushed._s=ss; n++; }
  if (n){ setSync('busy'); await batch.commit(); setSync('ok'); }
}

function secondaryAuth(){ const sec=firebase.apps.find(a=>a.name==='hwq-sec')||firebase.initializeApp(FB_CONFIG,'hwq-sec'); return sec.auth(); }
async function makeLearnerAccount(code, name){
  const sa=secondaryAuth(); try { await sa.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch(e){}
  const login=slugName(name)+randCode(3).toLowerCase(), pin=randPin();
  const cr=await sa.createUserWithEmailAndPassword(learnerEmail(code, login), learnerPass(code, pin)); const uid=cr.user.uid; await sa.signOut();
  return {uid, login, pin};
}
async function teacherAddLearners(names, onEach){
  const code=DB.cloud.code, cdoc=CL.db.doc(`classes/${code}`), rdoc=CL.db.doc(`rosters/${code}`), tdoc=CL.db.doc(`teachers/${CL.user.uid}`);
  const cls=(await cdoc.get({source:'server'})).data(), have=new Set(Object.values(cls.learners||{}).map(x=>x.name.toLowerCase())), made=[];
  for (const raw of names){ const name=String(raw).trim().replace(/\s+/g,' ').slice(0,24); if (!name || have.has(name.toLowerCase())) continue;
    if (onEach) onEach(name, made.length);
    const {uid, login, pin}=await makeLearnerAccount(code, name);
    const local=DB.localBackup&&DB.localBackup[name]; const prof=local?migrate(JSON.parse(JSON.stringify(local))):newProfile(name, ['grey','blue','pink'][(have.size+made.length)%3]);
    prof.name=name; const col=(prof.look&&prof.look.col)||'grey', info={name, login, col};
    await cdoc.update({[`learners.${uid}`]:info, learnerUids:FV().arrayUnion(uid)});
    await CL.db.doc(`classes/${code}/learners/${uid}`).set({name, profile:JSON.stringify(prof), marks:{}, teacher:{reader:!!prof.reader}, summary:summaryOf(prof), updated:FV().serverTimestamp()});
    await rdoc.set({names:FV().arrayUnion(info)}, {merge:true});
    await tdoc.set({pins:{[code]:{[uid]:pin}}}, {merge:true});
    if (local) delete DB.localBackup[name];
    have.add(name.toLowerCase()); made.push({name, pin, uid}); }
  return made;
}
async function teacherNewPin(oldUid){
  const code=DB.cloud.code, cdoc=CL.db.doc(`classes/${code}`), rdoc=CL.db.doc(`rosters/${code}`), tdoc=CL.db.doc(`teachers/${CL.user.uid}`);
  const cls=(await cdoc.get({source:'server'})).data(), info=cls.learners[oldUid]; if (!info) throw new Error('Learner not found');
  const old=await CL.db.doc(`classes/${code}/learners/${oldUid}`).get({source:'server'});
  const {uid, login, pin}=await makeLearnerAccount(code, info.name), ninfo={name:info.name, login, col:info.col};
  await cdoc.update({[`learners.${uid}`]:ninfo, learnerUids:FV().arrayUnion(uid)});
  await CL.db.doc(`classes/${code}/learners/${uid}`).set(old.exists?old.data():{name:info.name, marks:{}, teacher:{reader:false}});
  await cdoc.update({[`learners.${oldUid}`]:FV().delete(), learnerUids:FV().arrayRemove(oldUid)});
  await rdoc.update({names:FV().arrayRemove(info)}); await rdoc.update({names:FV().arrayUnion(ninfo)});
  await tdoc.set({pins:{[code]:{[uid]:pin, [oldUid]:FV().delete()}}}, {merge:true});
  await CL.db.doc(`classes/${code}/learners/${oldUid}`).delete();
  return pin;
}
async function teacherRemoveLearner(uid){
  const code=DB.cloud.code, cdoc=CL.db.doc(`classes/${code}`), cls=(await cdoc.get({source:'server'})).data(), info=cls.learners[uid];
  await cdoc.update({[`learners.${uid}`]:FV().delete(), learnerUids:FV().arrayRemove(uid)});
  if (info) await CL.db.doc(`rosters/${code}`).update({names:FV().arrayRemove(info)});
  await CL.db.doc(`teachers/${CL.user.uid}`).set({pins:{[code]:{[uid]:FV().delete()}}}, {merge:true});
  await CL.db.doc(`classes/${code}/learners/${uid}`).delete();
}

   <div class="row mt"><button class="btn ghost grow" id="tc">🍎 Teacher corner</button><button class="btn ghost grow" id="cls">☁️ My classes</button></div>`;
  $('#bk').onclick=()=>screenTeacher(); $('#tc').onclick=()=>screenTeacher(); $('#cls').onclick=()=>screenCloudTeacher();
  $('#sync').onclick=async()=>{ busy('Syncing…'); try { await teacherPull(); busy(); toast('✅ Up to date'); screenCloudClass(); } catch(e){ busy(); toast(cloudErr(e)); } };
  if ($('#showpins')) $('#showpins').onclick=()=>$$('.pinshow').forEach(s=>s.textContent=s.dataset.pin);
  $$('.pinshow').forEach(s=>s.onclick=()=>{ s.textContent=s.textContent==='••••'?s.dataset.pin:'••••'; });
  if ($('#uselocal')) $('#uselocal').onclick=()=>{ $('#nl').value=(($('#nl').value.trim()?$('#nl').value.trim()+'\n':'')+locals.join('\n')); };
  $('#add').onclick=async()=>{ const names=$('#nl').value.split('\n').map(s=>s.trim()).filter(Boolean); if (!names.length) return toast('Type at least one name');
    $('#add').disabled=true;
    try { const made=await teacherAddLearners(names, (n,i)=>busy(`Adding ${n} (${i+1} of ${names.length})…`)); await teacherPull(); busy();
      toast(`✅ Added ${made.length} learner${made.length===1?'':'s'}`); screenCloudClass(); }
    catch(e){ busy(); toast(cloudErr(e)); $('#add').disabled=false; } };
  $$('[data-np]').forEach(b=>b.onclick=async()=>{ busy('Making a new PIN…'); try { const pin=await teacherNewPin(b.dataset.np); await teacherPull(); busy(); toast('New PIN: '+pin); screenCloudClass(); } catch(e){ busy(); toast(cloudErr(e)); } });
  $$('[data-rm]').forEach(b=>b.onclick=()=>{ const x=c.learners[b.dataset.rm]; confirmBox(`Remove ${x.name} from the class? Their progress will be deleted.`, 'Remove', async()=>{ busy('Removing…'); try { await teacherRemoveLearner(b.dataset.rm); await teacherPull(); busy(); screenCloudClass(); } catch(e){ busy(); toast(cloudErr(e)); } }); });
  $('#cards').onclick=()=>printCards(list, pins, code);
}
function confirmBox(msg, yes, fn){
  const d=document.createElement('div'); d.className='modal';
  d.innerHTML=`<div class="card center"><p class="b">${escH(msg)}</p><div class="row mt8"><button class="btn ghost grow" id="cb-no">Cancel</button><button class="btn navy grow" id="cb-yes">${escH(yes)}</button></div></div>`;
  document.body.appendChild(d); d.querySelector('#cb-no').onclick=()=>d.remove(); d.querySelector('#cb-yes').onclick=()=>{ d.remove(); fn(); };
}
function printCards(list, pins, code){
  const url=/^https?:/.test(location.href)?location.href.split('#')[0]:'';
  app.innerHTML = `<div class="noprint row"><button class="btn ghost" id="bk2">← Back</button><button class="btn grow" id="pr">🖨️ Print</button></div>
   <p class="noprint small muted">Cut out one card for each learner. Keep the PINs private.</p>
   <div class="cards">${list.map(([uid,x])=>`<div class="lcard"><div class="lc-top">🪶 Heron Word Quest</div>
     <div class="lc-name">${escH(x.name)}</div>
     <div class="lc-row"><span>Class code</span><b class="mono">${code}</b></div>
     <div class="lc-row"><span>My PIN</span><b class="mono">${pins[uid]||'????'}</b></div>
     <div class="lc-how">Tap <b>🔐 Class login</b> → type the code → tap your name → type your PIN.${url?`<br><span class="mono small">${escH(url)}</span>`:''}</div></div>`).join('')}</div>`;
  $('#bk2').onclick=()=>screenCloudClass(); $('#pr').onclick=()=>window.print();
}
function cloudBarHTML(){
  if (!isCloudTeacher()) return `<button class="tool wide" id="cloud"><span>☁️</span><b>Online class and logins</b><small>Learners log in on any device; you see everyone's progress</small></button>`;
  return `<div class="cloudbar"><span class="grow">☁️ <b>${escH(DB.cloud.name)}</b> · code <b class="mono">${DB.cloud.code}</b><br><small class="muted">${Object.values(DB.profiles).filter(p=>p._uid).length} learners · ${DB.cloud.synced?'synced '+new Date(DB.cloud.synced).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}):'not synced yet'}</small></span>
    <button class="btn small ghost" id="csync">🔄</button><button class="btn small" id="cman">Manage</button></div>`;
}
function wireCloudBar(){
  if ($('#cloud')) $('#cloud').onclick=()=>screenCloudTeacher();
  if ($('#cman')) $('#cman').onclick=()=>screenCloudClass();
  if ($('#csync')) $('#csync').onclick=async()=>{ busy('Syncing…'); try { await cloudInit(); await teacherPull(); busy(); toast('✅ Up to date'); screenTeacher(); } catch(e){ busy(); toast(cloudErr(e)); } };
  if (isCloudTeacher() && (!DB.cloud.synced || Date.now()-DB.cloud.synced>5*60000) && navigator.onLine){
    cloudInit().then(()=>teacherPull()).then(()=>{ if ($('.cloudbar')) screenTeacher(); }).catch(()=>{}); }
}

boot();
</script>
</body>
</html>
