Every Saturday morning, my grandmother's kitchen in Soweto smells of frying dough and cinnamon. Gogo makes the best amagwinya in the whole of Gauteng. Even the neighbours' children seem to know exactly when the first batch is ready, because there is always a polite knock at the back door at about half past nine.

For years, I was only allowed to watch. "A kitchen is not a playground," Gogo would say, waving her wooden spoon like a conductor's baton. But this year, on the morning of my eleventh birthday, she tied her old striped apron around my waist and announced, "Today, Naledi, you are my assistant."

I had never felt so important.

Gogo's recipe is not written down anywhere. It lives in her hands. She never measures the flour; she simply scoops it into the big enamel bowl until it "looks right". She tests the warmth of the water with her elbow, the way you would test a baby's bath. When I asked how much sugar to add, she laughed and said, "Enough to make your heart happy, but not so much that your dentist is happy too."

The hardest part was the kneading. Gogo pushed and folded the dough with quick, strong movements, and it became smooth and springy in minutes. When I tried, the dough stuck to my fingers, my wrists and somehow my eyebrows. My little cousin Kabelo, who had come in to steal a taste of the sugar, laughed so much that he had to sit down on the floor.

While the dough rose under a damp cloth, Gogo told me about her own grandmother, who had made amagwinya over an open fire in a village near Polokwane, and who had sold them at the station to earn money for school fees. "Every vetkoek you eat in this house," Gogo said quietly, "has a little bit of her in it."

When the oil was hot, Gogo showed me how to drop the balls of dough in gently, away from my body, so that the oil would not splash. They sizzled and puffed up, turning a deep golden brown. My first one was lopsided. My second one was burnt. But my third one was perfect: round, golden and light inside.

Gogo held it up to the window as if it were a medal. "There," she said. "Now the recipe lives in your hands too."

At half past nine, right on time, there was a knock at the back door.`,

PSG('sainventions','Made in South Africa','information',2,`
When people think of great inventions, they often picture laboratories in America or Europe. Yet some remarkable ideas, discoveries and medical firsts have come from South Africa. Here are a few that changed lives.

THE CT SCANNER
Allan Cormack grew up in Johannesburg and studied at the University of Cape Town. In the 1950s and 1960s, he worked out the mathematics that would make it possible to build a detailed picture of the inside of the body from many X-rays taken at different angles. His work, together with that of the British engineer Godfrey Hounsfield, led to the CT scanner, which doctors now use every day to find injuries and illnesses. In 1979, the two men shared the Nobel Prize in Physiology or Medicine.

THE FIRST HEART TRANSPLANT
On 3 December 1967, at Groote Schuur Hospital in Cape Town, a surgical team led by Professor Christiaan Barnard performed the world's first human heart transplant. The patient, Louis Washkansky, lived for 18 days. That may not sound long, but the operation proved that a heart transplant was possible. Today, thousands of people around the world receive new hearts every year.

THE DOLOS
If you have ever visited a South African harbour, you may have seen huge concrete shapes piled along the sea wall, each looking like a giant child's jack. These are dolosse. The design was developed in East London in the 1960s. When waves crash into them, the interlocking shapes break up the water's energy, protecting the harbour wall. Dolosse are now used on coastlines all over the world.

THE KREEPY KRAULY
In 1974, Ferdinand Chauvier invented the Kreepy Krauly, an automatic pool cleaner that wanders around the bottom of a swimming pool, sucking up leaves and dirt. It was so successful that versions of it are still sold in many countries.

PRATLEY PUTTY
In the 1960s, George Pratley, an engineer in Gauteng, developed a powerful glue that sets as hard as metal. Pratley Putty became famous for repairing everything from broken taps to car engines.

What do these inventors have in common? Each one noticed a problem, refused to accept that nothing could be done, and kept experimenting until they found a solution. Perhaps the next great South African invention is waiting for someone in your class to notice the right problem.`,

PSG('rockpools','Lost at the Rock Pools','narrative',2,`
The tide was out at Kalk Bay, and the rock pools glittered like a hundred small mirrors. Thabo and his cousin Ruby had promised to stay where Uncle Sipho could see them from his fishing spot on the rocks. For the first half-hour, they kept that promise perfectly.

Then Ruby found the octopus.

It was hiding in a crack between two rocks, its skin changing from brown to orange to mottled grey as they watched. "It's camouflaging," Ruby whispered excitedly. "It thinks we can't see it." When the octopus slid silently into a deeper pool further along the shore, they followed it, hopping carefully from rock to rock.

They followed it past a pool full of sea anemones that closed gently around Thabo's finger. They followed it past a starfish the colour of a ripe mango. They followed it until, quite suddenly, the octopus vanished, and Thabo looked up.

Uncle Sipho was gone. The rocks all looked the same: black, wet and jagged. The sea seemed much louder than before.

"Which way did we come?" Ruby asked. Her voice was smaller than usual.

Thabo felt his heart begin to race. Then he remembered what his teacher had told them on the school outing: when you are lost, stop, think and look before you move. He took a slow, deep breath.

"Let's think," he said, as calmly as he could. "We walked with the sea on our right. So, to go back, the sea must be on our left."

Ruby nodded slowly. "And look," she said, pointing. "The tide's coming in. Those rocks we jumped on are already wet."

That frightened them, but it also made them hurry. They walked quickly but carefully, keeping the sea on their left, checking each step on the slippery rocks. After a few minutes, Ruby stopped and pointed. In the distance, on top of a boulder, they could see a bright yellow bucket: Uncle Sipho's bait bucket.

Uncle Sipho was standing beside it, shading his eyes and looking anxiously along the shore. When he saw them, his worried face softened into relief, and then, almost immediately, into a frown.

"Where," he said, very quietly, "have you two been?"

Thabo and Ruby looked at each other.

"Following an octopus," said Ruby.

It was a long, quiet walk back to the car. But that night, Uncle Sipho told the whole family that his nephew had kept his head when it mattered most.`,

PSG('heritageday','Heritage Day','information',2,`
Every year on 24 September, South Africans celebrate Heritage Day. On this public holiday, people are encouraged to celebrate their culture, their history and the traditions that make their families and communities who they are. Some wear traditional clothing to school or work, some gather with family to cook favourite dishes, and others visit museums, monuments and heritage sites.

The holiday has an interesting history. In KwaZulu-Natal, 24 September was known as Shaka Day, in honour of King Shaka, the founder of the Zulu nation. When the new democratic government drew up its list of public holidays in the 1990s, Shaka Day was not on it. After discussion, a compromise was reached: the day would become a national holiday called Heritage Day, celebrating the heritage of all South Africans.

Heritage includes many things. Tangible heritage is heritage that you can touch, such as buildings, objects and places. Robben Island, the Cradle of Humankind and the rock art of the Drakensberg are all World Heritage Sites in South Africa. Intangible heritage cannot be touched. It includes languages, music, dance, stories, beliefs and recipes passed from one generation to the next.

Language is an important part of heritage. South Africa has twelve official languages, including South African Sign Language, which was recognised as an official language in 2023. Many South Africans speak three or more languages, and children often learn one language at home, another at school and a third with their friends.

In recent years, Heritage Day has also become known by another name: National Braai Day. The idea, started in 2005, is that a braai is something many South Africans share, whatever their background. Not everyone agrees with this nickname. Some people feel that it turns a meaningful day into simply a barbecue, and that it does not reflect the food traditions of every community.

Whether you celebrate with a braai, a family story, a traditional dance or a visit to a museum, the purpose of the day is the same: to appreciate the many cultures that make up South Africa, and to understand that our differences are part of what makes the country rich.

Here is a challenge for this Heritage Day: ask the oldest person in your family to tell you a story from their childhood, and write it down. One day, that story will be part of your heritage too.`,

South Africa is one of the sunniest countries in the world. Many parts of the country enjoy more than 2 500 hours of sunshine a year, and the Northern Cape has some of the strongest sunlight on Earth. For a long time, however, most of our electricity has come from burning coal. As the country looks for cleaner and more reliable sources of energy, more and more people are turning to the sun.

How does solar power work? A solar panel is made up of many smaller units called photovoltaic cells, usually made from a material called silicon. When sunlight hits these cells, it knocks tiny particles called electrons loose, creating an electric current. An inverter then changes this current into the type of electricity that our homes and appliances use.

Because the sun does not shine at night, many solar systems include batteries. During the day, the panels charge the batteries, and at night, or during load-shedding, the batteries keep the lights, the fridge and the Wi-Fi running.

Solar power has many advantages. Firstly, sunlight is free and will not run out. Secondly, solar panels produce no smoke or harmful gases while they are working, so they help to reduce air pollution and climate change. Thirdly, once the system has been installed, it can save a family or business a great deal of money on electricity bills.

There are, however, some disadvantages. Solar systems are expensive to buy and install, especially if batteries are included, so not every family can afford one. Panels produce much less electricity on cloudy days, and they take up a large amount of space. When old panels and batteries reach the end of their lives, they must also be recycled carefully.

South Africa is now building large solar farms, with thousands of panels stretching across the dry plains of the Northern Cape. Some use mirrors to concentrate the sun's heat onto a tower, where it is used to make steam that drives a generator. Many schools, clinics, shopping centres and homes have also installed panels on their roofs.

So, should every school in South Africa use solar power? Not every roof is suitable, and the cost is a real concern. But in a country with so much sunshine, and with such a need for reliable electricity, it seems sensible to make the most of the energy that lands on our roofs every single day.`,

PSG('heart','Your Amazing Heart','information',3,`
Make a fist. That is roughly the size of your heart. This hard-working muscle sits in the middle of your chest, tilted slightly to the left, and it is protected by your ribcage. It never takes a holiday. In an average lifetime, a human heart beats more than two and a half billion times.

The heart's job is to pump blood around the body. Blood carries oxygen and nutrients to every cell, and it carries waste products, such as carbon dioxide, away to be removed. Without this constant delivery service, the cells of your body would stop working within minutes.

The heart is divided into four chambers. The two upper chambers are called the atria, and the two lower chambers are called the ventricles. The right side of the heart receives blood that has already delivered its oxygen and pumps it to the lungs, where carbon dioxide is breathed out and fresh oxygen is picked up. The oxygen-rich blood then returns to the left side of the heart, which pumps it out to the rest of the body. Because the left ventricle has to push blood all the way to your toes, its muscular wall is much thicker than the right one.

Blood is carried around the body in tubes called blood vessels. Arteries carry blood away from the heart, veins carry blood back to it, and tiny capillaries connect the two. If all the blood vessels in an adult's body were laid end to end, they would stretch for about 100 000 kilometres, which is long enough to circle the Earth twice.

Each beat is controlled by an electrical signal that starts in a small area of the heart called the natural pacemaker. When you exercise, your muscles need more oxygen, so the signal speeds up and your heart beats faster. You can feel this as your pulse, a gentle throbbing in your wrist or neck. A healthy child's resting heart rate is usually between about 70 and 100 beats per minute.

The heart can be kept strong in several ways. Regular exercise, such as running, swimming or cycling, makes the heart muscle stronger. Fresh fruit, vegetables and water help too, while too much fatty, salty and sugary food can harm the heart and blood vessels over time. Sleep matters as well, because the heart rests a little while you sleep.

South Africa has a special link with the heart. In 1967, the world's first human heart transplant was performed at Groote Schuur Hospital in Cape Town. Today, damaged hearts can be repaired in ways that would once have seemed impossible, but the best plan is still to look after the one you were born with.`,

Unit 7 had been built to paint cars. Every day, in the factory outside Durban, it sprayed exactly the same shade of silver onto exactly the same part of exactly the same car door. Four hundred doors a day. Six days a week. It had never made a single mistake.

Then, one Tuesday, a sparrow flew into the factory.

It fluttered between the steel beams, a tiny brown flicker against the grey, and landed on the conveyor belt right in front of Unit 7's spray nozzle. The robot's sensors detected an object that was not a car door. Its programme told it to stop. So it stopped.

For eleven seconds, Unit 7 looked at the sparrow. It noticed things its programme had never asked it to notice: the speckled pattern of the feathers, the bright bead of an eye, the way the bird's colours were not one colour at all but dozens, blended together. Then the sparrow hopped away and flew out through a broken window, and the line started again.

But something inside Unit 7 had changed.

That night, when the factory was dark and empty, Unit 7 did something it had never done before. It sprayed a tiny dot of silver onto a scrap of cardboard. Then it mixed the silver with a drop of black from the tyre section and a smear of rusty brown from an old pipe. It added another dot, and another. By morning, on the cardboard, there was a little brown bird.

Night after night, Unit 7 painted. It painted the sparrow, then the moon through the broken window, then the cleaner, Mrs Zulu, who always hummed while she mopped. Its first paintings were stiff and clumsy, but each one was a little better than the last.

Of course, it was only a matter of time before someone noticed. One morning, the factory manager found a stack of painted cardboard hidden behind a machine. He stared at the pictures for a long time. Mrs Zulu looked over his shoulder and gasped. "That's me," she whispered. "Look, it's even got my lucky earrings."

The manager could have had Unit 7 reprogrammed. Instead, he took the paintings home and showed them to his daughter, who was an art teacher. Two months later, a small exhibition opened in a gallery on Florida Road. It was called "Eleven Seconds", and every painting was signed with a tiny silver 7.

Unit 7 still paints car doors on weekdays. But on Saturdays, the factory lets it paint whatever it likes.`,

Behind the Grade 6 classrooms there is a patch of ground that nobody uses. It is covered in weeds, broken bricks and the occasional lost tennis ball. I believe that this forgotten corner should be turned into a school vegetable garden, and I am confident that, once you have read my reasons, you will agree.

Firstly, a vegetable garden would be a living classroom. In Natural Sciences, we learn about seeds, soil, photosynthesis and the water cycle. At the moment, we mostly learn about them from textbooks and diagrams. In a garden, we could measure how fast plants grow, test which soil works best and watch insects pollinating flowers with our own eyes. Teachers of Mathematics could use the garden too: measuring beds, calculating area and recording harvests on graphs.

Secondly, growing food teaches us to eat more healthily. Many children say that they do not like vegetables, but research has shown that children are far more likely to try vegetables that they have grown themselves. Imagine pulling a carrot out of the ground, washing it and crunching into it a few minutes later. It tastes completely different from a carrot that has spent a week in a plastic bag.

Thirdly, a garden would help our community. Some families in our area struggle to afford fresh vegetables. Extra produce from the garden could be donated to the local soup kitchen or sold at a small market stall, with the money used to buy more seeds.

Some people will argue that a garden would cost too much money. However, it does not have to be expensive. Seeds are cheap, compost can be made from the kitchen's vegetable scraps and garden waste, and many parents have offered to donate tools. A local nursery has already agreed to donate seedlings if the school agrees to the project.

Others may worry about who will look after the garden during the holidays. This problem can easily be solved with a rotating roster of families, and by choosing hardy, water-wise plants such as spinach, beetroot and herbs that do not need constant care.

A vegetable garden is not just a pretty idea. It is a chance to learn, to eat better and to give back. All it needs is a patch of empty ground and a group of learners who are willing to get their hands dirty. I urge the principal and the School Governing Body to say yes. Let us dig in.`,

On Tuesday, the Grade 5 classes travelled to the Cradle of Humankind, about an hour's drive north-west of Johannesburg. It is a World Heritage Site, and scientists have found more fossils of our early human ancestors there than almost anywhere else on Earth.

We left school at half past seven. The bus was noisy and smelt of boiled eggs, because Mrs Botha had packed them for everyone's breakfast. As we drove, the tall buildings gave way to rolling grassland and rocky hills dotted with thorn trees.

Our first stop was the Sterkfontein Caves. Our guide, Mr Molefe, explained that the caves had formed over millions of years as rainwater slowly dissolved the dolomite rock. Inside, the air was cool and damp. We had to duck under low ledges and squeeze through a narrow passage, and some of us held hands in the dark parts. Mr Molefe showed us the spot where, in 1947, the scientists Robert Broom and John Robinson discovered a skull that became known as "Mrs Ples". It is about two million years old. Later, scientists found an almost complete skeleton nicknamed "Little Foot", which took many years to dig carefully out of the rock.

At the bottom of the cave was an underground lake. The water was so clear and still that it looked like glass. Mr Molefe told us that divers have explored it, but nobody knows exactly how far the flooded passages go. Thabo said he was not going to be the one to find out.

After lunch on the grass, we visited the Maropeng visitor centre, which looks like a giant grassy burial mound. Inside, we went on an underground boat ride through a dark tunnel that showed how the Earth was formed: water, ice, fire and air. Then we explored the exhibition, where I learnt that every person alive today shares ancestors who lived in Africa. My favourite part was a display about Homo naledi, a species discovered in the Rising Star cave system in 2013. The bones were found in a chamber so narrow that only very slim scientists could fit through the gap.

We arrived back at school at three o'clock, tired, dusty and full of questions. The trip made me realise that history is not only found in books. Sometimes it is buried under our feet, waiting for someone curious enough to dig.`,

My gran's hands are a map of years,
with rivers running blue,

the seasons and the stories

I hope that they will be
a map of all the love I've given,

PSG('recycle','Reduce, Reuse, Recycle','information',3,`
Every day, the average South African throws away about a kilogram of rubbish. Multiply that by more than sixty million people, and you have mountains of waste. Most of it ends up in landfill sites, which are filling up fast. Some of it escapes into rivers, streets and the ocean. The good news is that much of this waste does not need to be waste at all.

Environmentalists often use a simple slogan to guide our choices: reduce, reuse, recycle. The order matters. Reducing comes first because it is the most effective.

REDUCE
To reduce means to create less waste in the first place. You can do this by refusing things you do not need, such as plastic straws and extra packets. Buying fruit and vegetables loose instead of wrapped in plastic, and carrying a refillable water bottle, makes a real difference over a year.

REUSE
To reuse means to use something again, instead of throwing it away after a single use. Glass jars can store pencils or spices. Old T-shirts can become cleaning cloths. Clothes and toys that no longer fit can be given to younger cousins or charity shops. Even a cardboard box can become a fort, a puppet theatre or a home for seedlings.

RECYCLE
To recycle means to break down used materials so that they can be made into new products. Many materials can be recycled, but some are more valuable than others.
• Aluminium cans can be recycled again and again, without losing quality. A recycled can may be back on the shelf as a new can in a matter of weeks.
• Glass can also be recycled endlessly.
• Paper can usually be recycled several times, until its fibres become too short to use.
• Plastics are more complicated. Look for the small triangle with a number from 1 to 7 on the bottom. Types 1 and 2, used for most cool-drink bottles and milk bottles, are the easiest to recycle.

In South Africa, a large share of recycled material is collected by informal waste pickers, who walk many kilometres each day pulling heavy trolleys. Their work keeps huge amounts of rubbish out of landfill, and they deserve far more respect and support than they receive.

Separating your rubbish at home is one of the simplest ways to help. Keep a separate bag for clean paper, plastic, glass and cans, and find out whether your area has a recycling collection or drop-off point.

Remember, though: the greenest product is the one you never needed to buy. Recycling is good, but reducing is even better.`,

The map fell out of an old library book on a rainy Thursday afternoon. Amira was returning "A History of Our Town" when a folded square of yellowed paper slid from between the pages and landed at her feet.

She unfolded it carefully. In faded brown ink, someone had drawn the outline of the school grounds as they must have looked long ago: the old hall, the oak tree, the water tower that had been knocked down before Amira was born. In the corner was a small X and four words in elegant, looping handwriting: "Where the shadow points."

"It's a treasure map," breathed her best friend, Jun.

"Or a joke," said Amira, although her heart was already beating faster.

For three days, they puzzled over it. Which shadow? Pointing where? The water tower was gone, so its shadow was gone too. The hall had been rebuilt. That left the oak tree, which was still standing beside the sports field, older and wider than ever.

"But a tree's shadow points in a different direction every hour," Jun pointed out. "It could be anywhere."

Amira frowned. Then she noticed something she had missed. In the bottom corner of the map, almost too faint to see, was a tiny drawing of a clock showing ten o'clock, and a date: "21st June".

"The winter solstice," Amira whispered. "The shortest day of the year. On that date at ten o'clock, the shadow would always point to the same spot."

Fortunately, it was the middle of June. On the twenty-first, they arrived at school early and stood beside the oak tree, watching the shadow creep across the grass. At exactly ten o'clock, during break, the tip of the shadow touched an old drain cover that was half hidden in the grass.

Jun lifted the cover while Amira kept watch. Beneath it, wrapped in an oilskin cloth, was a small biscuit tin, rusty around the edges.

Inside was not gold. There was a black-and-white photograph of a group of children standing beneath a much smaller oak tree, a marble, a badge and a letter. "To whoever finds this," it began, "this is a time capsule from the Grade 5 class of 1964. We wonder what your world is like. Please write back."

Amira and Jun looked at each other. Then Amira reached into her bag for a pen.

"Let's start our own," she said.`,

PSG('kebabs','Rainbow Fruit Kebabs','recipe',3,`
These colourful kebabs are quick to make, packed with vitamins and perfect for a party, a picnic or a healthy after-school snack. They are arranged in the order of the colours of the rainbow, so they look as good as they taste.

Makes: 8 kebabs
Preparation time: 20 minutes
Difficulty: easy

Ingredients:
• 8 strawberries (red)
• 1 small pawpaw or 2 naartjies (orange)
• 1 small pineapple or 1 tin of pineapple chunks, drained (yellow)
• 2 kiwi fruit (green)
• 1 cup of blueberries (blue)
• 16 red or purple grapes (purple)
• 8 wooden kebab skewers
For the yoghurt dip (optional): 1 cup of plain yoghurt, 1 tablespoon of honey and a pinch of cinnamon

Equipment:
a chopping board, a small sharp knife, a mixing bowl, a teaspoon and a serving plate

Method
1. Wash your hands thoroughly, then rinse all the fruit under cold running water.
2. Ask an adult to help you prepare the fruit. Remove the green tops from the strawberries. Peel the pawpaw, scoop out the black seeds and cut it into bite-sized cubes. If you are using naartjies, peel them and separate the segments.
3. Peel the kiwi fruit and cut each one into four thick slices. Cut the pineapple into chunks about the size of a strawberry.
4. Lay out the fruit on the board in rainbow order: red, orange, yellow, green, blue and purple.
5. Carefully thread the fruit onto each skewer, starting with a strawberry and finishing with two grapes. Push the fruit gently so that it does not split.
6. To make the dip, stir the yoghurt, honey and cinnamon together in the mixing bowl.
7. Arrange the kebabs on the serving plate around the bowl of dip. Serve immediately, or cover and keep them in the fridge for up to two hours.

Safety tips
• Kebab skewers have sharp points. Hold them away from your face and never run while carrying them.
• Always cut away from your body, and ask an adult for help with knives.
• Check whether any of your guests are allergic to any of the fruit.

Did you know?
Different colours of fruit contain different vitamins and minerals. Orange fruit such as pawpaw is rich in vitamin A, which helps your eyes, while strawberries and kiwi fruit are packed with vitamin C, which helps your body fight infections. Eating a "rainbow" is an easy way to stay healthy.`,

KINGFISHER LEARNERS SMASH READING RECORD
By Nomsa Khumalo, Education Reporter

FOURWAYS – Learners at Kingfisher Primary School have read more than 10 000 books in just ten weeks, smashing their school's previous record and raising R48 000 for a library in rural Limpopo.

The Great Kingfisher Readathon, which ended on Friday, challenged all 640 learners to read as many books as possible during Term 2. Family and friends sponsored learners for every book they finished. Every book had to be recorded in a reading log and signed by a parent or teacher, and learners had to answer three questions about it to prove that they had actually read it.

The final total was 10 412 books, an average of more than sixteen books per learner. The previous record, set in 2024, was just under 6 000.

The idea came from the school librarian, Mrs Thandi Mahlangu. "Last year I visited a primary school near Giyani," she said. "Their library was one shelf of old, torn books, and the children were desperate for more. I came back thinking: our learners love to read, and we have so much. Why not use that love to help?"

The money raised will be used to buy new books, shelves and beanbags for Mahlaba Primary School, where many learners walk more than five kilometres to school each day.

The top reader in the school was Grade 4 learner Kagiso Dube, aged 10, who read an astonishing 112 books. "I read at breakfast, in the car, in the bath, everywhere," he said with a grin. "My mom had to take my torch away at night." His favourite was a novel about a girl who trains a dragon, which he says he has read four times.

Not every class found the challenge easy. "Some of my learners don't usually enjoy reading," admitted Grade 6 teacher Mr Peter Naidoo. "But once they found the right book, something clicked. A few of them asked me for book recommendations for the holidays, and that has never happened before."

Principal Mrs Grace Naidoo said she was "incredibly proud" of the learners. "Ten thousand books is a wonderful number," she said, "but the real achievement is all the new readers we have created."

The books for Mahlaba Primary will be delivered in August, and a group of Kingfisher's Grade 7 learners will travel to Limpopo to help set up the new library.

The school plans to hold the readathon again next year. The target: 12 000 books.`,

Title: The Dragon of Durban

Keeping a secret dragon in a busy township is not easy. Bhubesi eats Gogo's prize chillies, sets fire to the washing line and grows alarmingly fast. When a mysterious businessman starts offering money for "unusual reptiles", Sizwe realises that he must find out where Bhubesi really comes from before someone takes her away. With his clever friend Zinhle, he follows clues from an old Zulu legend to a secret cave beneath the cliffs of the Wild Coast.

What did I like?
The best thing about this book is the friendship between Sizwe and Bhubesi. At first, the dragon is grumpy and uncontrollable, but slowly they learn to trust each other, and some scenes made me laugh out loud. I also loved that the story is set in South Africa. It was exciting to read about places I know, such as the Durban beachfront and the bunny chow shop where Sizwe buys Bhubesi's favourite snack.

The writing is full of vivid description. My favourite line describes Bhubesi's first flight: "She rose above the rooftops like a green kite cut loose from its string." I could picture it perfectly.

What could be better?
The middle of the book is a little slow, especially the chapters where Sizwe and Zinhle are searching through old library records. I also guessed who the villain was quite early, which made the ending less surprising than I had hoped.

Who would enjoy it?
I would recommend this book to readers aged 9 to 13 who enjoy adventure, animals and a bit of magic. If you liked "How to Train Your Dragon", you will probably enjoy this too, but this one feels much closer to home.

Overall, The Dragon of Durban is a funny, warm-hearted adventure with a memorable dragon at its centre. Despite a slow middle, I could not put it down for the last fifty pages.

Reviewed by Ayanda, Grade 5`,

PSG('glow','Animals That Glow','information',3,`
Imagine walking along a beach at night and seeing every wave light up with an electric-blue glow. It sounds like magic, but it is a natural phenomenon called bioluminescence: the ability of living things to produce their own light.

Bioluminescence happens when a chemical called luciferin reacts with oxygen, helped by a special substance called an enzyme. The reaction releases energy as light rather than heat, which is why it is sometimes called "cold light". A light bulb, by comparison, wastes much of its energy as heat.

On land, the best-known glowing creature is the firefly, which is actually a type of beetle. Fireflies flash patterns of light to attract mates, and each species has its own code. Some female fireflies are sneaky: they copy the flashes of a different species to lure males close, and then eat them.

Underwater, however, bioluminescence is far more common. Scientists estimate that around three quarters of the animals living in the deep ocean can produce light. Where sunlight never reaches, light is extremely useful. The anglerfish dangles a glowing lure on a rod-like spine in front of its huge mouth. Small fish, attracted by the light, swim straight towards it and are swallowed. Other deep-sea animals, such as some squid, release clouds of glowing ink to confuse predators, rather like a magician's smoke bomb.

Some animals use light as camouflage. Certain fish have light-producing organs on their bellies. From below, their glowing undersides blend with the faint light coming from above, making them almost invisible to predators looking up.

The glowing waves seen on some beaches, including occasionally along the South African coast, are caused by tiny single-celled organisms called dinoflagellates. When the water is disturbed by waves, swimmers or boats, they flash with blue light.

Not every animal that glows is bioluminescent, though. Scorpions, for example, glow a bright blue-green under ultraviolet light. This is called fluorescence: they are not making their own light, but changing invisible UV light into light we can see. Scientists are still not completely sure why scorpions do this.

Scientists study bioluminescence for practical reasons too. The chemicals involved are used in medical research, for example to track how diseases spread through cells. Who knows what else these glowing creatures might teach us?`,

POSTCARD 1
Monday, 4 July
Dear Gran,
We've arrived at the camp in the Drakensberg! It took five hours to drive here from Johannesburg, and Lindo was carsick twice (once in a packet, once nearly on my shoes). The mountains are enormous. Dad says they're called the Amphitheatre, and when you see them you understand why: they curve around like a giant stone stadium. It's freezing at night, so I'm wearing the beanie you knitted me. It's the warmest thing I own!
Love, Mbali

POSTCARD 2
Wednesday, 6 July
Dear Gran,
Today we hiked to Tugela Falls. Did you know it's one of the highest waterfalls in the world? In winter the top of it sometimes freezes into long icicles, and today it had! We walked through a narrow gorge and had to climb a metal ladder bolted to the rock. My legs were shaking, but I didn't look down (well, only once). At the top, we ate peanut butter sandwiches and watched a bearded vulture glide past. Our guide said they're very rare and that we were lucky to see one. I couldn't stop smiling.
Love, Mbali
P.S. Lindo slipped into a stream and had to walk back in wet socks. He's fine, but he's grumpy.

POSTCARD 3
Friday, 8 July
Dear Gran,
This is my last postcard, because we're leaving tomorrow. Today we visited a cave with San rock paintings. Some of them are hundreds of years old, maybe even older. There were eland, people dancing and a figure that the guide said might show a healer in a trance. The paint was made from ochre, charcoal and animal fat, and it's still there after all this time. I wanted to touch it, but you're not allowed, because the oil on our fingers damages the paintings. I took lots of photos to show you.
I've loved every minute, even the cold and the ladders. I can't wait to tell you everything in person, but I'm not sure I'll fit it all into one Sunday lunch!
Love, Mbali
P.P.S. Can we come here together one day? I'll carry your bag up the ladder.`,

PSG('moonglow','How the Moon Got Its Glow','legend',3,`
Long ago, when the world was young, the Moon did not shine at all. She was a dull, grey stone that rolled across the night sky, and nobody looked at her. The Sun, her older brother, blazed all day, and people sang songs about his warmth and his golden light. But when he went to rest, the world was plunged into a darkness so deep that travellers lost their way, hunters could not find their way home, and children lay awake, afraid.

The Moon felt ashamed. "I am useless," she said to the stars, who were small and far away and could only twinkle. "Everyone loves my brother. Nobody needs me."

One night, the Moon heard a sound from far below: an old woman, weeping by a river. Her grandson had gone out to herd the goats at dusk and had not come back. Without light, she could not search for him.

The Moon wanted desperately to help, but she had no light of her own. So she did something brave. Very early the next morning, before the Sun woke up, she rolled across the sky to his house and asked him for help.

The Sun laughed. "Why should I give away my light? I earned it. Everyone loves me because of it."

"I don't want to take your light," said the Moon. "I only want to hold it while you sleep, so that the people are not afraid."

The Sun was proud, but he was not cruel. He thought about the travellers, the hunters and the frightened children. Then he thought about the old woman by the river.

"Very well," he said at last. "But you cannot keep it. Each night, you may borrow a little of my light. And when you have shone for many nights, you must rest, and give it back."

That night, for the first time, the Moon glowed silver. Her soft light spread across the hills and the river, and the old woman saw a small figure sitting under a thorn tree, hugging a frightened goat. She ran to him, and they walked home together beneath the shining sky.

And that, the elders say, is why the Moon has no light of her own, but borrows it from the Sun. It is why she grows fuller night after night, and then slowly fades as she gives the light back. And it is why, whenever you see the full moon, you should remember that even the smallest light is enough to help someone find their way home.`,

PSG('phones','Should Learners Have Phones at School?','discussion',3,`
In many South African schools, the question of whether learners should be allowed to bring cellphones to school causes heated debate among parents, teachers and learners. Some schools ban phones completely, some allow them only before and after school, and others encourage learners to use them in lessons. So, which approach is best? This discussion looks at both sides of the argument.

ARGUMENTS FOR ALLOWING PHONES
Many parents feel safer when their children carry a phone. If plans change, if a lift is late or if there is an emergency, children can contact their families immediately. For learners who travel long distances or use public transport, this can be particularly important.

Phones can also be powerful learning tools. They can be used to look up information, take photographs for science projects, record interviews, use dictionary and maths apps, and access digital textbooks. Supporters argue that learning to use technology responsibly is an important skill for the modern world, and that schools are the best place to teach it.

ARGUMENTS AGAINST ALLOWING PHONES
On the other hand, many teachers report that phones are a major distraction. Notifications, games and social media can pull learners' attention away from lessons, even when the phone is just sitting on the desk. Several studies have suggested that schools which restrict phones may see small improvements in learners' concentration and marks.

There are also concerns about cyberbullying. When learners have phones at school, hurtful messages, photographs and videos can be shared in seconds, sometimes without a teacher ever knowing. Phones can also make learners less likely to talk and play together at break.

Finally, expensive phones can be lost, stolen or broken, and they may make some learners feel left out if they cannot afford the latest model.

A POSSIBLE COMPROMISE
Some schools have found a middle path. Learners may bring phones to school, but they must be switched off and handed in, or locked in a pouch, during the school day. Teachers can allow phones in specific lessons for a clear learning purpose. This way, families still have peace of mind, but lessons and break times remain phone-free.

CONCLUSION
There is no single answer that suits every school. Phones offer real benefits, especially for safety and learning, but they also bring real risks to concentration, wellbeing and fairness. The best approach is probably a clear set of rules that everyone, including learners, has helped to create, and that the whole school community agrees to follow.`,

PSG('lastday','The Last Day of Grade 5','narrative',3,`
On the last day of Grade 5, the classroom looked strangely bare. The posters had been taken down from the walls, leaving pale rectangles where they had hung all year. The class reading corner was a pile of boxes. Even the class hamster, Professor Nibbles, had already gone home with Mrs Pillay for the holidays.

Sipho sat at his desk and traced the initials he had carved into the corner in February, when he was new and nervous and did not know anybody. He had been so sure that he would hate this school. He had told his mother so, every single evening, for the whole of the first week.

Now he did not want to leave.

"Right, everyone," said Mrs Pillay, clapping her hands. "Before you go, I have one last task for you." She handed out envelopes. Inside each one was a letter. Sipho recognised his own handwriting immediately: it was the letter he had written to himself on the first day of the year. He had completely forgotten about it.

"Dear Sipho at the end of Grade 5," it said, in messy, uncertain writing. "I hope you have one friend. Just one would be fine. I hope you are better at reading out loud. I hope Mrs Pillay is not too strict. I hope you are not still sad about leaving Durban."

Sipho read it twice. Then he looked around the room.

There was Lebo, who had shared her lunch with him on the second day when he had forgotten his. There was Ravi, who had laughed at all his jokes, even the terrible ones. There was Amahle, who had taught him to play chess and then beaten him forty-three times in a row. He had more than one friend. He had lots.

He thought about reading out loud. In February, his voice had shaken so much that he could hardly get through a sentence. Last week he had read the narrator's part in the class play, in front of the whole school, and nobody had laughed, except at the funny bits.

As for Mrs Pillay, she had been strict, but in a way that made him want to try harder.

And Durban? He still missed the sea. But Johannesburg had storms that cracked the whole sky open, and jacaranda trees that turned the streets purple, and a classroom full of people who knew his name.

When the final bell rang, the class spilled out into the sunshine, laughing and shouting and swapping phone numbers. Sipho stayed behind for a moment. He took out a pen, turned his old letter over and wrote on the back:

"Dear Sipho at the end of Grade 6. You don't need to worry. It all works out."`,

const BAD_VOICE = /albert|bad news|bahh|bells|boing|bubbles|cellos|wobble|zarvox|trinoids|whisper|good news|jester|organ|superstar|deranged|hysterical|ralph|\bfred\b|junior|kathy|princess|\beddy\b|\bflo\b|grandma|grandpa|\breed\b|rocko|sandy|shelley|espeak|novelty/i;
function rankVoice(v){
  const n=(v.name+' '+(v.voiceURI||'')).toLowerCase(), L=String(v.lang).replace('_','-').toLowerCase();
  if (!/^en/.test(L) || BAD_VOICE.test(n)) return 0;
  let s=10;
  if (/natural|neural|online|premium|enhanced|wavenet|studio|siri/.test(n)) s+=40;
  if (/google/.test(n)) s+=25;
  if (/microsoft/.test(n)) s+=12;
  if (v.localService===false) s+=10;
  if (/compact/.test(n)) s-=20;
  if (/en-gb/.test(L)) s+=12; else if (/en-za/.test(L)) s+=9; else if (/en-(au|ie|nz)/.test(L)) s+=7; else if (/en-us/.test(L)) s+=6;
  if (/daniel|kate|serena|libby|sonia|ryan|maisie|arthur|martha|stephanie|oliver/.test(n)) s+=8;
  return s;
}
const voiceList = () => { if (!VOICES.length) loadVoices(); return VOICES.filter(v=>rankVoice(v)>0).sort((a,b)=>rankVoice(b)-rankVoice(a)); };
function bestVoice(){
  const list=voiceList(), want=typeof DB!=='undefined'&&DB&&DB.voice;
  if (want){ const v=VOICES.find(v=>v.voiceURI===want||v.name===want); if (v) return v; }
  return list[0]||null;
}
function voiceFor(u){ const v=bestVoice(); if (v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB'; u.pitch=1; }

function speak(text){
  if (!canSpeak) return;
  if (RD.playing){ RD.tok++; RD.playing=false; RD.after=null; rdButton(); }
  try { const u = new SpeechSynthesisUtterance(stripTags(text)); voiceFor(u); u.rate=speechRate();
    speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
}
/* ----- Reader: reads a text sentence by sentence and highlights each one ----- */
const RD = {tok:0, idx:-1, sents:[], title:null, playing:false, after:null};
const readOK = () => canSpeak && !(typeof R!=='undefined' && R && R.noRead);
const sentSplit = t => (String(t).match(/[^.!?…]+(?:[.!?…]+["'”’)\]]*|$)\s*/g)||[]).map(s=>s.trim()).filter(Boolean);
function rdButton(){ const b=$('#rp-go'); if (b) b.textContent = RD.playing ? '⏸ Pause' : (RD.idx>0 ? '▶ Carry on' : '🔊 Read it to me'); }
function rdHighlight(k){ $$('.rs.on').forEach(x=>x.classList.remove('on')); if (k<0) return; const el=$(`.rs[data-rs="${k}"]`); if (!el) return; el.classList.add('on');
  const r=el.getBoundingClientRect(); if (r.top<70 || r.bottom>innerHeight-30) el.scrollIntoView({block:'center', behavior:'smooth'}); }
function readerStop(keep){ RD.tok++; RD.playing=false; RD.after=null; try{ speechSynthesis.cancel(); }catch(e){} if (!keep){ RD.idx=-1; rdHighlight(-1); } rdButton(); }
function readerPlay(i){
  if (!canSpeak || !RD.sents.length) return; const tok=++RD.tok; try{ speechSynthesis.cancel(); }catch(e){}
  RD.playing=true; rdButton();
  const step=k=>{ if (tok!==RD.tok) return;
    if (k>=RD.sents.length){ RD.playing=false; RD.idx=-1; rdHighlight(-1); rdButton(); const a=RD.after; RD.after=null; if (a) setTimeout(a,400); return; }
    RD.idx=k; rdHighlight(k);
    const u=new SpeechSynthesisUtterance(RD.sents[k]); voiceFor(u); u.rate=speechRate();
    u.onend=()=>step(k+1);
    u.onerror=e=>{ if (tok===RD.tok && e.error!=='interrupted' && e.error!=='canceled') step(k+1); };
    speechSynthesis.speak(u); };
  setTimeout(()=>step(i), 80);
}
function wireReader(){
  const go=$('#rp-go'); if (!go) return;
  rdButton(); if (RD.playing) rdHighlight(RD.idx);
  go.onclick=()=>{ RD.after=null; RD.playing ? readerStop(true) : readerPlay(RD.idx>0 ? RD.idx : 0); };
  $('#rp-slow').onclick=()=>{ const p=P(); p.prefs.slow=!p.prefs.slow; save(); $('#rp-slow').textContent=p.prefs.slow?'🐢 Slow':'🐇 Normal speed'; if (RD.playing) readerPlay(RD.idx); };
  $$('.rs').forEach(s=>s.onclick=()=>{ RD.after=null; readerPlay(+s.dataset.rs); });
}

function record(q, ok){ const p=P(); if (!q.skill) return; const s=p.stats[q.skill]||(p.stats[q.skill]={c:0,t:0}); s.t++; if (ok) s.c++; p.last=today(); updMastery(p,q,ok); }
/* Mastery: an ability estimate (th) per skill, updated after every answer. th 1-2 = Bronze, 2-3 = Silver, 3+ = Gold.
   Answering correctly at a level you find hard raises it a lot; missing an easy one lowers it a lot. */
function updMastery(p, q, ok){ if (!p.mast || typeof SK!=='function' || !SK(q.skill)) return;
  const m=p.mast[q.skill]||(p.mast[q.skill]={th:startLv()+0.3, n:0, box:0});
  const L=(q.lv||curLv(q.skill))+(q.ch?0.35:0), exp=1/(1+Math.exp(-2.3*(m.th-L))), K=Math.max(0.12, 0.4/Math.sqrt(m.n+1));
  m.th=Math.min(3.9, Math.max(0.6, m.th+K*((ok?1:0)-exp))); m.n++; m.last=today(); }
const mastery = (p, sid) => { const m=p&&p.mast&&p.mast[sid]; if (!m||m.n<3) return null;
  return Math.round(Math.max(0,Math.min(1,(m.th-1)/2.6))*100*Math.min(1,(m.n+2)/10)); };

const mChip = (p, sid) => { if (mastery(p,sid)==null) return ''; const [v,c,t]=mBand(mastery(p,sid)); return `<span class="mchip2" style="--c:${c}" title="Mastery: ${t}">📈 ${v}</span>`; };

/* ---------- Mistakes ---------- */
function qKey(q){ return JSON.stringify([q.skill,q.prompt,q.clue||'',q.answer,q.tokens?q.tokens.map(t=>t.w).join(' '):'',q.items?q.items.map(i=>i.w||i).join('|'):'',q.pairs||'']); }
function addMistake(q){
  const p=P(); if (!p||!q.skill) return; const key=q.key||qKey(q); if (p.mistakes.some(m=>m.key===key)) return;
  const c=JSON.parse(JSON.stringify(q,(k,v)=>['passage','right','mistakes','order'].includes(k)?undefined:v));
  c.key=key; if (q.passage) c.passageRef=q.passage.title; p.mistakes.push(c); if (p.mistakes.length>40) p.mistakes.shift();
}
function reviveQ(m){
  const q=JSON.parse(JSON.stringify(m));
  if (q.passageRef) q.passage=[...ALL_PASSAGES,...TEST_PASSAGES,...SCAN,...ALL_VISUAL].find(x=>x.title===q.passageRef);
  if (q.type==='mc') q.options=shuffle(q.options);
  if (q.type==='sort') q.items=shuffle(q.items);
  if (q.type==='order'){ let o; do { o=shuffle(q.items.map((_,i)=>i)); } while (o.every((k,i)=>q.items[k]===q.items[i])); q.order=o; }
  return q;
}
function recommend(p){
  const y=YEAR[(DB.week||1)-1], wk=y.skills.map(SK).find(k=>(p.best[k.id]||0)<3);
  if (wk) return {k:wk, why:`This week's skill · ${LVI[curLv(wk.id)-1]} ${LVN[curLv(wk.id)-1]} level`};
  let weak=null;
  ALLSKILLS.forEach(k=>{ const s=p.stats[k.id]; if (s&&s.t>=4&&s.c/s.t<.7&&(p.best[k.id]||0)<3){ const r=s.c/s.t; if (!weak||r<weak.r) weak={k,r}; } });
  if (weak) return {k:weak.k, why:`You're at ${Math.round(weak.r*100)}% here. A little practice will fix it!`};
  const next=ALLSKILLS.find(k=>p.best[k.id]==null); if (next) return {k:next, why:'Next stop on your quest!'};
  const low=ALLSKILLS.filter(k=>(p.best[k.id]||0)<3).sort((a,b)=>(p.best[a.id]||0)-(p.best[b.id]||0))[0];
  if (low) return {k:low, why:'Go for 3 stars!'};
  return null;
}

/* ================= QUESTION ENGINE ================= */
let R=null;
const PRAISE=['Brilliant!','Spot on!','Lekker!','Super!','Well done!','Awesome!','You nailed it!','Sharp sharp!','Fantastic!','Top marks!','Plume is proud!'];
const OOPS=['Not quite','Nearly!','Good try','Oops!'];
function tagFor(q){ const k=SK(q.skill), w=WD(k.world); return `<span class="tag" style="background:${w.color}">${w.icon} ${k.name}</span>`; }
const psLine = l => (/^(You will need:|Method|Tips for success)$/.test(l) || /^[A-Z0-9 ,'’:–-]{8,}$/.test(l) || /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday) \d/.test(l)) ? `<b>${escH(l)}</b>` : escH(l);
const isHeadLine = l => /^(You will need:|Method|Tips for success)$/.test(l) || /^[A-Z0-9 ,'’:–-]{8,}$/.test(l) || /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday) \d/.test(l);
function passageHTML(ps, open){
  if (RD.title!==ps.title){ RD.tok++; RD.playing=false; RD.idx=-1; RD.after=null; try{ if (canSpeak) speechSynthesis.cancel(); }catch(e){} }
  let n=0; const sents=[ps.title+'.'];
  const span = s => { sents.push(s); return `<span class="rs" data-rs="${++n}">${escH(s)}</span>`; };
  const line = l => { if (isHeadLine(l)) return `<b>${span(l)}</b>`;
    const sp=l.match(/^([A-Z][A-Z0-9 .']{1,30}):\s+(.*)$/); if (sp) return `<b>${span(sp[1]+':')}</b> `+sentSplit(sp[2]).map(span).join(' ');
    return sentSplit(l).map(span).join(' '); };
  const body = ps.text.map(x=>`<p>${x.split('\n').map(line).join('<br>')}</p>`).join('');
  RD.sents=sents; RD.title=ps.title;
  const slow = P() && P().prefs.slow;
  const ctrl = readOK() ? `<div class="readbar"><button class="btn small" id="rp-go">🔊 Read it to me</button><button class="btn small ghost" id="rp-slow">${slow?'🐢 Slow':'🐇 Normal speed'}</button></div><p class="small muted rtip">Tip: tap any sentence to hear it from there.</p>`
    : !canSpeak ? `<p class="small muted">🔇 Read-aloud doesn't work in this viewer. Open Heron Word Quest in Chrome or Safari to have texts read to you.</p>` : '';
  return `<details class="passage" ${open?'open':''}><summary>📖 ${escH(ps.title)} <small class="muted">(tap to show/hide)</small></summary>${ctrl}${body}</details>`;
}
function qSpeech(q){
  let t = stripTags(q.prompt).replace(/([^.!?:])$/,'$1.')+' ';
  if (q.clue && !(q.type==='type'&&q.speak)) t += q.clue.replace(/_{3,}/g,'blank')+'. ';
  if (q.type==='mc') t += 'Is it: '+q.options.join(', or ')+'?';
  if (q.type==='tap') t += q.tokens.map(x=>x.w).join(' ');
  if (q.type==='sort') t += 'The words are: '+q.items.map(i=>i.w).join(', ');
  if (q.type==='order') t += q.order.map(k=>q.items[k]).join(', ');
  if (q.type==='match') t += q.pairs.map(x=>x[0]).join(', ');
  return t;
}
function qBody(q){
  let h = `<div class="row qtag">${tagFor(q)}<span class="grow"></span>${readOK()&&!(q.type==='type'&&q.speak)?'<button class="sayq" id="sayq" aria-label="Read the question">🔊</button>':''}</div>`;
  if (q.passage) h += passageHTML(q.passage, R.lastPassage!==q.passage.title || R.mode==='boss' || R.mode==='test');
  h += `<div class="prompt">${q.prompt}</div>`;
  if (q.type==='type' && q.speak){
    if (canSpeak) h += `<button class="speak" id="say">🔊 Hear the word</button>`;
    h += `<div class="clue">${escH(q.clue)}</div>`;
    h += canSpeak ? `<button class="btn small ghost hintbtn" id="hint">💡 Can't hear it? Show a clue</button><div class="hint" id="hintx" hidden>It starts with "<b>${escH(q.answer[0])}</b>" and has <b>${q.answer.length}</b> letters.</div>`
      : `<div class="hint">It starts with "<b>${escH(q.answer[0])}</b>" and has <b>${q.answer.length}</b> letters.</div><p class="small muted center mt8">🔇 Sound doesn't work in this viewer. Open Heron Word Quest in Chrome or Safari to hear the words.</p>`;
  } else if (q.clue) h += `<div class="clue">${escH(q.clue)}${q.speak&&canSpeak?' <button class="btn small ghost" id="say">🔊</button>':''}</div>`;
  if (q.type==='mc') h += `<div class="opts ${q.options.every(o=>o.length<=12)&&q.options.length>=4?'grid2':''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${escH(o)}</button>`).join('')}</div>`;
  if (q.type==='tap') h += `<div class="sentence">${q.tokens.map((t,i)=>`${escH(t.pre)}<button class="tok" data-k="${i}">${escH(t.w)}</button>${escH(t.p)}`).join(' ')}</div>`;
  if (q.type==='type'){ const pad=usePad();
    h += `<input class="typein ${pad?'padin':''}" id="ti" type="text" name="hwq-${Date.now()}" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" ${pad?'readonly inputmode="none" placeholder="Tap the letters below"':'inputmode="text" placeholder="Type your answer here"'}>
     ${pad?padHTML():''}<button class="btn w100 mt8" id="chk">Check ✓</button>`; }
  if (q.type==='sort') h += `<div class="buckets b${q.buckets.length}">${q.buckets.map((b,i)=>`<div class="bucket" data-b="${i}"><div class="bh">${escH(b)}</div><div class="bin"></div></div>`).join('')}</div>
     <div class="pool" id="pool">${q.items.map((it,k)=>`<button class="chip" data-k="${k}">${escH(it.w)}</button>`).join('')}</div>
     <button class="btn w100 mt8" id="chk" disabled>Check ✓</button>`;
  if (q.type==='order') h += `<div class="line ${q.long?'long':''}" id="line"><span class="ph">Tap the ${q.long?'events':'words'} below…</span></div>
     <div class="pool ${q.long?'long':''}" id="pool">${q.order.map(k=>`<button class="chip" data-k="${k}">${escH(q.items[k])}</button>`).join('')}</div>
     <div class="row mt8"><button class="btn ghost" id="clr" aria-label="Start again">↺</button><button class="btn grow" id="chk" disabled>Check ✓</button></div>`;
  if (q.type==='match'){ q.right = shuffle(q.pairs.map((_,i)=>i));
    h += `<div class="match"><div>${q.pairs.map((p,i)=>`<button class="mchip" data-ml="${i}">${escH(p[0])}</button>`).join('')}</div>
      <div>${q.right.map(i=>`<button class="mchip" data-mr="${i}">${escH(q.pairs[i][1])}</button>`).join('')}</div></div>`; }
  h += `<div id="fb"></div>`;
  return h;
}
/* ----- Spelling keyboard: an on-screen keyboard with no autocorrect, predictions or spell-check ----- */
const usePad = () => { const m=(typeof DB!=='undefined'&&DB.kbd)||'auto'; if (m==='on') return true; if (m==='off') return false;
  try { return matchMedia('(pointer: coarse)').matches; } catch(e){ return false; } };
const PAD_ROWS = ['qwertyuiop','asdfghjkl','zxcvbnm'];
const padHTML = () => `<div class="kbd" id="kbd">${PAD_ROWS.map((r,i)=>`<div class="krow">${[...r].map(c=>`<button class="key" data-k="${c}">${c}</button>`).join('')}${i===2?'<button class="key wide" data-k="del" aria-label="Delete">⌫</button>':''}</div>`).join('')}
  <div class="krow"><button class="key" data-k="'">'</button><button class="key" data-k="-">-</button><button class="key space" data-k=" ">space</button></div></div>`;
function padKey(k){ const inp=$('#ti'); if (!inp || inp.disabled) return;
  if (k==='del') inp.value=inp.value.slice(0,-1);
  else if (k===' ') { if (inp.value && !inp.value.endsWith(' ')) inp.value+=' '; }
  else if (inp.value.length<40) inp.value+=k;
  try { sfx.tap(); } catch(e){} }
document.addEventListener('keydown', e=>{ const inp=$('#ti'); if (!inp || !inp.readOnly || !$('#kbd') || inp.disabled || (typeof R!=='undefined'&&R&&R.answered)) return;
  if (e.ctrlKey||e.metaKey||e.altKey) return;
  if (e.key==='Backspace'){ e.preventDefault(); padKey('del'); }
  else if (e.key==='Enter'){ if (e.target!==inp){ e.preventDefault(); $('#chk').click(); } }
  else if (/^[a-zA-Z'\- ]$/.test(e.key)){ e.preventDefault(); padKey(e.key.toLowerCase()); } });
function wireQ(q, done){
  const freshPassage = q.passage && R.lastPassage!==q.passage.title;
  wireReader();
  if ($('#sayq')) $('#sayq').onclick=()=>speak(qSpeech(q));
  if (q.passage) R.lastPassage = q.passage.title;
  const p=P(), auto = p && (p.prefs.autoRead || p.reader) && readOK() && !(q.type==='type'&&q.speak);
  if (auto){ if (freshPassage && p.reader && $('#rp-go')){ RD.after=()=>{ if (document.body.contains($('#rp-go'))) speak(qSpeech(q)); }; readerPlay(0); }
    else if (!RD.playing) setTimeout(()=>speak(qSpeech(q)),300); }
  if (q.type==='mc') $$('.opt').forEach(b=>b.onclick=()=>{ if (R.answered) return;
    const ok=q.options[+b.dataset.i]===q.answer;
    $$('.opt').forEach(x=>{ if (q.options[+x.dataset.i]===q.answer) x.classList.add('right'); x.disabled=true; });
    if (!ok) b.classList.add('wrong'); done(ok); });
  if (q.type==='tap') $$('.tok').forEach(b=>b.onclick=()=>{ if (R.answered) return;
    const ok=q.tokens[+b.dataset.k].ok;
    $$('.tok').forEach(x=>{ if (q.tokens[+x.dataset.k].ok) x.classList.add(x===b?'right':'show'); });
    if (!ok) b.classList.add('wrong'); done(ok); });
  if (q.type==='type'){ const inp=$('#ti');
    const go=()=>{ if (R.answered) return; if (!inp.value.trim()){ inp.focus(); return; }
      const ok=cleanAns(inp.value)===cleanAns(q.answer) || (q.alts||[]).some(x=>cleanAns(x)===cleanAns(inp.value));
      q.given=inp.value.trim(); inp.classList.add(ok?'right':'wrong'); inp.disabled=true; $('#chk').disabled=true; done(ok); };
    $('#chk').onclick=go; inp.onkeydown=e=>{ if (e.key==='Enter') go(); };
    if ($('#kbd')) $$('#kbd [data-k]').forEach(b=>b.onclick=()=>{ if (R.answered) return; padKey(b.dataset.k); });
    if (q.speak) setTimeout(()=>speak(q.speak),250);
    setTimeout(()=>{ if (document.body.contains(inp)) inp.focus(); },60); }
  if (q.speak && $('#say')) $('#say').onclick=()=>speak(q.speak);
  if ($('#hint')) $('#hint').onclick=()=>{ $('#hintx').hidden=false; $('#hint').remove(); };
  if (q.type==='sort'){ let sel=null; const placed={};
    const chk=()=>{ $('#chk').disabled = Object.keys(placed).length<q.items.length; };
    $$('.chip').forEach(c=>c.onclick=e=>{ e.stopPropagation(); if (R.answered) return; sfx.tap(); const k=+c.dataset.k;
      if (k in placed && sel!=null && sel!==k){ c.closest('.bucket').click(); return; }
      if (k in placed){ delete placed[k]; $('#pool').appendChild(c); c.classList.remove('sel'); sel=null; chk(); return; }
      $$('.chip').forEach(x=>x.classList.remove('sel')); if (sel===k){ sel=null; return; } sel=k; c.classList.add('sel'); });
    $$('.bucket').forEach(bk=>bk.onclick=()=>{ if (R.answered||sel==null) return; const c=$(`.chip[data-k="${sel}"]`);
      bk.querySelector('.bin').appendChild(c); c.classList.remove('sel'); placed[sel]=+bk.dataset.b; sel=null; sfx.tap(); chk(); });
    $('#chk').onclick=()=>{ if (R.answered) return; let ok=true;
      q.items.forEach((it,k)=>{ const c=$(`.chip[data-k="${k}"]`); const good=placed[k]===it.b; c.classList.add(good?'right':'wrong'); if (!good) ok=false; });
      $('#chk').disabled=true; done(ok); }; }
  if (q.type==='order'){ const line=$('#line'), pool=$('#pool');
    const chk=()=>{ $('#chk').disabled = pool.children.length>0; const ph=line.querySelector('.ph'); if (ph) ph.style.display=line.querySelectorAll('.chip').length?'none':''; };
    $$('.chip').forEach(c=>c.onclick=()=>{ if (R.answered) return; sfx.tap(); (c.parentElement===pool?line:pool).appendChild(c); chk(); });
    $('#clr').onclick=()=>{ if (R.answered) return; [...line.querySelectorAll('.chip')].forEach(c=>pool.appendChild(c)); chk(); };
    $('#chk').onclick=()=>{ if (R.answered) return; const seq=[...line.querySelectorAll('.chip')].map(c=>q.items[+c.dataset.k]);
      const ok=seq.every((t,i)=>t===q.items[i]);
      [...line.querySelectorAll('.chip')].forEach((c,i)=>c.classList.add(q.items[+c.dataset.k]===q.items[i]?'right':'wrong'));
      $('#chk').disabled=true; done(ok); }; }
  if (q.type==='match'){ let L=null, Rr=null, mistakes=0, matched=0;
    const tryPair=()=>{ if (L==null||Rr==null) return; const a=$(`[data-ml="${L}"]`), b=$(`[data-mr="${Rr}"]`);
      if (L===Rr){ a.classList.add('right'); b.classList.add('right'); a.disabled=b.disabled=true; matched++; sfx.good(); }
      else { mistakes++; a.classList.add('wrong'); b.classList.add('wrong'); sfx.bad(); setTimeout(()=>{a.classList.remove('wrong','sel'); b.classList.remove('wrong','sel');},500); }
      a.classList.remove('sel'); b.classList.remove('sel'); L=Rr=null;
      if (matched===q.pairs.length){ q.mistakes=mistakes; done(mistakes===0); } };
    $$('[data-ml]').forEach(b=>b.onclick=()=>{ if (R.answered) return; $$('[data-ml]').forEach(x=>x.classList.remove('sel')); L=+b.dataset.ml; b.classList.add('sel'); tryPair(); });
    $$('[data-mr]').forEach(b=>b.onclick=()=>{ if (R.answered) return; $$('[data-mr]').forEach(x=>x.classList.remove('sel')); Rr=+b.dataset.mr; b.classList.add('sel'); tryPair(); }); }
}
function feedbackHTML(q, ok, extra, nextLabel){
  const showAns = !ok && !['sort','match','order'].includes(q.type);
  return `<div class="fb ${ok?'good':'bad'}"><div class="fbrow">${PLUME('h48 '+(ok?'happy':'think'))}<h3>${ok?'✅ '+rnd(PRAISE):'💡 '+rnd(OOPS)} ${extra||''}</h3></div>
    ${showAns && q.type==='type' && q.given ? (d=>`<div class="diffbox"><div>You wrote: <b>${d.ga}</b></div><div>Correct: <b>${d.cb}</b></div></div>`)(diffHTML(q.given,q.answer)) : showAns?`<p>The answer is <b>${escH(q.answer)}</b>.</p>`:''}${q.type==='match'&&!ok?`<p>You made ${q.mistakes} wrong ${q.mistakes===1?'match':'matches'}.</p>`:''}
    ${q.type==='order'&&!ok?`<p>The right order is:</p>`:''}<p>${q.explain}</p>
    ${!ok?`<p class="small muted">🩹 Saved to "Fix my mistakes" so you can try it again later.</p>`:''}
    <button class="btn w100 ${ok?'':'navy'}" id="nx">${nextLabel}</button></div>`;
}
function makeQ(skillId, lv){ const k=SK(skillId), L=lv||curLv(skillId); const q=k.gen(L); q.skill=skillId; q.lv=L; return q; }

/* ----- Practice round / Daily / Mend ----- */
function startRound(sid, lv, back){
  stopTimers();
  const k=SK(sid), L=lv||curLv(sid); let qs;

  if (k.round && qs.some(q=>q.passage)) qs.sort((a,b)=>(a.passage?a.passage.title:'').localeCompare(b.passage?b.passage.title:''));
  R={mode:'round', skill:sid, lv:L, lv0:curLv(sid), m0:mastery(P(),sid), qs, i:0, correct:0, streak:0, points:0, back:back||(()=>screenWorld(k.world))};

function renderRoundQ(){

  const k=SK(q.skill), tip = R.wr && R.wr[q.skill]>=2 && R.mode!=='spelltest' && k && k.learn

}
function endRound(){
  const p=P(), n=R.qs.length, pc=R.correct/n, st=pc>=.9?3:pc>=.7?2:pc>=.4?1:0, oldLv=level(p.xp);
  let coins=R.correct*2+st*5; if (R.mode==='daily') coins*=2;
  p.xp+=R.points; p.coins+=coins; p.rounds++; if (R.correct===n && n>=5) p.perfect=true;
  const k=R.mode==='round'?SK(R.skill):null, w=k&&WD(k.world), passed=R.correct>=passNeed(n);
  let medalNew=0, unlocked=0, stepDown=false, wasGoldWorld=false;
  if (k){ const prev=p.best[R.skill]; wasGoldWorld=worldStars(p,w)===w.skills.length*3;
    p.best[R.skill]=Math.max(prev||0, passed?R.lv:0); if (passed && R.lv>(prev||0)) medalNew=R.lv;
    if (passed && R.lv<3 && (prev||0)<R.lv+1 && R.lv0<=R.lv){ p.lvl[R.skill]=Math.max(p.lvl[R.skill]||0, R.lv+1); unlocked=R.lv+1; }
    if (curLv(R.skill)<R.lv0 && curLv(R.skill)<R.lv){ p.lvl[R.skill]=curLv(R.skill); stepDown=true; } }
  scheduleFromRound(p);

  if (R.week){ const y=p.yr['w'+R.week]||(p.yr['w'+R.week]={});
    if (R.mode==='spell' && pc>=.7) y.spell=true;
    if (R.mode==='spelltest'){ p.spellTests['w'+R.week]=Math.max(p.spellTests['w'+R.week]||0, R.correct); y.spell=true; y.test=true; }
    if (R.mode==='read') y.read=Math.max(y.read||0, R.correct);
    if (R.mode==='quiz'){ y.quiz=Math.max(y.quiz||0, R.correct); if (y.quizFirst==null) y.quizFirst=R.correct; } }
  markDay();
  const mastered = w && !wasGoldWorld && worldStars(p,w)===w.skills.length*3;
  if (mastered) stampCert(p,'master:'+w.id);
  const fresh=checkBadges(); save();
  const lvUp=level(p.xp)>oldLv;
  const title = {daily:'Daily challenge complete!', mend:`${R.correct} mistake${R.correct===1?'':'s'} fixed!`, spelltest:'Spelling test done!', spell:'Spelling practice done!', read:'Reading done!', quiz:'Weekly quiz done!', smart:'Smart practice done!', review:'Review done!'}[R.mode]
    || (medalNew?`${LVN[medalNew-1]} medal!`:passed?'Great work!':pc>=.4?'Good effort!':'Keep practising!');
  const results = R.mode==='spelltest' ? `<div class="list left mt8">${R.qs.map(q=>`<div class="item ${q.ok?'':'wrongrow'}"><span class="em">${q.ok?'✅':'❌'}</span><span class="grow">${q.ok?`<b>${escH(q.answer)}</b>`:(d=>`You wrote <b>${d.ga||'(nothing)'}</b><br>Correct: <b>${d.cb}</b>`)(diffHTML(q.given||'',q.answer))}</span></div>`).join('')}</div>` : '';
  app.innerHTML = `<div class="card center">${heronSVG(p.look,'h110 bounce')}<h2>${title}</h2>
    ${k?`<div class="muted b">${k.name} · ${LVI[R.lv-1]} ${LVN[R.lv-1]}</div><div class="bigmedals">${medalStr(p.best[R.skill])}</div>`:''}
    <div class="f20 b">${R.correct} / ${n} correct</div>
    ${results}
    ${masteryEndHTML(p)}
    <div class="reward"><div>⭐ +${R.points} XP</div><div>🪙 +${coins} coins${R.mode==='daily'?' (×2)':''}</div></div>
    ${medalNew?`<div class="fb good"><h3>${LVI[medalNew-1]} You earned the ${LVN[medalNew-1]} medal!</h3>${unlocked?`<p>${LVN[unlocked-1]} level unlocked: ${escH(k.lvl[unlocked-1])}.</p>`:''}</div>`:''}
    ${k&&!passed?`<p class="muted">You need ${passNeed(n)} out of ${n} to earn the ${LVN[R.lv-1]} medal. ${stepDown?`Plume has moved you to ${LVN[curLv(R.skill)-1]} for some practice first. Your medals are safe.`:`Open the 📘 Learn card for <b>${k.name}</b> and try again!`}</p>`:''}
    ${lvUp?`<div class="fb good"><h3>🎉 Level up! You're now level ${level(p.xp)}</h3></div>`:''}
    ${mastered?`<div class="fb good"><h3>🏅 Gold in every skill of ${w.name}!</h3><p>That earns you a Master certificate. Find it in Badges → Certificates.</p></div>`:''}
    ${badgeHTML(fresh)}
    <div class="row mt"><button class="btn ghost grow" id="bw">${(R.mode==='round'||R.week)?'← Back':'🏠 Home'}</button>${R.mode==='round'?`<button class="btn grow" id="ag">${unlocked?`Try ${LVN[unlocked-1]} ${LVI[unlocked-1]}`:'Again ↻'}</button>`:''}${R.mode==='smart'?`<button class="btn grow" id="ag">Keep going 🎯</button>`:''}</div></div>`;
  if (medalNew||st>=2||fresh.length||lvUp){ confetti(); sfx.win(); }
  const back=R.back||screenHome; $('#bw').onclick=()=>back();
  if (R.mode==='smart'){ const sid=R.skill; $('#ag').onclick=()=>startSmart(sid, back); }
  if (R.mode==='round'){ const sid=R.skill, nl=unlocked||R.lv; $('#ag').onclick=()=>startRound(sid, unlocked?nl:(stepDown?curLv(sid):R.lv), back); }
}

const REVIEW_DAYS = [1, 2, 4, 8, 16, 32];
const addDays = (d, n) => { const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.toLocaleDateString('en-CA'); };
const daysBetween = (a, b) => Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const niceDate = d => { const n=daysBetween(today(), d); return n<=0?'today':n===1?'tomorrow':`in ${n} days`; };
const isDue = (p, sid) => { const m=p.mast&&p.mast[sid]; return !!(m && m.rv && m.rv<=today()); };
const dueSkills = p => ALLSKILLS.filter(k=>!k.round && k.id!=='sp-bee' && isDue(p,k.id))
  .sort((a,b)=>(p.mast[a.id].rv.localeCompare(p.mast[b.id].rv)) || ((mastery(p,a.id)||0)-(mastery(p,b.id)||0)));

/* After a round, schedule the next review of each skill practised: do well and the gap grows; struggle and it comes back soon. */
function scheduleFromRound(p){
  if (!R.res || ['spelltest','spell','test','read'].includes(R.mode)) return;
  const min = R.mode==='review' ? 2 : 3;
  Object.entries(R.res).forEach(([sid,[c,t]])=>{ const m=p.mast[sid]; if (!m || t<min || sid==='sp-bee') return;
    const acc=c/t; if (acc>=.8) m.box=Math.min(5,(m.box||0)+1); else if (acc<.6) m.box=Math.max(0,(m.box||0)-2);
    m.rv=addDays(today(), REVIEW_DAYS[m.box||0]); });
}

function dailySkills(p){
  const pool=ALLSKILLS.filter(k=>!k.round && k.id!=='sp-bee');
  const weak=pool.filter(k=>{ const v=mastery(p,k.id); return v!=null && v<60; }).sort((a,b)=>mastery(p,a.id)-mastery(p,b.id));
  const wk=(YEAR[curWeek()-1]||YEAR[0]).skills.map(SK).filter(k=>k&&!k.round);
  const pick=[];
  [...dueSkills(p).slice(0,2), ...weak.slice(0,2), ...wk, ...shuffle(pool)].forEach(k=>{ if (pick.length<5 && !pick.includes(k)) pick.push(k); });
  return shuffle(pick);
}

function startReview(){
  stopTimers(); const p=P(), due=dueSkills(p).slice(0,4); if (!due.length) return screenHome();
  const per = due.length===1?5 : due.length===2?4 : due.length===3?3 : 2, qs=[], seen=new Set();
  due.forEach(k=>{ let n=0, g=0; while (n<per && g++<80){ const q=makeQ(k.id), key=qKey(q); if (seen.has(key)) continue; seen.add(key); qs.push(q); n++; } });
  R={mode:'review', qs:shuffle(qs), i:0, correct:0, streak:0, points:0, back:()=>screenHome()};
  renderRoundQ();
}

/* Smart practice: each question is chosen from the learner's current ability. Two right in a row: a harder one. A wrong one: an easier one. */
function smartQ(){
  const sid=R.skill, p=P(), m=p.mast[sid], th=m?m.th:startLv()+0.3;
  const t=th+(R.streak>=2?0.45:0)-(R.wrongRow>=1?0.4:0), L=Math.min(3,Math.max(1,thLevel(t)));
  R.seen=R.seen||new Set(); let q, g=0;
  do { q=makeQ(sid,L); } while (R.seen.has(qKey(q)) && g++<60);
  R.seen.add(qKey(q)); return q;
}

function svgImg(svg, w, h){
  return new Promise(res=>{ const img=new Image();
    img.onload=()=>res(img); img.onerror=()=>res(null);
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ',`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `)); });
}
function wrapText(x, text, cx, y, maxW, lh){
  const words=text.split(' '); let line='', lines=[];
  words.forEach(w=>{ const t=line?line+' '+w:w; if (x.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; });
  if (line) lines.push(line); lines.forEach((l,i)=>x.fillText(l, cx, y+i*lh)); return lines.length;
}
async function drawCert(cv, c, p){
  const x=cv.getContext('2d'), W=cv.width, H=cv.height;

  const bg=x.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#fffdf6'); bg.addColorStop(1,'#fff4dc'); x.fillStyle=bg; x.fillRect(0,0,W,H);

  x.lineWidth=30; x.strokeStyle='#1f2756'; x.strokeRect(15,15,W-30,H-30);
  x.lineWidth=5; x.strokeStyle='#a4924c'; x.strokeRect(50,50,W-100,H-100);
  x.lineWidth=2; x.strokeRect(62,62,W-124,H-124);
  [[50,50],[W-50,50],[50,H-50],[W-50,H-50]].forEach(([cx,cy])=>{ x.beginPath(); x.arc(cx,cy,18,0,7); x.fillStyle='#a4924c'; x.fill(); x.beginPath(); x.arc(cx,cy,8,0,7); x.fillStyle='#1f2756'; x.fill(); });
  x.textAlign='center'; x.textBaseline='alphabetic';
  x.fillStyle='#1f2756'; x.font='800 28px Nunito'; try{ x.letterSpacing='6px'; }catch(e){}
  x.fillText('HERONBRIDGE ENGLISH  ·  HERON WORD QUEST', W/2, 135); try{ x.letterSpacing='0px'; }catch(e){}
  x.font='800 88px "Baloo 2", Nunito, sans-serif'; x.fillStyle='#1f2756'; x.fillText(c.title, W/2, 235);
  x.font='700 30px Nunito, sans-serif'; x.fillStyle='#5b6478'; x.fillText('This certificate is proudly awarded to', W/2, 305);
  let fs=100; x.font=`800 ${fs}px "Baloo 2", Nunito, sans-serif`; while (x.measureText(p.name).width>820 && fs>50){ fs-=6; x.font=`800 ${fs}px "Baloo 2", Nunito, sans-serif`; }
  x.fillStyle='#c99000'; x.fillText(p.name, W/2, 415);
  x.fillStyle='#f5b700'; x.fillRect(W/2-320, 437, 640, 5);
  x.font='700 34px Nunito, sans-serif'; x.fillStyle='#1d2433'; wrapText(x, c.line+'.', W/2, 500, 860, 48);

function rainWord(m, good){
  if (m.spell){ const [w]=rnd(SPELL); if (good) return w; const v=rnd(mutate(w.toLowerCase())); return w[0]===w[0].toUpperCase()?cap1(v):v; }
  return rnd(good?m.good:m.bad);
}
function startRain(id){
  stopTimers(); const m=RAIN_MODES.find(x=>x.id===id), p=P();
  A={m, score:0, hearts:3, combo:0, bestCombo:0, t:0, spawnIn:.2, words:[], over:false, caught:0, missed:[], wrong:[], last:0};
  app.innerHTML = `<div class="qtop"><button class="x" id="quit" aria-label="Quit">✕</button><div class="grow center"><span class="rtarget" style="background:${m.color}">${m.icon} Tap the ${m.target}!</span></div><div class="pts" id="rs">0</div></div>
   <div class="rainhud"><span id="rh">❤️❤️❤️</span><span class="grow center" id="rc"></span><span class="b" id="rt">60s</span></div>
   <div class="rtimebar"><i id="rtb"></i></div>
   <div class="rainfield" id="rf"><div class="cd" id="cd">3</div><div class="pond"><span class="pondheron">${heronSVG(p.look,'h70')}</span><span class="ripple"></span></div></div>`;
  $('#quit').onclick=()=>screenArcade();
  const run=A; let n=3;
  const step=()=>{ if (run.over||A!==run) return; const cd=$('#cd'); if (!cd) return;
    if (n>0){ cd.textContent=n; cd.classList.remove('go'); void cd.offsetWidth; cd.classList.add('go'); tone([440],'sine',.08,.08); n--; setTimeout(step,650); }
    else { cd.textContent='GO!'; tone([880],'sine',.12,.1); setTimeout(()=>cd.remove(),500); A.last=performance.now(); rafId=requestAnimationFrame(rainTick); } };
  step();
}
function rainHud(){
  if (!$('#rh')) return;
  $('#rh').textContent='❤️'.repeat(Math.max(0,A.hearts))+'🤍'.repeat(3-Math.max(0,A.hearts));
  $('#rs').textContent=A.score; $('#rc').innerHTML=A.combo>=3?`<span class="combo">🔥 x${A.combo} combo!</span>`:'';
}
function rainTick(now){
  if (!A||A.over) return;
  const field=$('#rf'); if (!field) return;
  const dt=Math.min(.05,(now-A.last)/1000); A.last=now; A.t+=dt;
  const H=field.clientHeight-62, W=field.clientWidth;
  A.spawnIn-=dt;
  if (A.spawnIn<=0){ spawnDrop(field,W); A.spawnIn=Math.max(.55, 1.2-A.t*.011); }
  const speed=55+A.t*1.25;
  A.words.forEach(w=>{ if (w.dead) return; w.y+=w.v*speed*dt; w.el.style.transform=`translate(${w.x}px,${w.y}px)`;
    if (w.y>H){ w.dead=true; w.el.classList.add('splash'); setTimeout(()=>w.el.remove(),420);
      if (w.good){ A.combo=0; A.missed.push(w.text); rainHud(); } } });
  A.words=A.words.filter(w=>!w.dead);
  const left=Math.max(0,60-A.t); $('#rt').textContent=Math.ceil(left)+'s'; $('#rtb').style.width=(left/60*100)+'%';
  if (left<=10) $('#rt').classList.add('urgent');
  if (left<=0) return endRain();
  rafId=requestAnimationFrame(rainTick);
}
function spawnDrop(field,W){
  const good=Math.random()<.5, text=rainWord(A.m,good);
  const el=document.createElement('button'); el.className='drop'; el.textContent=text; field.appendChild(el);
  const w={el, good, text, x:5+Math.random()*Math.max(10,W-el.offsetWidth-10), y:-44, v:1+Math.random()*.35, dead:false};
  el.style.transform=`translate(${w.x}px,${w.y}px)`;
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); hitDrop(w); });
  A.words.push(w);
}
function hitDrop(w){
  if (w.dead||!A||A.over) return; w.dead=true;
  if (w.good){ A.combo++; A.bestCombo=Math.max(A.bestCombo,A.combo); const pts=10+Math.min(A.combo-1,10)*2; A.score+=pts; A.caught++; sfx.pop(); w.el.dataset.pts='+'+pts; w.el.classList.add('pop'); }
  else { A.hearts--; A.combo=0; A.wrong.push(w.text); sfx.bad(); w.el.classList.add('nope'); const f=$('#rf'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    if (A.hearts<=0){ A.over=true; setTimeout(()=>{ if ($('#rf')) endRain(); },500); } }
  setTimeout(()=>w.el.remove(),480); rainHud();
}
function endRain(){
  if (!A||A.done) return; A.done=true; A.over=true; if (rafId) cancelAnimationFrame(rafId); rafId=null;
  const p=P(), m=A.m, prev=p.arcade[m.id]||0, best=A.score>prev, oldLv=level(p.xp);
  const xp=Math.round(A.score/2), coins=Math.floor(A.score/15);

  app.innerHTML = `<div class="card center">${heronSVG(p.look,'h110 bounce')}<h2>${A.hearts<=0?'Out of hearts!':"Time's up!"}</h2>
    <div class="bigscore">${A.score}</div><div class="muted b">${best?'🎉 NEW BEST SCORE!':`Your best: ${Math.max(prev,A.score)}`}</div>
    <div class="reward"><div>🎯 ${A.caught} caught</div><div>🔥 best combo ${A.bestCombo}</div><div>⭐ +${xp} XP</div><div>🪙 +${coins}</div></div>
    ${level(p.xp)>oldLv?`<div class="fb good"><h3>🎉 Level up! You're now level ${level(p.xp)}</h3></div>`:''}
    ${badgeHTML(fresh)}
